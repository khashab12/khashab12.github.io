name: Sync Yousef demos

on:
  push:
    branches: [team]
    paths: [scripts/sync-yousef.sh, .github/workflows/sync-yousef.yml]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: team
      - run: bash scripts/sync-yousef.sh
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898+github-actions[bot]@users.noreply.github.com"
          git add public/y
          git commit -m "Sync Yousef's demo sites and previews" || echo "nothing to commit"
          git push
