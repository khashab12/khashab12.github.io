    <script>
      // Low-end phones get a lighter visual layer (no live blur, still colour fields).
      try {
        var nv = navigator
        if ((nv.hardwareConcurrency && nv.hardwareConcurrency <= 4) || (nv.deviceMemory && nv.deviceMemory <= 3)) document.documentElement.classList.add('lite')
      } catch (e) {}
      // Apply a saved English preference before first paint to avoid a flash of RTL.
      try {
        var l = new URLSearchParams(location.search).get('lang') || localStorage.getItem('lang')
        if (l === 'en') { document.documentElement.lang = 'en'; document.documentElement.dir = 'ltr' }
      } catch (e) {}
    </script>
