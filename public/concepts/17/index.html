<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Concept 17</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#2a4033">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700;800&family=Pacifico&family=IBM+Plex+Sans+Arabic:wght@400;500;600&display=swap" media="print" onload="this.media='all'"><noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700;800&family=Pacifico&family=IBM+Plex+Sans+Arabic:wght@400;500;600&display=swap"></noscript>
<style>
*,*::before,*::after{box-sizing:border-box}
body{margin:0;overflow-x:hidden;-webkit-font-smoothing:antialiased;line-height:1.55;padding-bottom:env(safe-area-inset-bottom,0px)}
.demo-note{text-align:center;font-size:.8rem;padding:.45rem 1rem}
.empty{text-align:center;padding:3rem 1rem;opacity:.75}
button{font:inherit}

:root{--green:#2a4033;--maroon:#6b2430;--tile:#7a2b37;--mauve:#ddd3cf;--plum:#6d4b73;--paper:#faf8f6;--card:#ffffff;--ink:#1f2420;--soft:#7a7470;--line:#e8e1dc}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--paper:#131614;--card:#1c201d;--ink:#eee9e4;--soft:#a9a29c;--line:#2e332f;--mauve:#2c2628}}
:root[data-theme="dark"]{--paper:#131614;--card:#1c201d;--ink:#eee9e4;--soft:#a9a29c;--line:#2e332f;--mauve:#2c2628}
body{background:var(--paper);color:var(--ink);font-family:"IBM Plex Sans Arabic","Rubik",system-ui,sans-serif}
html[lang=en] body{font-family:"Rubik","IBM Plex Sans Arabic",sans-serif}
.demo-note{background:var(--green);color:#fff}

header{position:relative;text-align:center;background:var(--green);color:#f4efe9;padding:calc(env(safe-area-inset-top,0px) + 3.2rem) 1.2rem 1.6rem}
header::after{content:"";position:absolute;left:0;right:0;bottom:-18px;height:18px;background:repeating-linear-gradient(90deg,var(--tile) 0 16px,#8a3542 16px 18px,var(--tile) 18px 34px,#5c1f29 34px 36px);box-shadow:inset 0 -3px 0 rgba(0,0,0,.2)}
.lang{position:absolute;top:calc(env(safe-area-inset-top,0px) + .8rem);inset-inline-end:1rem;background:#f4efe9;color:var(--green);border:0;border-radius:999px;padding:.25rem .95rem;cursor:pointer;min-height:36px;font-size:.8rem;z-index:2}
#logo{position:relative;display:inline-block;padding:.6rem 1.2rem;background:var(--green);direction:ltr}
.wm{font:800 3.1rem/1 "Rubik";letter-spacing:.02em;color:#f4efe9}
.sc{position:absolute;left:50%;top:44%;transform:translate(-50%,-50%) rotate(-6deg);font:400 2.3rem/1 "Pacifico",cursive;color:#b58fc0;opacity:.95;white-space:nowrap}
.sub{font:500 .62rem "Rubik";letter-spacing:.32em;margin-top:.3rem;color:#cdd8cf}
.tg{font:400 1.25rem "Pacifico",cursive;color:#cdd8cf;margin:.7rem 0 0;direction:ltr}
.info{font-size:.8rem;color:#b7c5bb;margin:.4rem 0 0}
.bar{position:sticky;top:0;z-index:5;background:var(--paper);border-bottom:1px solid var(--line);margin-top:18px}
.bar-in{max-width:560px;margin:0 auto;padding:.7rem 1.2rem .4rem}
.search input{width:100%;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:.55rem 1rem;font:inherit}
.chips{display:flex;gap:.4rem;overflow-x:auto;padding:.5rem 0 .1rem;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:.3rem .95rem;cursor:pointer;min-height:36px;font-size:.84rem}
.chip[aria-pressed="true"]{background:var(--maroon);border-color:var(--maroon);color:#fff}
.chip:focus-visible,.lang:focus-visible,.search input:focus-visible{outline:2px solid var(--plum);outline-offset:2px}
main{max-width:560px;margin:0 auto;padding:.5rem 1.2rem 1.5rem}
section{margin-top:1.8rem;scroll-margin-top:120px}

h2{display:flex;justify-content:space-between;align-items:center;margin:0 0 .3rem;background:var(--mauve);padding:.55rem .9rem;border-radius:6px;font:600 1.05rem "IBM Plex Sans Arabic"}
h2 small{font:800 .95rem "Rubik";letter-spacing:.08em;text-transform:uppercase;color:var(--green);direction:ltr}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) h2 small{color:#9fc1aa}}
.row{display:grid;grid-template-columns:1fr auto auto;align-items:center;gap:.9rem;padding:.6rem .2rem;border-bottom:1px solid var(--line)}
.nm .a{display:block;font-weight:500}
.nm .e{display:block;font:500 .78rem "Rubik";color:var(--soft);direction:ltr;text-align:start}
html[dir=rtl] .nm .e{text-align:right}
.kc{font:400 .72rem "Rubik";color:var(--soft);white-space:nowrap;display:flex;align-items:center;gap:.25rem}
.kc svg{width:12px;height:12px;color:var(--plum)}
.pr{font:700 1.05rem "Rubik";direction:ltr;white-space:nowrap;color:var(--maroon);min-width:3.2rem;text-align:end}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .pr{color:#e39aa5}}
.pr small{font:500 .64rem "Rubik";color:var(--soft);margin-inline-start:.2rem}
.sl{margin:0 .15rem;color:var(--soft)}
.legend{margin-top:1.6rem;font-size:.76rem;color:var(--soft);display:flex;align-items:center;gap:.35rem}
.legend svg{width:13px;height:13px;color:var(--plum)}
.foot{text-align:center;color:var(--soft);font-size:.8rem;padding:.5rem 1rem 2.2rem}.foot strong{color:var(--ink)}

</style>
</head>
<body>
<div class="demo-note" id="demoNote" hidden></div>

<header>
  <button class="lang" id="langBtn">English</button>
  <div id="logo"><span class="concept-wm" style="display:block;font-family:'Rubik',serif;font-weight:700;font-size:clamp(2.2rem,11vw,3.4rem);line-height:1.05;letter-spacing:-.01em;direction:ltr;white-space:nowrap">Concept 17</span></div>
  <p class="tg">Specialty Coffee</p>
  <p class="info" id="info"></p>
</header>

<div class="bar"><div class="bar-in">
  <div class="search"><input id="q" type="search" aria-label="Search"></div>
  <nav class="chips" id="chips" aria-label="Categories"></nav>
</div></div>
<main id="menu"></main>
<footer class="foot"><p id="note"></p><p id="credit"></p></footer>
<script>
const CONFIG = {"name":"Concept 17","nameAr":"Concept 17","tagline":{"ar":"Specialty Coffee","en":"Specialty Coffee"},"info":{"ar":"الرياض","en":"Riyadh"},"logo":"","colors":{"primary":"#2a4033","onPrimary":"#f4efe9","secondary":"#6b2430","background":"#faf8f6","accent":"#6d4b73"},"fonts":{"display":"Rubik","body":"IBM Plex Sans Arabic"},"pattern":"glazed tile strip","currency":{"ar":"ر.س","en":"SAR"},"demoBanner":false,"credit":"محمد","categories":[{"id":"hot","ar":"ساخنة","en":"Hot","items":[{"ar":"اسبريسو","en":"Espresso","p":11,"c":5},{"ar":"قهوة اليوم","en":"Coffee Of The Day","p":13,"c":5},{"ar":"اميركانو","en":"Americano","p":13,"c":5},{"ar":"كورتادو","en":"Cortado","p":14,"c":15,"m":1},{"ar":"فلات وايت","en":"Flat White","p":16,"c":120,"m":1},{"ar":"كابتشينو","en":"Cappuccino","p":16,"c":130,"m":1},{"ar":"قهوة مقطرة","en":"Drip Coffee","p":18,"c":5},{"ar":"لاتيه","en":"Latte","p":18,"c":206,"m":1},{"ar":"سبانيش لاتيه","en":"Spanish Latte","p":19,"c":250,"m":1},{"ar":"ماتشا","en":"Matcha","p":21,"c":180,"m":1}]},{"id":"cold","ar":"باردة","en":"Cold","items":[{"ar":"قهوة اليوم","en":"Coffee Of The Day","p":13,"c":5},{"ar":"اميركانو","en":"Americano","p":13,"c":5},{"ar":"لاتيه","en":"Latte","p":18,"c":206,"m":1},{"ar":"سبانيش لاتيه","en":"Spanish Latte","p":19,"c":250,"m":1},{"ar":"قهوة مقطرة","en":"Drip Coffee","p":19,"c":5},{"ar":"ماتشا","en":"Matcha","p":21,"c":240,"m":1},{"ar":"شاي بارد","en":"Ice Tea","p":21,"c":100},{"ar":"ماتشا كرز","en":"Cherry Matcha","p":23,"c":180,"m":1}]},{"id":"sweet","ar":"الحلى","en":"Sweets","items":[{"ar":"روكي رود","en":"Rocky Road","p":12,"c":260},{"ar":"ماجيك بار","en":"Magic Bar","p":12,"c":280},{"ar":"كاكاو ترفل","en":"Truffle Coconut","p":13,"c":210},{"ar":"براوني بينت بتر","en":"Brownie Peanut Butter","p":14,"c":290},{"ar":"رازبيري كريم بايتس","en":"White Bites","p":14,"c":180},{"ar":"تارت بيكان","en":"Pecan Tart","p":14,"c":370},{"ar":"تيراميسو","en":"Tiramisu","p":22,"c":380},{"ar":"تشيز كيك بيري","en":"Cheesecake","p":22,"c":410},{"ar":"كيكة العسل","en":"Honey Cake","p":23,"c":390},{"ar":"تيراميسو بلوبيري ليمون","en":"Lemon Tiramisu","p":24,"c":360},{"ar":"بانوفي","en":"Banoffee","p":25,"c":420}]},{"id":"bakery","ar":"المخبوزات","en":"Bakery","items":[{"ar":"دانيش طحينية","en":"Danish Tahina","p":18,"c":320},{"ar":"دانيش كريم بروليه","en":"Danish Crème Brûlée","p":20,"c":350},{"ar":"ساندويتش تشيز","en":"Cheese Focaccia","p":22,"c":440},{"ar":"ساندويتش تونا","en":"Tuna Focaccia","p":22,"c":430},{"ar":"ساندويتش تركي","en":"Turkey Focaccia","p":24,"c":460}]}]};
const C = CONFIG || {name:"Menu",categories:[]};
const T = {"ar": {"dir": "rtl", "lang": "English", "search": "وش تبي تطلب؟", "empty": "ما لقينا شي بهالاسم.", "all": "الكل", "demo": "", "note": "", "cal": "سعرة", "milk": "يحتوي على حليب · الأسعار بالريال والسعرات بالكيلو كالوري"}, "en": {"dir": "ltr", "lang": "العربية", "search": "What would you like?", "empty": "Nothing matches that.", "all": "All", "demo": "", "note": "", "cal": "kcal", "milk": "Contains milk · Prices in SAR, calories in kcal"}};
let lang="ar", active="all", query="";
const KEY="Concept 17-lang";
try{const s=localStorage.getItem(KEY);if(s==="ar"||s==="en")lang=s;}catch(e){}
try{const u=new URLSearchParams(location.search).get("lang");if(u==="ar"||u==="en")lang=u;}catch(e){}
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmt=n=>lang==="ar"?Number(n).toLocaleString("ar-EG"):Number(n).toLocaleString("en-US");
const cur=()=> (C.currency||{ar:"",en:""})[lang];
const L=(o,ar,en)=> lang==="ar" ? (o[ar]||o[en]||"") : (o[en]||o[ar]||"");
const P=i=> i.p2!=null ? `${fmt(i.p)}<span class="sl">/</span>${fmt(i.p2)}` : fmt(i.p);

const MILK='<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true"><path d="M5.5 1.5h5v2l1.5 2.5v8.5h-8V6l1.5-2.5z"/><path d="M4 8h8"/></svg>';
function hero(){ $("info").textContent=L(C.info||{},"ar","en"); }
function section(c,ci,body){ return `<section id="cat-${esc(c.id)}"><h2><span>${esc(c.ar)}</span><small>${esc(c.en)}</small></h2>${body}</section>`; }
function item(i){ return `<div class="row"><span class="nm"><span class="a">${esc(lang==="ar"?i.ar:i.en)}</span>${lang==="ar"?`<span class="e">${esc(i.en)}</span>`:""}</span><span class="kc">${i.m?MILK:""}${fmt(i.c)} ${T[lang].cal}</span><span class="pr">${P(i)}<small>${cur()}</small></span></div>`; }
function afterRender(){ if(query.trim()) return; $("menu").insertAdjacentHTML("beforeend",`<p class="legend">${MILK}${T[lang].milk}</p>`); }

function renderChips(){
  const cats=[{id:"all",ar:T.ar.all,en:T.en.all},...C.categories];
  $("chips").innerHTML=cats.map(c=>`<button class="chip" data-id="${esc(c.id)}" aria-pressed="${c.id===active}">${esc(L(c,"ar","en"))}</button>`).join("");
  $("chips").querySelectorAll(".chip").forEach(b=>b.onclick=()=>{
    active=b.dataset.id;renderChips();
    if(active==="all"){window.scrollTo({top:0});return;}
    const el=$("cat-"+active); if(el) el.scrollIntoView({behavior:matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth",block:"start"});
  });
}
function renderMenu(){
  const q=query.trim().toLowerCase(); let html="",n=0,k=0;
  C.categories.forEach((c,ci)=>{
    const items=c.items.filter(i=>!q||[i.ar,i.en,i.dAr,i.dEn].join(" ").toLowerCase().includes(q));
    if(!items.length) return; n+=items.length;
    html+=section(c,ci,items.map(i=>item(i,++k,c)).join(""));
  });
  $("menu").innerHTML=n?html:`<p class="empty">${T[lang].empty}</p>`;
  if(typeof afterRender==="function") afterRender();
}
function apply(){
  const t=T[lang]; document.documentElement.lang=lang; document.documentElement.dir=t.dir;
  $("langBtn").textContent=t.lang; $("q").placeholder=t.search;
  const note=$("demoNote"); note.hidden=!C.demoBanner; note.textContent=t.demo;
  $("note").textContent=t.note||"";
  $("credit").innerHTML=(lang==="ar"?"منيو ديجيتال من تصميم ":"Digital menu designed by ")+`<strong>${lang==="en"?"Mohamed":"محمد"}</strong>`;
  if(typeof hero==="function") hero();
  renderChips(); renderMenu();
}
$("langBtn").onclick=()=>{lang=lang==="ar"?"en":"ar";try{localStorage.setItem(KEY,lang)}catch(e){}apply();};
$("q").addEventListener("input",e=>{query=e.target.value;renderMenu();});
apply();
</script>
<script>(function(){if(window.parent===window)return;var s=0,t=0;function send(m){try{parent.postMessage(m,"*")}catch(e){}}
addEventListener("scroll",function(){if(!s){s=1;send("concept-scrolled")}},{passive:true});
addEventListener("pointerdown",function(){if(!t){t=1;send("concept-touched")}},{passive:true})})()</script>
</body>
</html>
