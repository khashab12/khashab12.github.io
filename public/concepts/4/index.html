<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Concept 4</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#1e2b52">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@300;400;600;700&family=League+Spartan:wght@500;700&display=swap" media="print" onload="this.media='all'"><noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@300;400;600;700&family=League+Spartan:wght@500;700&display=swap"></noscript>
<style>
*,*::before,*::after{box-sizing:border-box}
body{margin:0;overflow-x:hidden;-webkit-font-smoothing:antialiased;line-height:1.55;padding-bottom:env(safe-area-inset-bottom,0px)}
.demo-note{text-align:center;font-size:.8rem;padding:.45rem 1rem}
.empty{text-align:center;padding:3rem 1rem;opacity:.75}
button{font:inherit}

:root{--cream:#f4ecdc;--card:#fbf6ec;--orange:#e2622b;--navy:#1e2b52;--ink:#1e2b52;--soft:#6a6f86;--line:#e3d6bf}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--cream:#101629;--card:#18203a;--ink:#f4ecdc;--soft:#b3b7c9;--line:#2b3556}}
:root[data-theme="dark"]{--cream:#101629;--card:#18203a;--ink:#f4ecdc;--soft:#b3b7c9;--line:#2b3556}
body{background:var(--cream);color:var(--ink);font-family:"Readex Pro",system-ui,sans-serif}
.demo-note{background:var(--navy);color:var(--cream)}
header{position:relative;max-width:560px;margin:0 auto;padding:calc(env(safe-area-inset-top,0px) + 3.2rem) 1.2rem 1.4rem;text-align:center;overflow:hidden}

.q1{position:absolute;top:0;inset-inline-start:0;width:120px;height:130px;background:repeating-linear-gradient(90deg,var(--orange) 0 44px,#f3a37d 44px 47px,var(--orange) 47px 58px);border-end-end-radius:120px 130px}
.q2{position:absolute;top:0;inset-inline-end:0;width:110px;height:150px;background:var(--navy);border-end-start-radius:10px}
.q2::before{content:"";position:absolute;inset:18px 18px 0 18px;border:2px solid #d9b36a;border-bottom:0;border-radius:40px 40px 0 0}
.q2::after{content:"";position:absolute;width:30px;height:30px;border-radius:50%;background:var(--orange);bottom:-12px;inset-inline-start:-12px}
.lang{position:absolute;top:calc(env(safe-area-inset-top,0px) + .8rem);left:50%;transform:translateX(-50%);background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:999px;padding:.25rem .9rem;cursor:pointer;min-height:36px;font-size:.8rem;z-index:2}
#logo{position:relative;display:inline-block;padding:.6rem 1rem;background:var(--cream);margin-top:2.4rem}
.ar1{font:600 3rem/1 "Readex Pro";color:var(--navy);margin:0}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .ar1,:root:not([data-theme="light"]) .en1{color:#f4ecdc}}
:root[data-theme="dark"] .ar1,:root[data-theme="dark"] .en1{color:#f4ecdc}
.en1{font:700 2.2rem/1 "League Spartan";letter-spacing:.14em;color:var(--navy);direction:ltr}
.dia{display:block;width:8px;height:8px;background:var(--orange);transform:rotate(45deg);margin:.5rem auto}
.sub{font:400 .95rem "Readex Pro";color:var(--orange);display:flex;align-items:center;justify-content:center;gap:.6rem}
.sub::before,.sub::after{content:"";width:28px;height:1.5px;background:var(--orange)}
.info{position:relative;font-size:.8rem;color:var(--soft);margin:.7rem 0 0}
.bar{position:sticky;top:0;z-index:5;background:var(--cream);border-bottom:1px solid var(--line)}
.bar-in{max-width:560px;margin:0 auto;padding:.6rem 1.2rem .4rem}
.search input{width:100%;border:1.5px solid var(--navy);background:var(--card);color:var(--ink);border-radius:999px;padding:.55rem 1rem;font:inherit}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .search input{border-color:var(--line)}}
.chips{display:flex;gap:.4rem;overflow-x:auto;padding:.5rem 0 .1rem;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:.3rem .95rem;cursor:pointer;min-height:36px;font-size:.84rem}
.chip[aria-pressed="true"]{background:var(--orange);border-color:var(--orange);color:#fff}
.chip:focus-visible,.lang:focus-visible,.search input:focus-visible{outline:2px solid var(--orange);outline-offset:2px}
main{max-width:560px;margin:0 auto;padding:.5rem 1.2rem 1.5rem}
section{margin-top:1.6rem;scroll-margin-top:120px}
.sh{display:flex;align-items:center;gap:.7rem;margin-bottom:.4rem}
.ic{width:46px;height:46px;border-radius:50%;background:var(--navy);display:grid;place-items:center;flex:0 0 auto}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .ic{background:var(--orange)}}
.ic svg{width:24px;height:24px}
h2{margin:0;font:600 1.2rem "Readex Pro";display:flex;align-items:center;gap:.4rem;border-bottom:2px solid var(--orange);padding-bottom:.1rem}
h2::before{content:"";width:7px;height:7px;background:var(--orange);transform:rotate(45deg)}
.row{display:flex;align-items:baseline;gap:.4rem;padding:.42rem 0}
.nm{font-weight:400}
.dots{flex:1;border-bottom:1.5px dotted color-mix(in srgb,var(--ink) 35%,transparent);transform:translateY(-4px)}
.pr{font-weight:600;white-space:nowrap;direction:ltr}.pr small{font-size:.68rem;font-weight:400;color:var(--soft);margin-inline-start:.2rem}
.add{display:block;margin:.5rem auto 0;width:max-content;max-width:100%;border:1.5px solid var(--orange);color:var(--orange);border-radius:6px;padding:.15rem .8rem;font-size:.8rem}
.foot{text-align:center;color:var(--soft);font-size:.8rem;padding:.5rem 1rem 2.2rem}.foot strong{color:var(--ink)}

</style>
</head>
<body>
<div class="demo-note" id="demoNote" hidden></div>

<header>
  <span class="q1" aria-hidden="true"></span><span class="q2" aria-hidden="true"></span>
  <button class="lang" id="langBtn">English</button>
  <div id="logo"><span class="concept-wm" style="display:block;font-family:'League Spartan',serif;font-weight:700;font-size:clamp(2.2rem,11vw,3.4rem);line-height:1.05;letter-spacing:-.01em;direction:ltr;white-space:nowrap">Concept 4</span><span id="sub" hidden></span></div>
  <p class="info" id="info"></p>
</header>

<div class="bar"><div class="bar-in">
  <div class="search"><input id="q" type="search" aria-label="Search"></div>
  <nav class="chips" id="chips" aria-label="Categories"></nav>
</div></div>
<main id="menu"></main>
<footer class="foot"><p id="note"></p><p id="credit"></p></footer>
<script>
const CONFIG = {"name":"Concept 4","nameAr":"Concept 4","tagline":{"ar":"لقهوة المختصة","en":"Specialty Coffee"},"info":{"ar":"الرياض","en":"Riyadh"},"logo":"","colors":{"primary":"#1e2b52","onPrimary":"#f4ecdc","secondary":"#e2622b","background":"#f4ecdc","accent":"#e2622b"},"fonts":{"display":"League Spartan","body":"Readex Pro"},"pattern":"arches + diamonds","currency":{"ar":"ر.س","en":"SAR"},"demoBanner":false,"credit":"محمد","categories":[{"id":"hot","icon":"hot","add":1,"ar":"المشروبات الساخنة","en":"Hot Drinks","items":[{"ar":"قهوة اليوم (كبير)","en":"Coffee of the Day (L)","p":7.5},{"ar":"V60","en":"V60","p":10.95},{"ar":"إسبريسو","en":"Espresso","p":6.95},{"ar":"إسبريسو دبل","en":"Double Espresso","p":8.95},{"ar":"كابتشينو","en":"Cappuccino","p":9.95},{"ar":"لاتيه","en":"Latte","p":9.95},{"ar":"وايت موكا","en":"White Mocha","p":12.95},{"ar":"فلات وايت","en":"Flat White","p":8.95},{"ar":"لاتيه ماتشا","en":"Matcha Latte","p":13.95},{"ar":"ماتشا","en":"Matcha","p":12.95},{"ar":"شاي","en":"Tea","p":5}]},{"id":"cold","icon":"cold","add":1,"ar":"المشروبات الباردة","en":"Cold Drinks","items":[{"ar":"قهوة اليوم (كبير)","en":"Iced Coffee of the Day (L)","p":7.5},{"ar":"V60","en":"Iced V60","p":10.95},{"ar":"آيس كركديه","en":"Iced Karkadeh","p":8.95},{"ar":"آيس وايت موكا","en":"Iced White Mocha","p":12.95},{"ar":"آيس لاتيه","en":"Iced Latte","p":9.95},{"ar":"آيس أمريكانو","en":"Iced Americano","p":10.95},{"ar":"آيس ماتشا","en":"Iced Matcha","p":12.95},{"ar":"آيس لاتيه ماتشا","en":"Iced Matcha Latte","p":13.95},{"ar":"موهيتو","en":"Mojito","p":9.95},{"ar":"ماء","en":"Water","p":1}]},{"id":"sweet","icon":"sweet","ar":"الحلى والمخبوزات","en":"Sweets & Bakery","items":[{"ar":"كوكيز","en":"Cookies","p":6.95},{"ar":"كوكيز بيكان","en":"Pecan Cookies","p":7.95},{"ar":"كيكة العسل","en":"Honey Cake","p":10.95},{"ar":"براونيز","en":"Brownies","p":6.95},{"ar":"تشيز كيك سنكرس","en":"Snickers Cheesecake","p":10.95}]}]};
const C = CONFIG || {name:"Menu",categories:[]};
const T = {"ar": {"dir": "rtl", "lang": "English", "search": "وش تبي تشرب؟", "empty": "ما لقينا شي بهالاسم.", "all": "الكل", "demo": "", "note": "نعتز بخدمتكم في Concept 4", "sub": "لقهوة المختصة", "add": "إضافة أي نكهة بـ ٢ ر.س"}, "en": {"dir": "ltr", "lang": "العربية", "search": "What are you drinking?", "empty": "Nothing matches that.", "all": "All", "demo": "", "note": "Proud to serve you at Concept 4", "sub": "Specialty Coffee", "add": "Add any flavor for 2 SAR"}};
let lang="ar", active="all", query="";
const KEY="Concept 4-lang";
try{const s=localStorage.getItem(KEY);if(s==="ar"||s==="en")lang=s;}catch(e){}
try{const u=new URLSearchParams(location.search).get("lang");if(u==="ar"||u==="en")lang=u;}catch(e){}
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmt=n=>lang==="ar"?Number(n).toLocaleString("ar-EG"):Number(n).toLocaleString("en-US");
const cur=()=> (C.currency||{ar:"",en:""})[lang];
const L=(o,ar,en)=> lang==="ar" ? (o[ar]||o[en]||"") : (o[en]||o[ar]||"");
const P=i=> i.p2!=null ? `${fmt(i.p)}<span class="sl">/</span>${fmt(i.p2)}` : fmt(i.p);

const ICON={hot:'<svg viewBox="0 0 24 24" fill="none" stroke="#f4ecdc" stroke-width="1.8" stroke-linecap="round"><path d="M4 10h13v4a6 6 0 0 1-6 6h-1a6 6 0 0 1-6-6z"/><path d="M17 12h1.5a2.5 2.5 0 0 1 0 5H17"/><path d="M8 3c-1 1.3 1 2 0 3.3M12 3c-1 1.3 1 2 0 3.3"/></svg>',
 cold:'<svg viewBox="0 0 24 24" fill="none" stroke="#f4ecdc" stroke-width="1.8" stroke-linecap="round"><path d="M6 7h12l-1.5 14h-9z"/><path d="M13 7l2-5 3 1"/><rect x="9" y="11" width="3" height="3"/><rect x="12" y="15" width="3" height="3"/></svg>',
 sweet:'<svg viewBox="0 0 24 24" fill="none" stroke="#f4ecdc" stroke-width="1.8" stroke-linejoin="round"><path d="M3 14l16-6v8H3z"/><path d="M3 14v5h16v-3"/><path d="M8 12l6-2"/></svg>'};
function hero(){ $("info").textContent=L(C.info||{},"ar","en"); $("sub").textContent=T[lang].sub; }
function section(c,ci,body){ return `<section id="cat-${esc(c.id)}"><div class="sh"><span class="ic">${ICON[c.icon]||""}</span><h2>${esc(L(c,"ar","en"))}</h2></div>${body}${c.add?`<span class="add">${T[lang].add}</span>`:""}</section>`; }
function item(i){ return `<div class="row"><span class="nm">${esc(L(i,"ar","en"))}</span><span class="dots"></span><span class="pr">${fmt(i.p)}<small>${cur()}</small></span></div>`; }

function renderChips(){
  const cats=[{id:"all",ar:T.ar.all,en:T.en.all},...C.categories];
  $("chips").innerHTML=cats.map(c=>`<button class="chip" data-id="${esc(c.id)}" aria-pressed="${c.id===active}">${esc(L(c,"ar","en"))}</button>`).join("");
  $("chips").querySelectorAll(".chip").forEach(b=>b.onclick=()=>{
    active=b.dataset.id;renderChips();
    if(active==="all"){window.scrollTo({top:0});return;}
    const el=$("cat-"+active); if(el) el.scrollIntoView({behavior:matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth",block:"start"});
  });
}
function renderMenu(){
  const q=query.trim().toLowerCase(); let html="",n=0,k=0;
  C.categories.forEach((c,ci)=>{
    const items=c.items.filter(i=>!q||[i.ar,i.en,i.dAr,i.dEn].join(" ").toLowerCase().includes(q));
    if(!items.length) return; n+=items.length;
    html+=section(c,ci,items.map(i=>item(i,++k,c)).join(""));
  });
  $("menu").innerHTML=n?html:`<p class="empty">${T[lang].empty}</p>`;
  if(typeof afterRender==="function") afterRender();
}
function apply(){
  const t=T[lang]; document.documentElement.lang=lang; document.documentElement.dir=t.dir;
  $("langBtn").textContent=t.lang; $("q").placeholder=t.search;
  const note=$("demoNote"); note.hidden=!C.demoBanner; note.textContent=t.demo;
  $("note").textContent=t.note||"";
  $("credit").innerHTML=(lang==="ar"?"منيو ديجيتال من تصميم ":"Digital menu designed by ")+`<strong>${lang==="en"?"Mohamed":"محمد"}</strong>`;
  if(typeof hero==="function") hero();
  renderChips(); renderMenu();
}
$("langBtn").onclick=()=>{lang=lang==="ar"?"en":"ar";try{localStorage.setItem(KEY,lang)}catch(e){}apply();};
$("q").addEventListener("input",e=>{query=e.target.value;renderMenu();});
apply();
</script>
<script>(function(){if(window.parent===window)return;var s=0,t=0;function send(m){try{parent.postMessage(m,"*")}catch(e){}}
addEventListener("scroll",function(){if(!s){s=1;send("concept-scrolled")}},{passive:true});
addEventListener("pointerdown",function(){if(!t){t=1;send("concept-touched")}},{passive:true})})()</script>
</body>
</html>
