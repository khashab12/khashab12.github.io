<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Concept 24</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#5ad4dc">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=League+Spartan:wght@500;700;800&family=Readex+Pro:wght@400;500;700&display=swap">
<style>
*,*::before,*::after{box-sizing:border-box}
body{margin:0;overflow-x:hidden;-webkit-font-smoothing:antialiased;line-height:1.55;padding-bottom:env(safe-area-inset-bottom,0px)}
.demo-note{text-align:center;font-size:.8rem;padding:.45rem 1rem}
.empty{text-align:center;padding:3rem 1rem;opacity:.75}
button{font:inherit}

:root{--sky:#5ad4dc;--sky2:#bff0f2;--cloud:#ffffff;--brown:#6b5448;--orange:#f08a4b;--ink:#4a3a31;--soft:#7d6a5f}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--sky:#0f3a40;--sky2:#0b2226;--cloud:#173338;--ink:#e9f7f8;--soft:#a9c9cc;--brown:#e9f7f8}}
:root[data-theme="dark"]{--sky:#0f3a40;--sky2:#0b2226;--cloud:#173338;--ink:#e9f7f8;--soft:#a9c9cc;--brown:#e9f7f8}
body{background:linear-gradient(180deg,var(--sky) 0,var(--sky2) 520px,var(--sky2));color:var(--ink);font-family:"League Spartan","Readex Pro",system-ui,sans-serif}
html[lang=ar] body{font-family:"Readex Pro","League Spartan",sans-serif}
.demo-note{background:var(--brown);color:#fff}
header{position:relative;max-width:560px;margin:0 auto;padding:calc(env(safe-area-inset-top,0px) + 3rem) 1.2rem 2.4rem;text-align:center;overflow:hidden}
.lang{position:absolute;top:calc(env(safe-area-inset-top,0px) + .8rem);inset-inline-end:1rem;background:var(--cloud);color:var(--ink);border:0;border-radius:999px;padding:.3rem .95rem;cursor:pointer;min-height:36px;font-size:.82rem;font-weight:700;z-index:2}
.puff{position:absolute;background:var(--cloud);border-radius:999px;opacity:.9}
.puff::before,.puff::after{content:"";position:absolute;background:inherit;border-radius:50%}
.p1{width:120px;height:34px;top:70px;left:-20px}.p1::before{width:56px;height:56px;top:-26px;left:22px}.p1::after{width:40px;height:40px;top:-16px;left:62px}
.p2{width:100px;height:28px;top:170px;right:-10px}.p2::before{width:46px;height:46px;top:-22px;left:16px}.p2::after{width:34px;height:34px;top:-12px;left:50px}
#logo{position:relative;display:inline-block;padding:.8rem 1.2rem;background:var(--sky);border-radius:14px}
.nm1{font:800 3.6rem/.9 "League Spartan";color:#fff;letter-spacing:.06em;direction:ltr;text-shadow:3px 3px 0 var(--brown)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .nm1{text-shadow:3px 3px 0 #000}}
.hand{display:inline-block;background:var(--orange);color:#fff;border-radius:999px;padding:.1rem .7rem;font:700 .72rem "League Spartan";letter-spacing:.2em;margin-top:.5rem;direction:ltr}
.spec{font:500 .8rem "League Spartan";letter-spacing:.3em;color:#fff;margin-top:.4rem;direction:ltr}
.info{position:relative;font-size:.82rem;color:var(--ink);margin:.8rem 0 0;font-weight:500}
.bar{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--sky2) 92%,transparent);backdrop-filter:blur(6px)}
.bar-in{max-width:560px;margin:0 auto;padding:.6rem 1.2rem .4rem}
.search input{width:100%;border:0;background:var(--cloud);color:var(--ink);border-radius:999px;padding:.6rem 1.1rem;font:inherit;box-shadow:0 4px 14px -8px rgba(0,0,0,.3)}
.chips{display:flex;gap:.45rem;overflow-x:auto;padding:.55rem 0 .2rem;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;border:0;background:var(--cloud);color:var(--ink);border-radius:999px;padding:.3rem 1rem;cursor:pointer;min-height:36px;font-weight:700;font-size:.88rem}
.chip[aria-pressed="true"]{background:var(--orange);color:#fff}
.chip:focus-visible,.lang:focus-visible,.search input:focus-visible{outline:3px solid var(--orange);outline-offset:2px}
main{max-width:560px;margin:0 auto;padding:.5rem 1.2rem 1.5rem}

section{position:relative;margin-top:2.6rem;background:var(--cloud);border-radius:28px;padding:1.2rem 1.1rem .8rem;scroll-margin-top:120px;box-shadow:0 10px 24px -16px rgba(0,60,70,.45)}
section::before,section::after{content:"";position:absolute;background:var(--cloud);border-radius:50%;z-index:0}
section::before{width:84px;height:84px;top:-30px;inset-inline-start:26px}
section::after{width:58px;height:58px;top:-18px;inset-inline-start:96px}
section>*{position:relative;z-index:1}
h2{margin:0 0 .4rem;font:800 1.6rem "League Spartan";color:var(--brown);text-transform:uppercase;letter-spacing:.04em}
html[lang=ar] h2{font:700 1.35rem "Readex Pro"}
.hd,.row{display:grid;grid-template-columns:1fr 3.4rem 3.4rem;align-items:center;gap:.3rem}
.hd{font:700 .7rem "League Spartan";letter-spacing:.15em;color:var(--orange);text-align:center;padding-bottom:.2rem;border-bottom:2px solid var(--sky)}
.hd span:first-child{text-align:start}
.row{padding:.45rem 0;border-bottom:1px solid color-mix(in srgb,var(--sky) 45%,transparent)}
.row:last-child{border-bottom:0}
.nm{font-weight:500}
.pr{text-align:center;font-weight:700;direction:ltr}
.pr.one{grid-column:2/4}
.cur{font-size:.75rem;color:var(--soft);text-align:end;margin-top:.3rem}
.foot{text-align:center;color:var(--soft);font-size:.8rem;padding:.5rem 1rem 2.2rem}.foot strong{color:var(--ink)}

</style>
</head>
<body>
<div class="demo-note" id="demoNote" hidden></div>

<header>
  <span class="puff p1" aria-hidden="true"></span><span class="puff p2" aria-hidden="true"></span>
  <button class="lang" id="langBtn">English</button>
  <div id="logo"><span class="concept-wm" style="display:block;font-family:'League Spartan',serif;font-weight:700;font-size:clamp(2.2rem,11vw,3.4rem);line-height:1.05;letter-spacing:-.01em;direction:ltr;white-space:nowrap">Concept 24</span></div>
  <p class="info" id="info"></p>
</header>

<div class="bar"><div class="bar-in">
  <div class="search"><input id="q" type="search" aria-label="Search"></div>
  <nav class="chips" id="chips" aria-label="Categories"></nav>
</div></div>
<main id="menu"></main>
<footer class="foot"><p id="note"></p><p id="credit"></p></footer>
<script>
const CONFIG = {"name":"Concept 24","nameAr":"Concept 24","tagline":{"ar":"Specialty Coffee","en":"Specialty Coffee"},"info":{"ar":"القاهرة","en":"Cairo"},"logo":"","colors":{"primary":"#5ad4dc","onPrimary":"#ffffff","secondary":"#6b5448","background":"#bff0f2","accent":"#f08a4b"},"fonts":{"display":"League Spartan","body":"Readex Pro"},"pattern":"clouds","currency":{"ar":"ج.م","en":"EGP"},"demoBanner":false,"credit":"محمد","categories":[{"id":"hot","ar":"قهوة سخنة","en":"Hot Coffee","items":[{"ar":"إسبريسو","en":"Espresso","p":85},{"ar":"إسبريسو ماكياتو","en":"Espresso Macchiato","p":100},{"ar":"أمريكانو","en":"Americano","p":90},{"ar":"كورتادو","en":"Cortado","p":95},{"ar":"كابتشينو","en":"Cappuccino","p":90},{"ar":"كوفي لاتيه","en":"Coffee Latte","p":110,"p2":125},{"ar":"فلات وايت","en":"Flat White","p":95},{"ar":"سبانش لاتيه","en":"Spanish Latte","p":135,"p2":150},{"ar":"موكا","en":"Mocha","p":150,"p2":165},{"ar":"وايت موكا","en":"White Mocha","p":160,"p2":175},{"ar":"كراميل ماكياتو لاتيه","en":"Caramel Macchiato Latte","p":135,"p2":150},{"ar":"سولتد كراميل لاتيه","en":"Salted Caramel Latte","p":135,"p2":150},{"ar":"مياه فوّارة","en":"Sparkling Water","p":50}]},{"id":"iced","ar":"قهوة ساقعة","en":"Iced Coffee","items":[{"ar":"آيس لاتيه","en":"Ice Latte","p":125},{"ar":"آيس سبانش لاتيه","en":"Ice Spanish Latte","p":150},{"ar":"آيس بيستاشيو لاتيه","en":"Ice Pistachio Latte","p":180},{"ar":"آيس سولتد كراميل لاتيه","en":"Ice Salted Caramel Latte","p":150},{"ar":"آيس وايت شوكليت","en":"Ice White Chocolate","p":180},{"ar":"آيس موكا","en":"Ice Mocha","p":170},{"ar":"آيس كراميل ماكياتو","en":"Ice Caramel Macchiato","p":160}]}]};
const C = CONFIG || {name:"Menu",categories:[]};
const T = {"ar": {"dir": "rtl", "lang": "English", "search": "دوّر على مشروب…", "empty": "مفيش حاجة بالاسم ده.", "all": "الكل", "demo": "", "note": "", "m": "وسط", "l": "كبير"}, "en": {"dir": "ltr", "lang": "العربية", "search": "Find a drink…", "empty": "Nothing matches that.", "all": "All", "demo": "", "note": "", "m": "M", "l": "L"}};
let lang="ar", active="all", query="";
const KEY="Concept 24-lang";
try{const s=localStorage.getItem(KEY);if(s==="ar"||s==="en")lang=s;}catch(e){}
try{const u=new URLSearchParams(location.search).get("lang");if(u==="ar"||u==="en")lang=u;}catch(e){}
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmt=n=>lang==="ar"?Number(n).toLocaleString("ar-EG"):Number(n).toLocaleString("en-US");
const cur=()=> (C.currency||{ar:"",en:""})[lang];
const L=(o,ar,en)=> lang==="ar" ? (o[ar]||o[en]||"") : (o[en]||o[ar]||"");
const P=i=> i.p2!=null ? `${fmt(i.p)}<span class="sl">/</span>${fmt(i.p2)}` : fmt(i.p);

function hero(){ $("info").textContent=L(C.info||{},"ar","en"); }
function section(c,ci,body){ const t=T[lang]; return `<section id="cat-${esc(c.id)}"><h2>${esc(L(c,"ar","en"))}</h2><div class="hd"><span></span><span>${t.m}</span><span>${t.l}</span></div>${body}<div class="cur">${cur()}</div></section>`; }
function item(i){ const pr=i.p2!=null?`<span class="pr">${fmt(i.p)}</span><span class="pr">${fmt(i.p2)}</span>`:`<span class="pr one">${fmt(i.p)}</span>`; return `<div class="row"><span class="nm">${esc(L(i,"ar","en"))}</span>${pr}</div>`; }

function renderChips(){
  const cats=[{id:"all",ar:T.ar.all,en:T.en.all},...C.categories];
  $("chips").innerHTML=cats.map(c=>`<button class="chip" data-id="${esc(c.id)}" aria-pressed="${c.id===active}">${esc(L(c,"ar","en"))}</button>`).join("");
  $("chips").querySelectorAll(".chip").forEach(b=>b.onclick=()=>{
    active=b.dataset.id;renderChips();
    if(active==="all"){window.scrollTo({top:0});return;}
    const el=$("cat-"+active); if(el) el.scrollIntoView({behavior:matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth",block:"start"});
  });
}
function renderMenu(){
  const q=query.trim().toLowerCase(); let html="",n=0,k=0;
  C.categories.forEach((c,ci)=>{
    const items=c.items.filter(i=>!q||[i.ar,i.en,i.dAr,i.dEn].join(" ").toLowerCase().includes(q));
    if(!items.length) return; n+=items.length;
    html+=section(c,ci,items.map(i=>item(i,++k,c)).join(""));
  });
  $("menu").innerHTML=n?html:`<p class="empty">${T[lang].empty}</p>`;
  if(typeof afterRender==="function") afterRender();
}
function apply(){
  const t=T[lang]; document.documentElement.lang=lang; document.documentElement.dir=t.dir;
  $("langBtn").textContent=t.lang; $("q").placeholder=t.search;
  const note=$("demoNote"); note.hidden=!C.demoBanner; note.textContent=t.demo;
  $("note").textContent=t.note||"";
  $("credit").innerHTML=(lang==="ar"?"منيو ديجيتال من تصميم ":"Digital menu designed by ")+`<strong>${lang==="en"?"Mohamed":"محمد"}</strong>`;
  if(typeof hero==="function") hero();
  renderChips(); renderMenu();
}
$("langBtn").onclick=()=>{lang=lang==="ar"?"en":"ar";try{localStorage.setItem(KEY,lang)}catch(e){}apply();};
$("q").addEventListener("input",e=>{query=e.target.value;renderMenu();});
apply();
</script>
</body>
</html>
