<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Concept 31</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0b1060">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;800&family=Readex+Pro:wght@400;500;700&display=swap" media="print" onload="this.media='all'"><noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;800&family=Readex+Pro:wght@400;500;700&display=swap"></noscript>
<style>
*,*::before,*::after{box-sizing:border-box}
body{margin:0;overflow-x:hidden;-webkit-font-smoothing:antialiased;line-height:1.55;padding-bottom:env(safe-area-inset-bottom,0px)}
.demo-note{text-align:center;font-size:.8rem;padding:.45rem 1rem}
.empty{text-align:center;padding:3rem 1rem;opacity:.75}
button{font:inherit}

:root{--navy:#0b1060;--navy2:#151b7a;--cream:#f3efe4;--matcha:#8cc63f;--pink:#f2a7b8;--blue:#8fa8e8;--rust:#b5503a;--ink:#0b1060;--soft:#555a8c;--card:#ffffff;--paper:#f3efe4}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--paper:#070a3a;--card:#11165a;--ink:#f3efe4;--soft:#b7bae0}}
:root[data-theme="dark"]{--paper:#070a3a;--card:#11165a;--ink:#f3efe4;--soft:#b7bae0}
body{background:var(--paper);color:var(--ink);font-family:"Readex Pro",system-ui,sans-serif}
.demo-note{background:var(--matcha);color:var(--navy)}
header{position:relative;background:var(--navy);color:var(--cream);text-align:center;padding:calc(env(safe-area-inset-top,0px) + 3.6rem) 1.2rem 1.8rem}

header::before{content:"";position:absolute;top:0;left:0;right:0;height:34px;background:radial-gradient(circle at 50% 0,var(--cream) 0 17px,transparent 18px) 0 0/44px 34px repeat-x}
.lang{position:absolute;top:calc(env(safe-area-inset-top,0px) + 2.6rem);inset-inline-end:1rem;background:var(--rust);color:#fff;border:0;border-radius:999px;padding:.25rem .9rem;cursor:pointer;min-height:36px;font-size:.8rem;z-index:2}
#logo{display:inline-flex;align-items:center;gap:.4rem;padding:.6rem .9rem;background:var(--navy);direction:ltr}
.mascot{width:74px;height:74px}
.wm{font:800 2.4rem/.85 "Playfair Display",serif;text-align:left;letter-spacing:.02em}
.wm span{display:block}
.tg{font-size:.9rem;margin:.6rem 0 0;color:#d9dcf5;direction:ltr}
.info{font-size:.78rem;color:#b7bae0;margin:.3rem 0 0}
.bar{position:sticky;top:0;z-index:5;background:var(--paper);border-bottom:2px solid var(--navy)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .bar{border-color:var(--card)}}
.bar-in{max-width:560px;margin:0 auto;padding:.6rem 1.2rem .4rem}
.search input{width:100%;border:2px solid var(--navy);background:var(--card);color:var(--ink);border-radius:999px;padding:.55rem 1rem;font:inherit}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .search input{border-color:var(--soft)}}
.chips{display:flex;gap:.4rem;overflow-x:auto;padding:.5rem 0 .1rem;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;border:0;background:var(--card);color:var(--ink);border-radius:999px;padding:.3rem .95rem;cursor:pointer;min-height:36px;font-size:.85rem;font-weight:500;box-shadow:inset 0 0 0 1.5px var(--navy)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .chip{box-shadow:inset 0 0 0 1.5px var(--soft)}}
.chip[aria-pressed="true"]{background:var(--matcha);color:var(--navy);box-shadow:none}
.chip:focus-visible,.lang:focus-visible,.search input:focus-visible{outline:3px solid var(--rust);outline-offset:2px}
main{max-width:560px;margin:0 auto;padding:.5rem 1.2rem 1.5rem}
section{margin-top:1.7rem;scroll-margin-top:120px}
h2{margin:0 0 .7rem;font:800 1.5rem "Playfair Display",serif}
html[lang=ar] h2{font:700 1.3rem "Readex Pro"}
.cups{display:grid;grid-template-columns:repeat(2,1fr);gap:.7rem}

.cup{background:var(--card);border-radius:18px;padding:.8rem .7rem .9rem;text-align:center;box-shadow:0 8px 18px -14px rgba(11,16,96,.6)}
.glass{width:56px;height:70px;margin:0 auto .5rem;border-radius:6px 6px 14px 14px;background:linear-gradient(180deg,var(--top,#f3efe4) 0 30%,var(--matcha) 30%);border:2px solid var(--navy);position:relative}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .glass{border-color:var(--cream)}}
.glass::before{content:"";position:absolute;top:-8px;left:-5px;right:-5px;height:8px;border-radius:6px 6px 0 0;background:var(--navy)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .glass::before{background:var(--cream)}}
.cn{font-weight:700;font-size:.95rem;line-height:1.3}
.cd{font-size:.72rem;color:var(--soft);margin:.2rem 0 .4rem;line-height:1.4}
.cp{display:inline-block;background:var(--navy);color:var(--cream);border-radius:999px;padding:.05rem .7rem;font-weight:700;direction:ltr}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .cp{background:var(--matcha);color:var(--navy)}}
.cp small{font-size:.65rem;margin-inline-start:.2rem}
.cal{display:block;font-size:.7rem;color:var(--soft);margin-top:.25rem}
.row{display:flex;justify-content:space-between;gap:.6rem;padding:.55rem .2rem;border-bottom:1.5px dashed color-mix(in srgb,var(--ink) 25%,transparent);font-weight:500}
.row span:last-child{direction:ltr}
.dallah{margin-top:1.7rem;background:var(--navy);color:var(--cream);border-radius:18px;padding:1rem;text-align:center;position:relative;overflow:hidden}
.dallah b{display:block;font:800 2rem "Playfair Display";color:var(--matcha);direction:ltr}
.dallah small{color:var(--pink)}
.foot{text-align:center;color:var(--soft);font-size:.8rem;padding:.5rem 1rem 2.2rem}.foot strong{color:var(--ink)}

</style>
</head>
<body>
<div class="demo-note" id="demoNote" hidden></div>

<header>
  <button class="lang" id="langBtn">English</button>
  <div id="logo"><span class="concept-wm" style="display:block;font-family:'Playfair Display',serif;font-weight:700;font-size:clamp(2.2rem,11vw,3.4rem);line-height:1.05;letter-spacing:-.01em;direction:ltr;white-space:nowrap">Concept 31</span></div>
  <p class="tg" id="tg"></p>
  <p class="info" id="info"></p>
</header>

<div class="bar"><div class="bar-in">
  <div class="search"><input id="q" type="search" aria-label="Search"></div>
  <nav class="chips" id="chips" aria-label="Categories"></nav>
</div></div>
<main id="menu"></main>
<footer class="foot"><p id="note"></p><p id="credit"></p></footer>
<script>
const CONFIG = {"name":"Concept 31","nameAr":"Concept 31","tagline":{"ar":"Specialty Coffee","en":"Specialty Coffee"},"info":{"ar":"الرياض","en":"Riyadh"},"logo":"","colors":{"primary":"#0b1060","onPrimary":"#f3efe4","secondary":"#8cc63f","background":"#f3efe4","accent":"#b5503a"},"fonts":{"display":"Playfair Display","body":"Readex Pro"},"pattern":"awning scallops","currency":{"ar":"ر.س","en":"SAR"},"demoBanner":false,"credit":"محمد","categories":[{"id":"matcha","ar":"ماتشا باردة","en":"Iced Matcha","items":[{"ar":"آيس Concept 31","en":"Iced Re Matcha","dAr":"خلطتنا الخاصة بالحليب وشراب الفانيلا، مع كريمة ناعمة","dEn":"Our signature matcha blend with milk and vanilla syrup, topped with smooth cream","p":24,"c":130,"top":"#f3efe4"},{"ar":"آيس ري سينامون","en":"Iced Re Cinnamon","dAr":"ماتشا بالحليب والعسل والقرفة مع رغوة كريمية","dEn":"Matcha with milk, honey and cinnamon, topped with creamy foam","p":22,"c":140,"top":"#d8a36a"},{"ar":"آيس ري بينك","en":"Iced Re Pink","dAr":"ماتشا بالحليب وشراب التوت الأحمر مع رغوة ناعمة","dEn":"Matcha with milk and raspberry syrup, topped with smooth foam","p":22,"c":130,"top":"#f2a7b8"},{"ar":"آيس ري بلو","en":"Iced RE Blue","dAr":"ماتشا بالحليب وشراب البلوبيري مع رغوة كريمية","dEn":"Matcha with milk and blueberry syrup, topped with creamy foam","p":22,"c":130,"top":"#8fa8e8"},{"ar":"آيس ماتشا لاتيه","en":"Iced Matcha Latte","dAr":"ماتشا كلاسيك بالفانيلا مع الحليب","dEn":"Classic vanilla matcha latte with milk","p":22,"c":110,"top":"#e9f3d6"}]},{"id":"more","ar":"وأكثر","en":"More","list":true,"items":[{"ar":"قهوة اليوم","en":"Coffee of the Day","p":10},{"ar":"ماء","en":"Water","p":2},{"ar":"حليب نباتي (جوز هند، شوفان، لوز)","en":"Plant-based milk (coconut, oat, almond)","p":3,"plus":1},{"ar":"حليب خالي من اللاكتوز","en":"Lactose-free milk","p":0,"plus":1}]}]};
const C = CONFIG || {name:"Menu",categories:[]};
const T = {"ar": {"dir": "rtl", "lang": "English", "search": "وش مزاجك اليوم؟", "empty": "ما لقينا شي بهالاسم.", "all": "الكل", "demo": "", "note": "", "cal": "سعرة", "tg": "انعش يومك، جدّد طاقتك، وكرر الطقس 🍵", "d1": "دلة الماتشا", "d2": "لفترة محدودة!"}, "en": {"dir": "ltr", "lang": "العربية", "search": "What's your mood today?", "empty": "Nothing matches that.", "all": "All", "demo": "", "note": "", "cal": "cal", "tg": " 🍵", "d1": "Matcha Dallah", "d2": "Limited time!"}};
let lang="ar", active="all", query="";
const KEY="Concept 31-lang";
try{const s=localStorage.getItem(KEY);if(s==="ar"||s==="en")lang=s;}catch(e){}
try{const u=new URLSearchParams(location.search).get("lang");if(u==="ar"||u==="en")lang=u;}catch(e){}
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmt=n=>lang==="ar"?Number(n).toLocaleString("ar-EG"):Number(n).toLocaleString("en-US");
const cur=()=> (C.currency||{ar:"",en:""})[lang];
const L=(o,ar,en)=> lang==="ar" ? (o[ar]||o[en]||"") : (o[en]||o[ar]||"");
const P=i=> i.p2!=null ? `${fmt(i.p)}<span class="sl">/</span>${fmt(i.p2)}` : fmt(i.p);

function hero(){ $("info").textContent=L(C.info||{},"ar","en"); $("tg").textContent=T[lang].tg; }
function section(c,ci,body){ return `<section id="cat-${esc(c.id)}"><h2>${esc(L(c,"ar","en"))}</h2><div class="${c.list?"":"cups"}">${body}</div></section>`; }
function item(i,k,c){
  if(c.list) return `<div class="row"><span>${esc(L(i,"ar","en"))}</span><span>${i.plus?"+":""}${fmt(i.p)} ${cur()}</span></div>`;
  return `<div class="cup"><div class="glass" style="--top:${i.top||"#f3efe4"}"></div><div class="cn">${esc(L(i,"ar","en"))}</div><div class="cd">${esc(L(i,"dAr","dEn"))}</div><span class="cp">${fmt(i.p)}<small>${cur()}</small></span><span class="cal">${fmt(i.c)} ${T[lang].cal}</span></div>`; }
function afterRender(){ if(query.trim()) return; const t=T[lang]; $("menu").insertAdjacentHTML("beforeend",`<div class="dallah">${t.d1}<b>${fmt(75)} ${cur()}</b><small>${t.d2}</small></div>`); }

function renderChips(){
  const cats=[{id:"all",ar:T.ar.all,en:T.en.all},...C.categories];
  $("chips").innerHTML=cats.map(c=>`<button class="chip" data-id="${esc(c.id)}" aria-pressed="${c.id===active}">${esc(L(c,"ar","en"))}</button>`).join("");
  $("chips").querySelectorAll(".chip").forEach(b=>b.onclick=()=>{
    active=b.dataset.id;renderChips();
    if(active==="all"){window.scrollTo({top:0});return;}
    const el=$("cat-"+active); if(el) el.scrollIntoView({behavior:matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth",block:"start"});
  });
}
function renderMenu(){
  const q=query.trim().toLowerCase(); let html="",n=0,k=0;
  C.categories.forEach((c,ci)=>{
    const items=c.items.filter(i=>!q||[i.ar,i.en,i.dAr,i.dEn].join(" ").toLowerCase().includes(q));
    if(!items.length) return; n+=items.length;
    html+=section(c,ci,items.map(i=>item(i,++k,c)).join(""));
  });
  $("menu").innerHTML=n?html:`<p class="empty">${T[lang].empty}</p>`;
  if(typeof afterRender==="function") afterRender();
}
function apply(){
  const t=T[lang]; document.documentElement.lang=lang; document.documentElement.dir=t.dir;
  $("langBtn").textContent=t.lang; $("q").placeholder=t.search;
  const note=$("demoNote"); note.hidden=!C.demoBanner; note.textContent=t.demo;
  $("note").textContent=t.note||"";
  $("credit").innerHTML=(lang==="ar"?"منيو ديجيتال من تصميم ":"Digital menu designed by ")+`<strong>${lang==="en"?"Mohamed":"محمد"}</strong>`;
  if(typeof hero==="function") hero();
  renderChips(); renderMenu();
}
$("langBtn").onclick=()=>{lang=lang==="ar"?"en":"ar";try{localStorage.setItem(KEY,lang)}catch(e){}apply();};
$("q").addEventListener("input",e=>{query=e.target.value;renderMenu();});
apply();
</script>
<script>(function(){if(window.parent===window)return;var s=0,t=0;function send(m){try{parent.postMessage(m,"*")}catch(e){}}
addEventListener("scroll",function(){if(!s){s=1;send("concept-scrolled")}},{passive:true});
addEventListener("pointerdown",function(){if(!t){t=1;send("concept-touched")}},{passive:true})})()</script>
</body>
</html>
