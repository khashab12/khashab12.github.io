<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<script>(function(){if(window.parent===window)return;var s=0,t=0;function send(m){try{parent.postMessage(m,"*")}catch(e){}}
addEventListener("scroll",function(){if(!s){s=1;send("concept-scrolled")}},{passive:true});
addEventListener("pointerdown",function(){if(!t){t=1;send("concept-touched")}},{passive:true})})()</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Concept 27</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#b08a3e">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Marcellus&family=El+Messiri:wght@400;600;700&family=Cormorant+Garamond:ital,wght@1,600&display=swap" media="print" onload="this.media='all'"><noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Marcellus&family=El+Messiri:wght@400;600;700&family=Cormorant+Garamond:ital,wght@1,600&display=swap"></noscript>
<style>
*,*::before,*::after{box-sizing:border-box}
body{margin:0;overflow-x:hidden;-webkit-font-smoothing:antialiased;line-height:1.55;padding-bottom:env(safe-area-inset-bottom,0px)}
.demo-note{text-align:center;font-size:.8rem;padding:.45rem 1rem}
.empty{text-align:center;padding:3rem 1rem;opacity:.75}
button{font:inherit}

:root{--cream:#f6f0e4;--card:#fffaf0;--gold:#b08a3e;--gold2:#d8b56a;--ink:#3a2f22;--soft:#7a6a55;--line:#e3d5b8}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--cream:#17130e;--card:#221c14;--ink:#f3e9d6;--soft:#c2b194;--line:#4a3d2a;--gold:#d8b56a}}
:root[data-theme="dark"]{--cream:#17130e;--card:#221c14;--ink:#f3e9d6;--soft:#c2b194;--line:#4a3d2a;--gold:#d8b56a}
body{background:var(--cream);color:var(--ink);font-family:"El Messiri","Marcellus",serif}
html[lang=en] body{font-family:"Marcellus","El Messiri",serif}
.demo-note{background:var(--gold);color:#fff}
header{position:relative;max-width:560px;margin:0 auto;padding:calc(env(safe-area-inset-top,0px) + 3rem) 1.2rem 1rem;text-align:center}
.lang{position:absolute;top:calc(env(safe-area-inset-top,0px) + .8rem);inset-inline-end:1rem;background:none;color:var(--gold);border:1px solid var(--gold);border-radius:999px;padding:.25rem .9rem;cursor:pointer;min-height:36px;font-size:.82rem}

.win{position:relative;margin:0 auto;width:240px;padding:2.2rem 1rem 1.2rem;border:2px solid var(--gold);border-radius:120px 120px 10px 10px;background:linear-gradient(180deg,color-mix(in srgb,var(--gold2) 18%,transparent),transparent 70%)}
.win::before{content:"";position:absolute;inset:8px;border:1px solid color-mix(in srgb,var(--gold) 45%,transparent);border-radius:112px 112px 6px 6px;pointer-events:none}
#logo{display:inline-block;padding:.4rem .6rem;background:var(--cream);border-radius:8px}
.mark{font:400 2.3rem/1 "Marcellus",serif;letter-spacing:.14em;color:var(--gold);direction:ltr}
.mark small{display:block;font-size:.8rem;letter-spacing:.5em;margin-top:.3rem;color:var(--ink)}
.ar{font:600 1.05rem "El Messiri";color:var(--soft);margin:.3rem 0 0}
.sill{height:10px;width:270px;margin:0 auto;background:var(--gold);border-radius:0 0 6px 6px;opacity:.85}
.tag{font:italic 600 1.15rem "Cormorant Garamond",serif;color:var(--soft);margin:.8rem 0 0;direction:ltr}
.info{font-size:.8rem;color:var(--soft);margin:.2rem 0 0}
.bar{position:sticky;top:0;z-index:5;background:var(--cream);border-bottom:1px solid var(--line)}
.bar-in{max-width:560px;margin:0 auto;padding:.6rem 1.2rem .4rem}
.search input{width:100%;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:.55rem 1rem;font:inherit}
.chips{display:flex;gap:.45rem;overflow-x:auto;padding:.5rem 0 .1rem;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:.3rem .95rem;cursor:pointer;min-height:36px;font-size:.88rem}
.chip[aria-pressed="true"]{background:var(--gold);border-color:var(--gold);color:#fff}
.chip:focus-visible,.lang:focus-visible,.search input:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
main{max-width:560px;margin:0 auto;padding:.5rem 1.2rem 1.5rem}

section{margin-top:1.5rem;background:var(--card);border:1px solid var(--line);border-radius:90px 90px 14px 14px;padding:2rem 1.2rem 1rem;scroll-margin-top:120px;text-align:center}
h2{margin:0;font:400 1.35rem "Marcellus",serif;color:var(--gold);letter-spacing:.12em;text-transform:uppercase}
html[lang=ar] h2{font:700 1.35rem "El Messiri";letter-spacing:0}
.orn{color:var(--gold);font-size:.8rem;letter-spacing:.4em;margin:.1rem 0 .6rem}
.row{display:flex;align-items:baseline;gap:.5rem;padding:.5rem 0;text-align:start}
.nm{font-weight:600;font-size:1rem}
.sz{font-size:.75rem;color:var(--soft);margin-inline-start:.3rem}
.dots{flex:1;border-bottom:1px dotted color-mix(in srgb,var(--gold) 60%,transparent);transform:translateY(-4px)}
.pr{color:var(--gold);font:400 1.05rem "Marcellus",serif;white-space:nowrap;direction:ltr}
.pr small{font-size:.7rem;margin-inline-start:.2rem}
.foot{text-align:center;color:var(--soft);font-size:.8rem;padding:.5rem 1rem 2.2rem}.foot strong{color:var(--ink)}

</style>
</head>
<body>
<div class="demo-note" id="demoNote" hidden></div>

<header>
  <button class="lang" id="langBtn">English</button>
  <div class="win"><div id="logo"><span class="concept-wm" style="display:block;font-family:'Marcellus',serif;font-weight:700;font-size:clamp(2.2rem,11vw,3.4rem);line-height:1.05;letter-spacing:-.01em;direction:ltr;white-space:nowrap">Concept 27</span></div></div>
  <div class="sill"></div>
  <p class="tag">Specialty Coffee</p>
  <p class="info" id="info"></p>
</header>

<div class="bar"><div class="bar-in">
  <div class="search"><input id="q" type="search" aria-label="Search"></div>
  <nav class="chips" id="chips" aria-label="Categories"></nav>
</div></div>
<main id="menu"></main>
<footer class="foot"><p id="note"></p><p id="credit"></p></footer>
<script>
const CONFIG = {"name":"Concept 27","nameAr":"Concept 27","tagline":{"ar":"Specialty Coffee","en":"Specialty Coffee"},"info":{"ar":"الرياض","en":"Riyadh"},"logo":"","colors":{"primary":"#b08a3e","onPrimary":"#ffffff","secondary":"#3a2f22","background":"#f6f0e4","accent":"#d8b56a"},"fonts":{"display":"Marcellus","body":"El Messiri"},"pattern":"none","currency":{"ar":"ر.س","en":"SAR"},"demoBanner":false,"credit":"محمد","categories":[{"id":"coffee","ar":"قهوة مختصة","en":"Specialty Coffee","items":[{"ar":"قهوة اليوم","en":"Coffee Day","szAr":"صغير ٩ أونص","szEn":"Small 9oz","p":5.75},{"ar":"قهوة اليوم","en":"Coffee Day","szAr":"كبير ١٢ أونص","szEn":"Large 12oz","p":7.75}]},{"id":"bakery","ar":"مخبوزات","en":"Bakery","items":[{"ar":"كرواسون بيكان","en":"Croissant Pecan","p":5.75},{"ar":"كرواسون لوز","en":"Croissant Almond","p":5.75},{"ar":"رول كيك ماربل","en":"Marble Cake Roll","p":5.75},{"ar":"رول كيك ميلو","en":"Milo Cake Roll","p":5.75}]},{"id":"cold","ar":"مشروبات منعشة","en":"Refreshing Drinks","items":[{"ar":"كركديه","en":"Karkadeh","szAr":"صغير","szEn":"Small","p":5.75},{"ar":"كركديه","en":"Karkadeh","szAr":"كبير","szEn":"Large","p":7.75},{"ar":"مويه","en":"Water","p":0.75}]},{"id":"box","ar":"بوكس الجمعات","en":"Gathering Box","items":[{"ar":"بوكس قهوة","en":"Coffee Box","szAr":"١ لتر","szEn":"1L","p":25.75},{"ar":"بوكس كركديه","en":"Karkadeh Box","szAr":"١ لتر","szEn":"1L","p":25.75},{"ar":"بوكس مخبوزات مشكّل","en":"Mixed Bakery Box","szAr":"٨ قطع","szEn":"8 pcs","p":35.75}]}]};
const C = CONFIG || {name:"Menu",categories:[]};
const T = {"ar": {"dir": "rtl", "lang": "English", "search": "دوّر على طلبك…", "empty": "ما لقينا شي بهالاسم.", "all": "الكل", "demo": "", "note": "الأسعار بالريال السعودي"}, "en": {"dir": "ltr", "lang": "العربية", "search": "Find your order…", "empty": "Nothing matches that.", "all": "All", "demo": "", "note": "Prices in Saudi Riyal"}};
let lang="ar", active="all", query="";
const KEY="Concept 27-lang";
try{const s=localStorage.getItem(KEY);if(s==="ar"||s==="en")lang=s;}catch(e){}
try{const u=new URLSearchParams(location.search).get("lang");if(u==="ar"||u==="en")lang=u;}catch(e){}
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmt=n=>lang==="ar"?Number(n).toLocaleString("ar-EG"):Number(n).toLocaleString("en-US");
const cur=()=> (C.currency||{ar:"",en:""})[lang];
const L=(o,ar,en)=> lang==="ar" ? (o[ar]||o[en]||"") : (o[en]||o[ar]||"");
const P=i=> i.p2!=null ? `${fmt(i.p)}<span class="sl">/</span>${fmt(i.p2)}` : fmt(i.p);

function hero(){ $("info").textContent=L(C.info||{},"ar","en"); }
function section(c,ci,body){ return `<section id="cat-${esc(c.id)}"><h2>${esc(L(c,"ar","en"))}</h2><div class="orn">◆ ◆ ◆</div>${body}</section>`; }
function item(i){ const sz=L(i,"szAr","szEn"); return `<div class="row"><span class="nm">${esc(L(i,"ar","en"))}${sz?`<span class="sz">${esc(sz)}</span>`:""}</span><span class="dots"></span><span class="pr">${fmt(i.p)}<small>${cur()}</small></span></div>`; }

function renderChips(){
  const cats=[{id:"all",ar:T.ar.all,en:T.en.all},...C.categories];
  $("chips").innerHTML=cats.map(c=>`<button class="chip" data-id="${esc(c.id)}" aria-pressed="${c.id===active}">${esc(L(c,"ar","en"))}</button>`).join("");
  $("chips").querySelectorAll(".chip").forEach(b=>b.onclick=()=>{
    active=b.dataset.id;renderChips();
    if(active==="all"){window.scrollTo({top:0});return;}
    const el=$("cat-"+active); if(el) el.scrollIntoView({behavior:matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth",block:"start"});
  });
}
function renderMenu(){
  const q=query.trim().toLowerCase(); let html="",n=0,k=0;
  C.categories.forEach((c,ci)=>{
    const items=c.items.filter(i=>!q||[i.ar,i.en,i.dAr,i.dEn].join(" ").toLowerCase().includes(q));
    if(!items.length) return; n+=items.length;
    html+=section(c,ci,items.map(i=>item(i,++k,c)).join(""));
  });
  $("menu").innerHTML=n?html:`<p class="empty">${T[lang].empty}</p>`;
  if(typeof afterRender==="function") afterRender();
}
function apply(){
  const t=T[lang]; document.documentElement.lang=lang; document.documentElement.dir=t.dir;
  $("langBtn").textContent=t.lang; $("q").placeholder=t.search;
  const note=$("demoNote"); note.hidden=!C.demoBanner; note.textContent=t.demo;
  $("note").textContent=t.note||"";
  $("credit").innerHTML=(lang==="ar"?"منيو ديجيتال من تصميم ":"Digital menu designed by ")+`<strong>${lang==="en"?"Mohamed":"محمد"}</strong>`;
  if(typeof hero==="function") hero();
  renderChips(); renderMenu();
}
$("langBtn").onclick=()=>{lang=lang==="ar"?"en":"ar";try{localStorage.setItem(KEY,lang)}catch(e){}apply();};
$("q").addEventListener("input",e=>{query=e.target.value;renderMenu();});
apply();
</script>
</body>
</html>
