<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Concept 25</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#2c2f48">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gochi+Hand&family=Lemonada:wght@400;600;700&family=Rubik:wght@400;500;600&display=swap" media="print" onload="this.media='all'"><noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gochi+Hand&family=Lemonada:wght@400;600;700&family=Rubik:wght@400;500;600&display=swap"></noscript>
<style>
*,*::before,*::after{box-sizing:border-box}
body{margin:0;overflow-x:hidden;-webkit-font-smoothing:antialiased;line-height:1.55;padding-bottom:env(safe-area-inset-bottom,0px)}
.demo-note{text-align:center;font-size:.8rem;padding:.45rem 1rem}
.empty{text-align:center;padding:3rem 1rem;opacity:.75}
button{font:inherit}

:root{--paper:#f7f3ec;--ink:#2c2f48;--soft:#6c6f86;--pink:#e79bb3;--blue:#8fbbe3;--note:#efe3c8;--card:#fffdf8;--line:#d9d3c6}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--paper:#1b1c26;--ink:#f1eee7;--soft:#aeb0c4;--card:#252736;--line:#3a3c50;--note:#3a3526}}
:root[data-theme="dark"]{--paper:#1b1c26;--ink:#f1eee7;--soft:#aeb0c4;--card:#252736;--line:#3a3c50;--note:#3a3526}
body{background:var(--paper);color:var(--ink);font-family:"Rubik","Lemonada",system-ui,sans-serif}
html[lang=ar] body{font-family:"Lemonada","Rubik",system-ui,sans-serif;font-size:15px}
.demo-note{background:var(--ink);color:var(--paper)}
header{position:relative;max-width:560px;margin:0 auto;padding:calc(env(safe-area-inset-top,0px) + 2.8rem) 1.2rem .4rem;text-align:center}
.lang{position:absolute;top:calc(env(safe-area-inset-top,0px) + .5rem);inset-inline-end:1rem;background:var(--card);color:var(--ink);border:1.5px solid var(--ink);border-radius:999px;padding:.25rem .85rem;cursor:pointer;min-height:36px;font-size:.82rem;z-index:2}
#logo{display:inline-block;padding:.6rem .8rem;background:var(--paper)}
.shop{width:220px;height:130px;color:var(--ink);display:block;margin:0 auto}
.word{font:400 3.2rem/1 "Gochi Hand",cursive;margin:.1rem 0 0;letter-spacing:.02em;direction:ltr}
.word b{color:var(--pink);font-weight:400}
.tag{font:400 1.25rem "Gochi Hand",cursive;color:var(--soft);margin:.2rem 0 0;direction:ltr}
.info{font-size:.8rem;color:var(--soft);margin:.3rem 0 0}
.start{display:inline-block;margin-top:1rem;background:var(--ink);color:var(--paper);border-radius:6px;padding:.15rem .7rem;font:400 1rem "Gochi Hand",cursive;transform:rotate(-3deg)}
.bar{position:sticky;top:0;z-index:5;background:var(--paper);border-bottom:1.5px dashed var(--line)}
.bar-in{max-width:560px;margin:0 auto;padding:.6rem 1.2rem .4rem}
.search input{width:100%;border:1.5px solid var(--ink);background:var(--card);color:var(--ink);border-radius:14px;padding:.6rem 1rem;font:inherit}
.chips{display:flex;gap:.45rem;overflow-x:auto;padding:.5rem 0 .1rem;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:.3rem .9rem;cursor:pointer;min-height:36px;font-size:.85rem}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.chip:focus-visible,.lang:focus-visible,.search input:focus-visible{outline:3px solid var(--pink);outline-offset:2px}
main{max-width:560px;margin:0 auto;padding:.5rem 1.2rem 1rem;position:relative}

main::before{content:"";position:absolute;top:0;bottom:0;inset-inline-start:2.05rem;border-inline-start:2.5px dashed var(--soft);opacity:.55}
section{position:relative;padding:1.4rem 0 .4rem;padding-inline-start:2.6rem;scroll-margin-top:120px}
.stop{position:absolute;inset-inline-start:.15rem;top:1.35rem;width:2rem;height:2rem;border-radius:50%;background:var(--ink);color:var(--paper);display:grid;place-items:center;font:400 1.1rem "Gochi Hand",cursive}
h2{margin:0;font:600 1.2rem "Lemonada",sans-serif}
html[lang=en] h2{font:400 1.6rem "Gochi Hand",cursive}
.sticky{display:inline-block;background:var(--note);padding:.3rem .6rem;margin:.4rem 0 .6rem;font:400 1rem "Gochi Hand",cursive;transform:rotate(2deg);box-shadow:0 3px 6px -3px rgba(0,0,0,.25)}
html[dir=rtl] .sticky{transform:rotate(-2deg)}
.it{background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:.65rem .8rem;margin:.5rem 0;display:grid;grid-template-columns:1fr auto;gap:.1rem .6rem}
.it.fav{border-color:var(--pink)}
.nm{font-weight:600;font-size:1rem}
.nm .st{color:var(--pink);margin-inline-end:.25rem}
.pr{font-weight:600;white-space:nowrap}.pr small{font-size:.7rem;color:var(--soft);margin-inline-start:.15rem}
.ds{grid-column:1/-1;margin:0;font-size:.8rem;color:var(--soft)}
.cal{grid-column:1/-1;margin:0;font-size:.75rem;color:var(--blue)}
.thanks{text-align:center;padding:1.5rem 0 .5rem;position:relative;z-index:1}
.thanks span{display:inline-block;background:var(--ink);color:var(--paper);border-radius:6px;padding:.15rem .8rem;font:400 1.1rem "Gochi Hand",cursive;transform:rotate(2deg)}
.foot{text-align:center;color:var(--soft);font-size:.8rem;padding:0 1rem 2.2rem}.foot strong{color:var(--ink)}

</style>
</head>
<body>
<div class="demo-note" id="demoNote" hidden></div>

<header>
  <button class="lang" id="langBtn">English</button>
  <div id="logo"><span class="concept-wm" style="display:block;font-family:'Gochi Hand',serif;font-weight:700;font-size:clamp(2.2rem,11vw,3.4rem);line-height:1.05;letter-spacing:-.01em;direction:ltr;white-space:nowrap">Concept 25</span></div>
  <p class="tag">Specialty Coffee</p>
  <p class="info" id="info"></p>
  <span class="start" id="start"></span>
</header>

<div class="bar"><div class="bar-in">
  <div class="search"><input id="q" type="search" aria-label="Search"></div>
  <nav class="chips" id="chips" aria-label="Categories"></nav>
</div></div>
<main id="menu"></main>
<footer class="foot"><p id="note"></p><p id="credit"></p></footer>
<script>
const CONFIG = {"name":"Concept 25","nameAr":"Concept 25","tagline":{"ar":"Specialty Coffee","en":"Specialty Coffee"},"info":{"ar":"الرياض","en":"Riyadh"},"logo":"","colors":{"primary":"#2c2f48","onPrimary":"#f7f3ec","secondary":"#e79bb3","background":"#f7f3ec","accent":"#8fbbe3"},"fonts":{"display":"Gochi Hand","body":"Lemonada"},"pattern":"none","currency":{"ar":"ر.س","en":"SR"},"demoBanner":false,"credit":"محمد","categories":[{"id":"coffee","ar":"قهوة","en":"Coffee","noteAr":"طازجة كل يوم","noteEn":"Fresh every day. Every single morning.","items":[{"ar":"إسبريسو","en":"Espresso","p":10,"cal":5},{"ar":"أمريكانو","en":"Americano","dAr":"إسبريسو، ماء حار","dEn":"espresso, hot water","p":11,"cal":10},{"ar":"كورتادو","en":"Cortado","dAr":"إسبريسو، حليب","dEn":"espresso, milk","p":14,"cal":60},{"ar":"فلات وايت","en":"Flat White","dAr":"إسبريسو، حليب مبخر","dEn":"espresso, steamed milk","p":16,"cal":90},{"ar":"لاتيه","en":"Latte","dAr":"إسبريسو، حليب مبخر، رغوة","dEn":"espresso, steamed milk, milk foam","p":18,"cal":120}]},{"id":"fav","ar":"مفضلات Concept 25","en":"Concept 25's Favorites","noteAr":"فانيلا حقيقية · طعم حقيقي","noteEn":"Real vanilla. Real taste. Real deal.","items":[{"ar":"لاتشينو","en":"Latchino","dAr":"قهوة، حليب، سكر، فانيلا، ثلج","dEn":"coffee, milk, sugar, vanilla, ice","p":21,"cal":160,"fav":true},{"ar":"لاتيه لوز","en":"Almond Latte","dAr":"لوز محمص، حليب، إسبريسو، سكر بني","dEn":"roasted almonds, milk, espresso, brown sugar","p":25,"cal":210,"fav":true},{"ar":"بينت موكا","en":"Peanut Mocha","dAr":"زبدة فول سوداني، شوكولاتة داكنة، حليب، إسبريسو","dEn":"natural peanut butter, dark chocolate, milk, espresso","p":25,"cal":260,"fav":true},{"ar":"ريل بين لاتيه","en":"Real Bean Latte","dAr":"فانيلا حقيقية، إسبريسو، حليب","dEn":"real vanilla, espresso, milk","p":28,"cal":150,"fav":true}]},{"id":"sandwich","ar":"ساندويتشات Concept 25","en":"Concept 25's Sandwiches","items":[{"ar":"ساندويتش Say Cheeeeeez","en":"Say Cheeeeeez Sandwich","p":24},{"ar":"ساندويتش دجاج Grilloooo","en":"Chicken Grilloooo Sandwich","p":26}]},{"id":"more","ar":"وأشياء ثانية لك","en":"Here's some things for you","items":[{"ar":"سموذي Concept 25","en":"Concept 25's Smoothie","p":23,"cal":230},{"ar":"بروتين شيك","en":"Protein Shake","p":23,"cal":280},{"ar":"ليمونادة","en":"Lemonade","p":14,"cal":90},{"ar":"فراولة آيس شيكن","en":"Strawberry Ice Shaken","p":21},{"ar":"عصير برتقال","en":"Orange Juice","p":16},{"ar":"شاي","en":"Shai","p":10,"cal":5},{"ar":"موية","en":"Water","p":3,"cal":0}]}]};
const C = CONFIG || {name:"Menu",categories:[]};
const T = {"ar": {"dir": "rtl", "lang": "English", "search": "دوّر على مشروبك…", "empty": "ما لقينا شي، جرّب كلمة ثانية.", "all": "الكل", "demo": "نسخة تجريبية للعرض", "note": "السعرات تقريبية", "start": "ابدأ من هنا", "thanks": "شكراً إنك هنا ♥", "kcal": "سعرة"}, "en": {"dir": "ltr", "lang": "العربية", "search": "Find your drink…", "empty": "Nothing here. Try another word.", "all": "All", "demo": "Demo version", "note": "Calories are approximate", "start": "START HERE", "thanks": "THANK YOU for being here ♥", "kcal": "cal"}};
let lang="ar", active="all", query="";
const KEY="Concept 25-lang";
try{const s=localStorage.getItem(KEY);if(s==="ar"||s==="en")lang=s;}catch(e){}
try{const u=new URLSearchParams(location.search).get("lang");if(u==="ar"||u==="en")lang=u;}catch(e){}
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmt=n=>lang==="ar"?Number(n).toLocaleString("ar-EG"):Number(n).toLocaleString("en-US");
const cur=()=> (C.currency||{ar:"",en:""})[lang];
const L=(o,ar,en)=> lang==="ar" ? (o[ar]||o[en]||"") : (o[en]||o[ar]||"");
const P=i=> i.p2!=null ? `${fmt(i.p)}<span class="sl">/</span>${fmt(i.p2)}` : fmt(i.p);

function hero(){ $("info").textContent=L(C.info||{},"ar","en"); $("start").textContent=T[lang].start; }
function section(c,ci,body){
  const note=L(c,"noteAr","noteEn");
  return `<section id="cat-${esc(c.id)}"><span class="stop">${ci+1}</span><h2>${esc(L(c,"ar","en"))}</h2>${note?`<span class="sticky">${esc(note)}</span>`:""}${body}</section>`;
}
function item(i){
  const d=L(i,"dAr","dEn");
  return `<div class="it${i.fav?" fav":""}"><span class="nm">${i.fav?'<span class="st">★</span>':""}${esc(L(i,"ar","en"))}</span><span class="pr">${fmt(i.p)}<small>${cur()}</small></span>${d?`<p class="ds">${esc(d)}</p>`:""}${i.cal!=null?`<p class="cal">${fmt(i.cal)} ${T[lang].kcal}</p>`:""}</div>`;
}
function afterRender(){ $("menu").insertAdjacentHTML("beforeend",`<div class="thanks"><span>${T[lang].thanks}</span></div>`); }

function renderChips(){
  const cats=[{id:"all",ar:T.ar.all,en:T.en.all},...C.categories];
  $("chips").innerHTML=cats.map(c=>`<button class="chip" data-id="${esc(c.id)}" aria-pressed="${c.id===active}">${esc(L(c,"ar","en"))}</button>`).join("");
  $("chips").querySelectorAll(".chip").forEach(b=>b.onclick=()=>{
    active=b.dataset.id;renderChips();
    if(active==="all"){window.scrollTo({top:0});return;}
    const el=$("cat-"+active); if(el) el.scrollIntoView({behavior:matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth",block:"start"});
  });
}
function renderMenu(){
  const q=query.trim().toLowerCase(); let html="",n=0,k=0;
  C.categories.forEach((c,ci)=>{
    const items=c.items.filter(i=>!q||[i.ar,i.en,i.dAr,i.dEn].join(" ").toLowerCase().includes(q));
    if(!items.length) return; n+=items.length;
    html+=section(c,ci,items.map(i=>item(i,++k,c)).join(""));
  });
  $("menu").innerHTML=n?html:`<p class="empty">${T[lang].empty}</p>`;
  if(typeof afterRender==="function") afterRender();
}
function apply(){
  const t=T[lang]; document.documentElement.lang=lang; document.documentElement.dir=t.dir;
  $("langBtn").textContent=t.lang; $("q").placeholder=t.search;
  const note=$("demoNote"); note.hidden=!C.demoBanner; note.textContent=t.demo;
  $("note").textContent=t.note||"";
  $("credit").innerHTML=(lang==="ar"?"منيو ديجيتال من تصميم ":"Digital menu designed by ")+`<strong>${lang==="en"?"Mohamed":"محمد"}</strong>`;
  if(typeof hero==="function") hero();
  renderChips(); renderMenu();
}
$("langBtn").onclick=()=>{lang=lang==="ar"?"en":"ar";try{localStorage.setItem(KEY,lang)}catch(e){}apply();};
$("q").addEventListener("input",e=>{query=e.target.value;renderMenu();});
apply();
</script>
<script>(function(){if(window.parent===window)return;var s=0,t=0;function send(m){try{parent.postMessage(m,"*")}catch(e){}}
addEventListener("scroll",function(){if(!s){s=1;send("concept-scrolled")}},{passive:true});
addEventListener("pointerdown",function(){if(!t){t=1;send("concept-touched")}},{passive:true})})()</script>
</body>
</html>
