<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Concept 30</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#2e2118">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Readex+Pro:wght@300;500;700&display=swap">
<style>
*,*::before,*::after{box-sizing:border-box}
body{margin:0;overflow-x:hidden;-webkit-font-smoothing:antialiased;line-height:1.55;padding-bottom:env(safe-area-inset-bottom,0px)}
.demo-note{text-align:center;font-size:.8rem;padding:.45rem 1rem}
.empty{text-align:center;padding:3rem 1rem;opacity:.75}
button{font:inherit}

:root{--sand:#e6d9c6;--sand2:#d6c2a5;--ink:#2e2118;--soft:#7a6552;--card:#efe5d6}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--sand:#1c1611;--sand2:#2a2119;--ink:#f0e5d4;--soft:#bba88f;--card:#2b231b}}
:root[data-theme="dark"]{--sand:#1c1611;--sand2:#2a2119;--ink:#f0e5d4;--soft:#bba88f;--card:#2b231b}
body{background:linear-gradient(180deg,var(--sand),var(--sand2));background-attachment:fixed;color:var(--ink);font-family:"Readex Pro",system-ui,sans-serif}
.demo-note{background:var(--ink);color:var(--sand)}
header{position:relative;text-align:center;padding:calc(env(safe-area-inset-top,0px) + 3rem) 1.2rem 1.4rem;overflow:hidden}
.leaf{position:absolute;top:-20px;inset-inline-start:-30px;width:210px;height:210px;color:var(--ink);opacity:.08;pointer-events:none}
.lang{position:absolute;top:calc(env(safe-area-inset-top,0px) + .8rem);inset-inline-end:1rem;background:transparent;color:var(--ink);border:1px solid var(--ink);border-radius:999px;padding:.25rem .85rem;cursor:pointer;min-height:36px;font-size:.8rem}
#logo{display:inline-flex;align-items:center;gap:.7rem;padding:.5rem .9rem;background:var(--sand);direction:ltr}
.w1{font:600 2.5rem/1 "Cormorant Garamond",serif;letter-spacing:.22em}
.vb{width:1.5px;height:2.4rem;background:var(--ink)}
.w2{font:500 .72rem/1.3 "Readex Pro",sans-serif;letter-spacing:.28em;text-align:left}
.ar-name{font:500 1.05rem "Readex Pro";margin:.7rem 0 0;color:var(--soft)}
.info{font:300 .8rem "Readex Pro";color:var(--soft);margin:.2rem 0 0}
.bar{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--sand) 92%,transparent);backdrop-filter:blur(6px);border-bottom:1px solid color-mix(in srgb,var(--ink) 18%,transparent)}
.bar-in{max-width:620px;margin:0 auto;padding:.6rem 1.2rem .4rem}
.search input{width:100%;border:1px solid color-mix(in srgb,var(--ink) 35%,transparent);background:var(--card);color:var(--ink);border-radius:12px;padding:.6rem 1rem;font:inherit}
.chips{display:flex;gap:1rem;overflow-x:auto;padding:.5rem 0 .1rem;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;border:0;background:none;color:var(--soft);font:500 .9rem "Readex Pro";padding:.3rem 0;cursor:pointer;min-height:36px;border-bottom:1.5px solid transparent}
.chip[aria-pressed="true"]{color:var(--ink);border-bottom-color:var(--ink)}
.chip:focus-visible,.lang:focus-visible,.search input:focus-visible,.poster:focus-visible{outline:2px solid var(--soft);outline-offset:2px}
main{max-width:620px;margin:0 auto;padding:.3rem 0 1.5rem}
section{padding-top:1.4rem;scroll-margin-top:110px}
h2{margin:0 1.2rem .7rem;font:500 .8rem "Readex Pro";letter-spacing:.3em;text-transform:uppercase;color:var(--soft);display:flex;align-items:center;gap:.6rem}
h2::after{content:"";flex:1;height:1px;background:color-mix(in srgb,var(--ink) 25%,transparent)}
.rail{display:flex;gap:.8rem;overflow-x:auto;scroll-snap-type:x mandatory;padding:0 1.2rem .6rem;scrollbar-width:none}.rail::-webkit-scrollbar{display:none}

.poster{flex:0 0 72%;max-width:300px;scroll-snap-align:center;background:linear-gradient(170deg,var(--card),color-mix(in srgb,var(--sand2) 70%,var(--card)));border-radius:6px;padding:1.2rem 1rem 1rem;position:relative;overflow:hidden;min-height:380px;display:flex;flex-direction:column;align-items:center;text-align:center;box-shadow:0 14px 26px -18px rgba(46,33,24,.55)}
.poster .leaf{top:auto;bottom:40px;inset-inline-start:auto;inset-inline-end:-40px;width:170px;height:170px;opacity:.07}
.mini{font:600 .62rem "Cormorant Garamond",serif;letter-spacing:.3em;direction:ltr}
.pn{font:700 2rem/1.15 "Readex Pro";margin:.5rem 0 0}
html[lang=en] .pn{font:600 2rem/1.1 "Cormorant Garamond",serif}
.pe{font:300 .66rem "Readex Pro";letter-spacing:.28em;text-transform:uppercase;color:var(--soft);margin-top:.2rem;direction:ltr}
.pd{font-size:.72rem;color:var(--soft);margin:.15rem 0 0}
.ill{width:120px;height:130px;margin:auto 0 .6rem;color:var(--ink)}
.price{width:58px;height:58px;border-radius:50%;border:1.5px solid var(--ink);display:grid;place-items:center;align-content:center;line-height:1}
.price b{font:700 1.35rem "Readex Pro"}.price small{font:300 .55rem "Readex Pro"}
.foot{text-align:center;color:var(--soft);font-size:.8rem;padding:.5rem 1rem 2.2rem}.foot strong{color:var(--ink)}

</style>
</head>
<body>
<div class="demo-note" id="demoNote" hidden></div>

<header>
  <svg class="leaf" viewBox="0 0 200 200" aria-hidden="true"><g fill="currentColor"><path d="M100 190 C98 140 96 90 90 20" stroke="currentColor" stroke-width="3" fill="none"/><path d="M96 60 C70 40 40 44 20 62 C46 70 74 72 96 60Z"/><path d="M94 90 C120 70 150 72 176 86 C150 98 122 100 94 90Z"/><path d="M97 120 C70 104 40 110 22 126 C48 134 76 134 97 120Z"/><path d="M92 36 C110 18 132 14 150 20 C136 36 114 42 92 36Z"/></g></svg>
  <button class="lang" id="langBtn">English</button>
  <div id="logo"><span class="concept-wm" style="display:block;font-family:'Readex Pro',serif;font-weight:700;font-size:clamp(2.2rem,11vw,3.4rem);line-height:1.05;letter-spacing:-.01em;direction:ltr;white-space:nowrap">Concept 30</span></div>
  <p class="ar-name" id="arName"></p>
  <p class="info" id="info"></p>
</header>

<div class="bar"><div class="bar-in">
  <div class="search"><input id="q" type="search" aria-label="Search"></div>
  <nav class="chips" id="chips" aria-label="Categories"></nav>
</div></div>
<main id="menu"></main>
<footer class="foot"><p id="note"></p><p id="credit"></p></footer>
<script>
const CONFIG = {"name":"Concept 30","nameAr":"Concept 30","tagline":{"ar":"قهوة مختصة","en":"Specialty Coffee"},"info":{"ar":"الرياض","en":"Riyadh"},"logo":"","colors":{"primary":"#2e2118","onPrimary":"#efe5d6","secondary":"#7a6552","background":"#e6d9c6","accent":"#2e2118"},"fonts":{"display":"Readex Pro","body":"Readex Pro"},"pattern":"none","currency":{"ar":"ريال","en":"SAR"},"demoBanner":false,"credit":"محمد","categories":[{"id":"drinks","ar":"المشروبات","en":"Drinks","items":[{"ar":"قهوة اليوم","en":"Coffee of the Day","dAr":"كبير","dEn":"Large","p":9,"ill":"cup"},{"ar":"لاتيه","en":"Latte","dAr":"حار","dEn":"Hot","p":14,"ill":"cup"},{"ar":"كركديه","en":"Karkadeh","p":14,"ill":"iced"}]},{"id":"sweets","ar":"الحلا","en":"Sweets","items":[{"ar":"بودينغ بيكان","en":"Pecan Pudding","p":15,"ill":"cake"},{"ar":"بودينغ شوكولاتة","en":"Chocolate Pudding","p":18,"ill":"cake"},{"ar":"تشيز مدريد","en":"Madrid Cheesecake","p":15,"ill":"cheese"}]}]};
const C = CONFIG || {name:"Menu",categories:[]};
const T = {"ar": {"dir": "rtl", "lang": "English", "search": "دوّر في المنيو…", "empty": "ما فيه صنف بهالاسم.", "all": "الكل", "demo": "", "note": "الأسعار من بوستراتكم، والباقي نضيفه", "sar": "ريال"}, "en": {"dir": "ltr", "lang": "العربية", "search": "Search the menu…", "empty": "Nothing matches that.", "all": "All", "demo": "", "note": "Prices from your posters — the rest gets added", "sar": "SAR"}};
let lang="ar", active="all", query="";
const KEY="origin-lang";
try{const s=localStorage.getItem(KEY);if(s==="ar"||s==="en")lang=s;}catch(e){}
try{const u=new URLSearchParams(location.search).get("lang");if(u==="ar"||u==="en")lang=u;}catch(e){}
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmt=n=>lang==="ar"?Number(n).toLocaleString("ar-EG"):Number(n).toLocaleString("en-US");
const cur=()=> (C.currency||{ar:"",en:""})[lang];
const L=(o,ar,en)=> lang==="ar" ? (o[ar]||o[en]||"") : (o[en]||o[ar]||"");
const P=i=> i.p2!=null ? `${fmt(i.p)}<span class="sl">/</span>${fmt(i.p2)}` : fmt(i.p);

const LEAF=`<svg class="leaf" viewBox="0 0 200 200" aria-hidden="true"><g fill="currentColor"><path d="M100 190 C98 140 96 90 90 20" stroke="currentColor" stroke-width="3" fill="none"/><path d="M96 60 C70 40 40 44 20 62 C46 70 74 72 96 60Z"/><path d="M94 90 C120 70 150 72 176 86 C150 98 122 100 94 90Z"/><path d="M97 120 C70 104 40 110 22 126 C48 134 76 134 97 120Z"/><path d="M92 36 C110 18 132 14 150 20 C136 36 114 42 92 36Z"/></g></svg>`;
const ILL={
 cup:`<svg class="ill" viewBox="0 0 120 130" fill="none" stroke="currentColor" stroke-width="2"><path d="M30 40 H90 L84 118 H36 Z" fill="#f7f1e8"/><path d="M26 32 H94 V40 H26Z" fill="#e9dfd0"/><text x="60" y="82" text-anchor="middle" font-family="Cormorant Garamond" font-size="11" letter-spacing="2" fill="currentColor" stroke="none">Concept 30</text><path d="M52 22 q-4 -6 0 -12 M62 22 q-4 -6 0 -12 M72 22 q-4 -6 0 -12" stroke-linecap="round"/></svg>`,
 iced:`<svg class="ill" viewBox="0 0 120 130" fill="none" stroke="currentColor" stroke-width="2"><path d="M32 36 H88 L82 120 H38 Z" fill="#9b2335" fill-opacity=".85"/><path d="M28 30 H92" stroke-linecap="round"/><rect x="46" y="54" width="12" height="12" rx="2" fill="#fff" fill-opacity=".6" stroke="none"/><rect x="62" y="70" width="12" height="12" rx="2" fill="#fff" fill-opacity=".6" stroke="none"/><path d="M70 30 L78 8" stroke-linecap="round"/></svg>`,
 cake:`<svg class="ill" viewBox="0 0 120 130" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 70 H102 V112 H18 Z" fill="#c9a27a"/><path d="M18 70 L40 52 H102 V70" fill="#8a5a35"/><path d="M18 86 H102" stroke="#fff" stroke-opacity=".6"/><circle cx="50" cy="60" r="4" fill="#5a3620"/><circle cx="72" cy="58" r="4" fill="#5a3620"/><circle cx="90" cy="60" r="4" fill="#5a3620"/></svg>`,
 cheese:`<svg class="ill" viewBox="0 0 120 130" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 96 L96 60 L106 96 Z" fill="#f2d79b"/><path d="M14 96 L96 60 L90 56 Q60 50 18 88 Z" fill="#6b3a1c"/><path d="M14 96 H106 V106 H14Z" fill="#c69a5b"/></svg>`,
 matcha:`<svg class="ill" viewBox="0 0 120 130" fill="none" stroke="currentColor" stroke-width="2"><path d="M32 36 H88 L82 120 H38 Z" fill="#7aa35a"/><path d="M28 30 H92" stroke-linecap="round"/><path d="M36 60 Q60 52 84 60" stroke="#fff" stroke-opacity=".7"/></svg>`
};
function hero(){ $("arName").textContent=lang==="ar"?"قهوة مختصة":""; $("arName").hidden=lang!=="ar"; $("info").textContent=L(C.info||{},"ar","en"); }
function section(c,ci,body){ return `<section id="cat-${esc(c.id)}"><h2>${esc(L(c,"ar","en"))}</h2><div class="rail">${body}</div></section>`; }
function item(i){
  const d=L(i,"dAr","dEn");
  return `<article class="poster" tabindex="0">${LEAF}<span class="mini">Concept 30</span><div class="pn">${esc(lang==="ar"?i.ar:i.en)}</div><div class="pe">${esc(lang==="ar"?i.en:"")}</div>${d?`<p class="pd">${esc(d)}</p>`:""}${ILL[i.ill]||ILL.cup}<div class="price"><b>${fmt(i.p)}</b><small>${T[lang].sar}</small></div></article>`;
}

function renderChips(){
  const cats=[{id:"all",ar:T.ar.all,en:T.en.all},...C.categories];
  $("chips").innerHTML=cats.map(c=>`<button class="chip" data-id="${esc(c.id)}" aria-pressed="${c.id===active}">${esc(L(c,"ar","en"))}</button>`).join("");
  $("chips").querySelectorAll(".chip").forEach(b=>b.onclick=()=>{
    active=b.dataset.id;renderChips();
    if(active==="all"){window.scrollTo({top:0});return;}
    const el=$("cat-"+active); if(el) el.scrollIntoView({behavior:matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth",block:"start"});
  });
}
function renderMenu(){
  const q=query.trim().toLowerCase(); let html="",n=0,k=0;
  C.categories.forEach((c,ci)=>{
    const items=c.items.filter(i=>!q||[i.ar,i.en,i.dAr,i.dEn].join(" ").toLowerCase().includes(q));
    if(!items.length) return; n+=items.length;
    html+=section(c,ci,items.map(i=>item(i,++k,c)).join(""));
  });
  $("menu").innerHTML=n?html:`<p class="empty">${T[lang].empty}</p>`;
  if(typeof afterRender==="function") afterRender();
}
function apply(){
  const t=T[lang]; document.documentElement.lang=lang; document.documentElement.dir=t.dir;
  $("langBtn").textContent=t.lang; $("q").placeholder=t.search;
  const note=$("demoNote"); note.hidden=!C.demoBanner; note.textContent=t.demo;
  $("note").textContent=t.note||"";
  $("credit").innerHTML=(lang==="ar"?"منيو ديجيتال من تصميم ":"Digital menu designed by ")+`<strong>${lang==="en"?"Mohamed":"محمد"}</strong>`;
  if(typeof hero==="function") hero();
  renderChips(); renderMenu();
}
$("langBtn").onclick=()=>{lang=lang==="ar"?"en":"ar";try{localStorage.setItem(KEY,lang)}catch(e){}apply();};
$("q").addEventListener("input",e=>{query=e.target.value;renderMenu();});
apply();
</script>
</body>
</html>
