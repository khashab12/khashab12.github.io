<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<script>(function(){if(window.parent===window)return;var s=0,t=0;function send(m){try{parent.postMessage(m,"*")}catch(e){}}
addEventListener("scroll",function(){if(!s){s=1;send("concept-scrolled")}},{passive:true});
addEventListener("pointerdown",function(){if(!t){t=1;send("concept-touched")}},{passive:true})})()</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Concept 16</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#1d5a45">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Marcellus&family=Noto+Kufi+Arabic:wght@400;600;700&family=Cormorant+Garamond:ital,wght@1,500&display=swap" media="print" onload="this.media='all'"><noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Marcellus&family=Noto+Kufi+Arabic:wght@400;600;700&family=Cormorant+Garamond:ital,wght@1,500&display=swap"></noscript>
<style>
*,*::before,*::after{box-sizing:border-box}
body{margin:0;overflow-x:hidden;-webkit-font-smoothing:antialiased;line-height:1.55;padding-bottom:env(safe-area-inset-bottom,0px)}
.demo-note{text-align:center;font-size:.8rem;padding:.45rem 1rem}
.empty{text-align:center;padding:3rem 1rem;opacity:.75}
button{font:inherit}

:root{--emerald:#1d5a45;--emerald2:#2a7058;--gold:#c8a55a;--maroon:#6b1a2a;--maroon2:#84243a;--paper:#f6f1e7;--card:#fffdf8;--ink:#2b1a1e;--soft:#76605f;--line:#e6dccb}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--paper:#140f10;--card:#1f1618;--ink:#f3ebe0;--soft:#c3aeaa;--line:#3a2a2d}}
:root[data-theme="dark"]{--paper:#140f10;--card:#1f1618;--ink:#f3ebe0;--soft:#c3aeaa;--line:#3a2a2d}
body{background:var(--paper);color:var(--ink);font-family:"Noto Kufi Arabic","Marcellus",sans-serif}
html[lang=en] body{font-family:"Marcellus","Noto Kufi Arabic",serif}
.demo-note{background:var(--emerald);color:#fff}

header{position:relative;text-align:center;padding:calc(env(safe-area-inset-top,0px) + 3rem) 1.2rem 1.6rem;background-color:var(--emerald);
 background-image:linear-gradient(45deg,rgba(200,165,90,.16) 25%,transparent 25% 75%,rgba(200,165,90,.16) 75%),linear-gradient(-45deg,rgba(200,165,90,.16) 25%,transparent 25% 75%,rgba(200,165,90,.16) 75%);background-size:28px 28px}
.lang{position:absolute;top:calc(env(safe-area-inset-top,0px) + .8rem);inset-inline-end:1rem;background:var(--maroon);color:#fff;border:1px solid var(--gold);border-radius:999px;padding:.25rem .9rem;cursor:pointer;min-height:36px;font-size:.8rem}
#logo{display:inline-block;padding:1rem 1.3rem;background:var(--emerald);border:2px solid var(--gold);border-radius:50% 50% 12px 12px/34% 34% 12px 12px}
.palm{width:70px;height:70px;display:block;margin:0 auto .2rem}
.gm{font:400 1.6rem "Marcellus",serif;letter-spacing:.22em;color:#f3e7c7;direction:ltr}
.tg{font:italic 500 1.05rem "Cormorant Garamond",serif;color:#e7d6a8;margin-top:.8rem;direction:ltr}
.info{font-size:.78rem;color:#cfe3d9;margin:.2rem 0 0}
.bar{position:sticky;top:0;z-index:5;background:var(--paper);border-bottom:1px solid var(--line)}
.bar-in{max-width:560px;margin:0 auto;padding:.6rem 1.2rem .4rem}
.search input{width:100%;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:.55rem 1rem;font:inherit}
.chips{display:flex;gap:.4rem;overflow-x:auto;padding:.5rem 0 .1rem;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:.3rem .95rem;cursor:pointer;min-height:36px;font-size:.84rem}
.chip[aria-pressed="true"]{background:var(--maroon);border-color:var(--maroon);color:#fff}
.chip:focus-visible,.lang:focus-visible,.search input:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
main{max-width:560px;margin:0 auto;padding:.5rem 1.2rem 1.5rem}

section{margin-top:1.6rem;background:var(--maroon);color:#f6ece3;border-radius:14px;padding:1.1rem 1rem .6rem;scroll-margin-top:120px;position:relative;overflow:hidden}
section::before{content:"";position:absolute;top:-30px;inset-inline-end:-30px;width:110px;height:110px;border-radius:50%;border:12px solid rgba(200,165,90,.18)}
h2{margin:0 0 .2rem;font:700 1.15rem "Noto Kufi Arabic";color:#f3e7c7;position:relative}
html[lang=en] h2{font:400 1.3rem "Marcellus";letter-spacing:.12em;text-transform:uppercase}
.sub{font:italic 500 .95rem "Cormorant Garamond";color:#e0c48a;margin:0 0 .5rem;direction:ltr}
.row{display:grid;grid-template-columns:1fr auto;gap:.05rem .6rem;padding:.5rem 0;border-top:1px solid rgba(243,231,199,.14);position:relative}
.nm{font-weight:600}
.pr{font-weight:700;color:#f3e7c7;direction:ltr;white-space:nowrap}.pr small{font-weight:400;font-size:.68rem;margin-inline-start:.2rem;opacity:.8}
.kc{grid-column:1/-1;font-size:.72rem;color:#d9b9b9}
.milk{margin-top:1.4rem;background:var(--card);border:1px dashed var(--emerald);border-radius:12px;padding:.8rem 1rem;font-size:.85rem}
.milk b{color:var(--emerald);display:block;margin-bottom:.2rem}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .milk b{color:#8fd1b6}}
.foot{text-align:center;color:var(--soft);font-size:.8rem;padding:.5rem 1rem 2.2rem}.foot strong{color:var(--ink)}

</style>
</head>
<body>
<div class="demo-note" id="demoNote" hidden></div>

<header>
  <button class="lang" id="langBtn">English</button>
  <div id="logo"><span class="concept-wm" style="display:block;font-family:'Marcellus',serif;font-weight:700;font-size:clamp(2.2rem,11vw,3.4rem);line-height:1.05;letter-spacing:-.01em;direction:ltr;white-space:nowrap">Concept 16</span></div>
  <p class="tg">Specialty Coffee</p>
  <p class="info" id="info"></p>
</header>

<div class="bar"><div class="bar-in">
  <div class="search"><input id="q" type="search" aria-label="Search"></div>
  <nav class="chips" id="chips" aria-label="Categories"></nav>
</div></div>
<main id="menu"></main>
<footer class="foot"><p id="note"></p><p id="credit"></p></footer>
<script>
const CONFIG = {"name":"Concept 16","nameAr":"Concept 16","tagline":{"ar":"Specialty Coffee","en":"Specialty Coffee"},"info":{"ar":"الرياض","en":"Riyadh"},"logo":"","colors":{"primary":"#1d5a45","onPrimary":"#ffffff","secondary":"#6b1a2a","background":"#f6f1e7","accent":"#c8a55a"},"fonts":{"display":"Marcellus","body":"Noto Kufi Arabic"},"pattern":"emerald tile","currency":{"ar":"ر.س","en":"SAR"},"demoBanner":false,"credit":"محمد","categories":[{"id":"hot","ar":"المشروبات الساخنة","en":"Hot Drinks","sub":"Hot drinks","items":[{"ar":"إسبريسو","en":"Espresso","p":12,"c":1},{"ar":"أمريكانو","en":"Americano","p":14,"c":5},{"ar":"القهوة المقطرة V60","en":"V60","p":22,"c":2},{"ar":"قهوة اليوم","en":"Coffee of the Day","p":12,"c":5},{"ar":"كابتشينو","en":"Cappuccino","p":16,"c":140},{"ar":"لاتيه","en":"Latte","p":16,"c":160},{"ar":"فلات وايت","en":"Flat White","p":15,"c":130},{"ar":"كورتادو","en":"Cortado","p":13,"c":90},{"ar":"سبانش لاتيه","en":"Spanish Latte","p":18,"c":180},{"ar":"مياه نوفا","en":"Nova Water","p":1,"c":0}]},{"id":"cold","ar":"المشروبات الباردة","en":"Cold Drinks","sub":"Cold drinks","items":[{"ar":"آيس V60","en":"Iced V60","p":24,"c":5,"dAr":"إثيوبيا · السلفادور · كوستاريكا","dEn":"Ethiopia · El Salvador · Costa Rica"},{"ar":"أمريكانو","en":"Iced Americano","p":16,"c":2},{"ar":"ألفريدو","en":"Alfredo","p":15,"c":2},{"ar":"قهوة اليوم","en":"Iced Coffee of the Day","p":14,"c":5},{"ar":"آيس سجنتشر","en":"Iced Signature","p":24,"c":90},{"ar":"آيس لاتيه","en":"Iced Latte","p":21,"c":120},{"ar":"آيس سبانش","en":"Iced Spanish","p":22,"c":170},{"ar":"آيس ماتشا","en":"Iced Matcha","p":26,"c":220},{"ar":"آيس كركديه","en":"Iced Hibiscus","p":16,"c":120},{"ar":"آيس تي خوخ","en":"Peach Ice Tea","p":15,"c":140}]},{"id":"sweet","ar":"الحلويات","en":"Desserts","sub":"Desserts","items":[{"ar":"دولتشي شوكلت","en":"Dolce Chocolate","p":28,"c":330},{"ar":"بودينق عسل","en":"Honey Pudding","p":28,"c":320},{"ar":"تشيز كيك","en":"Cheesecake","p":28,"c":280},{"ar":"كيكة جوز الهند","en":"Coconut Cake","p":26,"c":290},{"ar":"تشيز كيك مدريد","en":"Madrid Cheesecake","p":27,"c":340},{"ar":"ماجيك بار","en":"Magic Bar","p":12,"c":180},{"ar":"براونيز","en":"Brownie","p":12,"c":190}]},{"id":"pastry","ar":"المخبوزات","en":"Pastries","sub":"Pastries","items":[{"ar":"دانيش بيستو حلومي","en":"Pesto Halloumi Danish","p":24,"c":170},{"ar":"بان سويس تشيز","en":"Pan Swiss Cheese","p":19,"c":190},{"ar":"بان سويس شوكلت","en":"Pan Swiss Chocolate","p":20,"c":220},{"ar":"دانيش ريد بيري","en":"Red Berry Danish","p":20,"c":260},{"ar":"بيقل تركي","en":"Turkey Bagel","p":22,"c":180},{"ar":"كلاسيك كوكيز","en":"Classic Cookies","p":12,"c":180},{"ar":"كوكيز دبل شوكلت","en":"Double Chocolate Cookies","p":12,"c":290}]}]};
const C = CONFIG || {name:"Menu",categories:[]};
const T = {"ar": {"dir": "rtl", "lang": "English", "search": "وش تبي تطلب؟", "empty": "ما لقينا شي بهالاسم.", "all": "الكل", "demo": "", "note": "", "kc": "سعرة", "mb": "أنواع الحليب", "ml": "كامل الدسم · قليل الدسم · حليب الفانيليا · حليب الصويا · حليب اللوز · حليب جوز الهند"}, "en": {"dir": "ltr", "lang": "العربية", "search": "What would you like?", "empty": "Nothing matches that.", "all": "All", "demo": "", "note": "", "kc": "cal", "mb": "Milk options", "ml": "Full fat · Low fat · Vanilla milk · Soy · Almond · Coconut"}};
let lang="ar", active="all", query="";
const KEY="Concept 16-lang";
try{const s=localStorage.getItem(KEY);if(s==="ar"||s==="en")lang=s;}catch(e){}
try{const u=new URLSearchParams(location.search).get("lang");if(u==="ar"||u==="en")lang=u;}catch(e){}
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmt=n=>lang==="ar"?Number(n).toLocaleString("ar-EG"):Number(n).toLocaleString("en-US");
const cur=()=> (C.currency||{ar:"",en:""})[lang];
const L=(o,ar,en)=> lang==="ar" ? (o[ar]||o[en]||"") : (o[en]||o[ar]||"");
const P=i=> i.p2!=null ? `${fmt(i.p)}<span class="sl">/</span>${fmt(i.p2)}` : fmt(i.p);

function hero(){ $("info").textContent=L(C.info||{},"ar","en"); }
function section(c,ci,body){ return `<section id="cat-${esc(c.id)}"><h2>${esc(L(c,"ar","en"))}</h2><p class="sub">${esc(c.sub||"")}</p>${body}</section>`; }
function item(i){ return `<div class="row"><span class="nm">${esc(L(i,"ar","en"))}</span><span class="pr">${fmt(i.p)}<small>${cur()}</small></span><span class="kc">${fmt(i.c)} ${T[lang].kc}${i.dEn?` · ${esc(L(i,"dAr","dEn"))}`:""}</span></div>`; }
function afterRender(){ if(query.trim()) return; const t=T[lang]; $("menu").insertAdjacentHTML("beforeend",`<div class="milk"><b>${t.mb}</b>${t.ml}</div>`); }

function renderChips(){
  const cats=[{id:"all",ar:T.ar.all,en:T.en.all},...C.categories];
  $("chips").innerHTML=cats.map(c=>`<button class="chip" data-id="${esc(c.id)}" aria-pressed="${c.id===active}">${esc(L(c,"ar","en"))}</button>`).join("");
  $("chips").querySelectorAll(".chip").forEach(b=>b.onclick=()=>{
    active=b.dataset.id;renderChips();
    if(active==="all"){window.scrollTo({top:0});return;}
    const el=$("cat-"+active); if(el) el.scrollIntoView({behavior:matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth",block:"start"});
  });
}
function renderMenu(){
  const q=query.trim().toLowerCase(); let html="",n=0,k=0;
  C.categories.forEach((c,ci)=>{
    const items=c.items.filter(i=>!q||[i.ar,i.en,i.dAr,i.dEn].join(" ").toLowerCase().includes(q));
    if(!items.length) return; n+=items.length;
    html+=section(c,ci,items.map(i=>item(i,++k,c)).join(""));
  });
  $("menu").innerHTML=n?html:`<p class="empty">${T[lang].empty}</p>`;
  if(typeof afterRender==="function") afterRender();
}
function apply(){
  const t=T[lang]; document.documentElement.lang=lang; document.documentElement.dir=t.dir;
  $("langBtn").textContent=t.lang; $("q").placeholder=t.search;
  const note=$("demoNote"); note.hidden=!C.demoBanner; note.textContent=t.demo;
  $("note").textContent=t.note||"";
  $("credit").innerHTML=(lang==="ar"?"منيو ديجيتال من تصميم ":"Digital menu designed by ")+`<strong>${lang==="en"?"Mohamed":"محمد"}</strong>`;
  if(typeof hero==="function") hero();
  renderChips(); renderMenu();
}
$("langBtn").onclick=()=>{lang=lang==="ar"?"en":"ar";try{localStorage.setItem(KEY,lang)}catch(e){}apply();};
$("q").addEventListener("input",e=>{query=e.target.value;renderMenu();});
apply();
</script>
</body>
</html>
