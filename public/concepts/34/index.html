<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Concept 34</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#4a2e1c">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,800;1,600&family=Poppins:wght@400;500;600&family=Almarai:wght@400;700;800&display=swap">
<style>
*,*::before,*::after{box-sizing:border-box}
body{margin:0;overflow-x:hidden;-webkit-font-smoothing:antialiased;line-height:1.55;padding-bottom:env(safe-area-inset-bottom,0px)}
.demo-note{text-align:center;font-size:.8rem;padding:.45rem 1rem}
.empty{text-align:center;padding:3rem 1rem;opacity:.75}
button{font:inherit}

:root{--beige:#efe4d1;--beige2:#e6d7bd;--brown:#4a2e1c;--tan:#c49a5f;--card:#f8f1e4;--ink:#2e1d12;--soft:#86684d;--line:#dcc9aa}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--beige:#18110c;--beige2:#21170f;--card:#261a12;--ink:#f1e4cf;--soft:#c2a37e;--line:#3d2b1d}}
:root[data-theme="dark"]{--beige:#18110c;--beige2:#21170f;--card:#261a12;--ink:#f1e4cf;--soft:#c2a37e;--line:#3d2b1d}
body{background:var(--beige);color:var(--ink);font-family:"Almarai","Poppins",system-ui,sans-serif}
html[lang=en] body{font-family:"Poppins","Almarai",sans-serif}
.demo-note{background:var(--brown);color:var(--beige)}

header{position:relative;text-align:center;background:var(--brown);color:#efe4d1;padding:calc(env(safe-area-inset-top,0px) + 3.2rem) 1.2rem 2.4rem;overflow:hidden;
 clip-path:polygon(0 0,100% 0,100% 88%,0 100%)}
header::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(-62deg,transparent 0 26px,rgba(196,154,95,.13) 26px 40px);pointer-events:none}
.lang{position:absolute;top:calc(env(safe-area-inset-top,0px) + .8rem);inset-inline-end:1rem;background:var(--tan);color:var(--brown);border:0;padding:.25rem 1.1rem;cursor:pointer;min-height:36px;font-size:.8rem;z-index:2;transform:skewX(-14deg)}
#logo{position:relative;display:inline-block;padding:.4rem 1.4rem .6rem;background:var(--brown);direction:ltr}
.wm{position:relative;font:800 3.6rem/1 "Playfair Display",serif;letter-spacing:-.01em;color:#efe4d1}
.wm i{position:absolute;left:47%;top:-2px;bottom:4px;width:6px;background:var(--tan);transform:skewX(-24deg);border-radius:1px}
.sub{font:500 .62rem "Poppins";letter-spacing:.42em;margin:.35rem -.42em 0 0;color:var(--tan)}
.tg{font:600 1rem "Playfair Display";font-style:italic;margin:.9rem 0 0;color:#e4d3b6;direction:ltr;position:relative}
.info{font-size:.8rem;margin:.3rem 0 0;color:#c9b595;position:relative}
.bar{position:sticky;top:0;z-index:5;background:var(--beige);border-bottom:1px solid var(--line)}
.bar-in{max-width:560px;margin:0 auto;padding:.6rem 1.2rem .4rem}
.search input{width:100%;border:1.5px solid var(--brown);background:var(--card);color:var(--ink);border-radius:0;padding:.55rem 1rem;font:inherit}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .search input{border-color:var(--line)}}
.chips{display:flex;gap:.55rem;overflow-x:auto;padding:.55rem .4rem .15rem;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;border:1.5px solid var(--brown);background:none;color:var(--ink);padding:.3rem 1rem;cursor:pointer;min-height:36px;font-size:.84rem;transform:skewX(-14deg)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .chip{border-color:var(--soft)}}
.chip[aria-pressed="true"]{background:var(--tan);border-color:var(--tan);color:var(--brown)}
.chip:focus-visible,.lang:focus-visible,.search input:focus-visible{outline:2px solid var(--tan);outline-offset:2px}
main{max-width:560px;margin:0 auto;padding:.5rem 1.2rem 1.5rem}
section{margin-top:2rem;scroll-margin-top:120px}
h2{display:flex;align-items:baseline;gap:.7rem;margin:0 0 .6rem;font:800 1.25rem "Almarai"}
h2 .tab{display:inline-block;background:var(--brown);color:#efe4d1;padding:.25rem 1.1rem;transform:skewX(-14deg)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) h2 .tab{background:var(--tan);color:#2e1d12}}
h2 .tab span{display:inline-block;transform:skewX(14deg)}
h2 small{font:600 1rem "Playfair Display";font-style:italic;color:var(--soft);direction:ltr}

.row{position:relative;display:grid;grid-template-columns:1fr auto;align-items:center;gap:.8rem;padding:.6rem 1.1rem;margin:.45rem .35rem}
.row::before{content:"";position:absolute;inset:0;background:var(--card);border:1px solid var(--line);transform:skewX(-10deg);z-index:0}
.row>*{position:relative}
.nm .a{display:block;font-weight:700;font-size:.97rem}
.nm .e{display:block;font:400 .78rem "Poppins";color:var(--soft);direction:ltr;text-align:start}
html[dir=rtl] .nm .e{text-align:right}
.kc{display:block;font:400 .7rem "Poppins";color:var(--soft);margin-top:.1rem}
.pr{font:600 1.1rem "Poppins";direction:ltr;white-space:nowrap;color:var(--brown);text-align:end}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .pr{color:var(--tan)}}
.pr small{font:400 .64rem "Poppins";color:var(--soft);margin-inline-start:.2rem}
.sl{margin:0 .15rem;color:var(--soft)}
.foot{text-align:center;color:var(--soft);font-size:.8rem;padding:.5rem 1rem 2.2rem}.foot strong{color:var(--ink)}

</style>
</head>
<body>
<div class="demo-note" id="demoNote" hidden></div>

<header>
  <button class="lang" id="langBtn">English</button>
  <div id="logo"><span class="concept-wm" style="display:block;font-family:'Playfair Display',serif;font-weight:700;font-size:clamp(2.2rem,11vw,3.4rem);line-height:1.05;letter-spacing:-.01em;direction:ltr;white-space:nowrap">Concept 34</span></div>
  <p class="tg"></p>
  <p class="info" id="info"></p>
</header>

<div class="bar"><div class="bar-in">
  <div class="search"><input id="q" type="search" aria-label="Search"></div>
  <nav class="chips" id="chips" aria-label="Categories"></nav>
</div></div>
<main id="menu"></main>
<footer class="foot"><p id="note"></p><p id="credit"></p></footer>
<script>
const CONFIG = {"name":"Concept 34","nameAr":"Concept 34","tagline":{"ar":"Specialty Coffee","en":"Specialty Coffee"},"info":{"ar":"الرياض","en":"Riyadh"},"logo":"","colors":{"primary":"#4a2e1c","onPrimary":"#efe4d1","secondary":"#c49a5f","background":"#efe4d1","accent":"#c49a5f"},"fonts":{"display":"Playfair Display","body":"Almarai"},"pattern":"slanted parallelograms","currency":{"ar":"ر.س","en":"SAR"},"demoBanner":false,"credit":"محمد","categories":[{"id":"hot","ar":"المشروبات الحارة","en":"Hot","items":[{"ar":"إسبريسو","en":"Espresso","p":12,"c":1},{"ar":"قهوة اليوم","en":"Coffee of the Day","p":10,"c":2},{"ar":"قهوة مقطرة","en":"Drip","p":18,"c":4},{"ar":"أمريكانو","en":"Americano","p":11,"c":2},{"ar":"لونق بلاك","en":"Long Black","p":11,"c":5},{"ar":"كورتادو","en":"Cortado","p":13,"c":50},{"ar":"كابتشينو","en":"Cappuccino","p":16,"c":119},{"ar":"فلات وايت","en":"Flat White","p":16,"c":53},{"ar":"لاتيه","en":"Latte","p":17,"c":119},{"ar":"سبانش لاتيه","en":"Spanish Latte","p":17,"c":196},{"ar":"ماتشا لاتيه","en":"Matcha Latte","p":19,"c":180}]},{"id":"ice","ar":"المشروبات الباردة","en":"Ice Drinks","items":[{"ar":"آيس قهوة اليوم","en":"Ice Coffee of the Day","p":12,"c":2},{"ar":"آيس مقطرة","en":"Ice Drip","p":20,"c":4},{"ar":"آيس أمريكانو","en":"Ice Americano","p":13,"c":4},{"ar":"آيس لاتيه","en":"Ice Latte","p":18,"c":122},{"ar":"آيس سبانش لاتيه","en":"Ice Spanish Latte","p":21,"c":200},{"ar":"آيس ماتشا لاتيه","en":"Ice Matcha Latte","p":21,"c":200},{"ar":"آيس كركديه","en":"Ice Hibiscus","p":19,"c":112},{"ar":"آيس Concept 34 ماتشا لاتيه","en":"Ice Concept 34 Matcha Latte","p":26,"c":232}]},{"id":"sweet","ar":"الحلى","en":"Sweet","items":[{"ar":"تيراميسو","en":"Tiramisu","p":28,"c":680},{"ar":"بودينق جوز الهند","en":"Coconut Pudding","p":25,"c":440},{"ar":"براوني بار","en":"Brownie Bar","p":13,"c":467},{"ar":"كيكة الليمون","en":"Lemon Cake","p":15,"c":322},{"ar":"كيكة كاليبو","en":"Callepot Cake","p":15,"c":290},{"ar":"ميكس بار","en":"Mix Bar","p":15,"c":466},{"ar":"بودينق بيكان","en":"Pecan Pudding","p":26,"c":255},{"ar":"كيكة تربل شوكليت","en":"Triple Chocolate Cake","p":27,"c":522},{"ar":"بودينق شوكليت","en":"Choco Pudding","p":25,"c":690}]},{"id":"sandwich","ar":"الساندويتشات","en":"Sandwich","items":[{"ar":"تونة حارة","en":"Spicy Tuna","p":16,"c":350},{"ar":"حلومي","en":"Halloumi","p":16,"c":550},{"ar":"أربع أجبان","en":"Four Cheese","p":16,"c":600}]}]};
const C = CONFIG || {name:"Menu",categories:[]};
const T = {"ar": {"dir": "rtl", "lang": "English", "search": "وش تبي تطلب؟", "empty": "ما لقينا شي بهالاسم.", "all": "الكل", "demo": "", "note": "الأسعار بالريال · السعرات بالكيلو كالوري", "cal": "سعرة"}, "en": {"dir": "ltr", "lang": "العربية", "search": "What would you like?", "empty": "Nothing matches that.", "all": "All", "demo": "", "note": "Prices in SAR · calories in kcal", "cal": "kcal"}};
let lang="ar", active="all", query="";
const KEY="Concept 34-lang";
try{const s=localStorage.getItem(KEY);if(s==="ar"||s==="en")lang=s;}catch(e){}
try{const u=new URLSearchParams(location.search).get("lang");if(u==="ar"||u==="en")lang=u;}catch(e){}
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmt=n=>lang==="ar"?Number(n).toLocaleString("ar-EG"):Number(n).toLocaleString("en-US");
const cur=()=> (C.currency||{ar:"",en:""})[lang];
const L=(o,ar,en)=> lang==="ar" ? (o[ar]||o[en]||"") : (o[en]||o[ar]||"");
const P=i=> i.p2!=null ? `${fmt(i.p)}<span class="sl">/</span>${fmt(i.p2)}` : fmt(i.p);

function hero(){ $("info").textContent=L(C.info||{},"ar","en"); }
function section(c,ci,body){ return `<section id="cat-${esc(c.id)}"><h2><span class="tab"><span>${esc(c.ar)}</span></span><small>${esc(c.en)}</small></h2>${body}</section>`; }
function item(i){ return `<div class="row"><span class="nm"><span class="a">${esc(lang==="ar"?i.ar:i.en)}</span>${lang==="ar"?`<span class="e">${esc(i.en)}</span>`:""}<span class="kc">${fmt(i.c)} ${T[lang].cal}</span></span><span class="pr">${P(i)}<small>${cur()}</small></span></div>`; }

function renderChips(){
  const cats=[{id:"all",ar:T.ar.all,en:T.en.all},...C.categories];
  $("chips").innerHTML=cats.map(c=>`<button class="chip" data-id="${esc(c.id)}" aria-pressed="${c.id===active}">${esc(L(c,"ar","en"))}</button>`).join("");
  $("chips").querySelectorAll(".chip").forEach(b=>b.onclick=()=>{
    active=b.dataset.id;renderChips();
    if(active==="all"){window.scrollTo({top:0});return;}
    const el=$("cat-"+active); if(el) el.scrollIntoView({behavior:matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth",block:"start"});
  });
}
function renderMenu(){
  const q=query.trim().toLowerCase(); let html="",n=0,k=0;
  C.categories.forEach((c,ci)=>{
    const items=c.items.filter(i=>!q||[i.ar,i.en,i.dAr,i.dEn].join(" ").toLowerCase().includes(q));
    if(!items.length) return; n+=items.length;
    html+=section(c,ci,items.map(i=>item(i,++k,c)).join(""));
  });
  $("menu").innerHTML=n?html:`<p class="empty">${T[lang].empty}</p>`;
  if(typeof afterRender==="function") afterRender();
}
function apply(){
  const t=T[lang]; document.documentElement.lang=lang; document.documentElement.dir=t.dir;
  $("langBtn").textContent=t.lang; $("q").placeholder=t.search;
  const note=$("demoNote"); note.hidden=!C.demoBanner; note.textContent=t.demo;
  $("note").textContent=t.note||"";
  $("credit").innerHTML=(lang==="ar"?"منيو ديجيتال من تصميم ":"Digital menu designed by ")+`<strong>${lang==="en"?"Mohamed":"محمد"}</strong>`;
  if(typeof hero==="function") hero();
  renderChips(); renderMenu();
}
$("langBtn").onclick=()=>{lang=lang==="ar"?"en":"ar";try{localStorage.setItem(KEY,lang)}catch(e){}apply();};
$("q").addEventListener("input",e=>{query=e.target.value;renderMenu();});
apply();
</script>
</body>
</html>
