<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Concept 8</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#1b2130">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=Italianno&display=swap" media="print" onload="this.media='all'"><noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=Italianno&display=swap"></noscript>
<style>
*,*::before,*::after{box-sizing:border-box}
body{margin:0;overflow-x:hidden;-webkit-font-smoothing:antialiased;line-height:1.55;padding-bottom:env(safe-area-inset-bottom,0px)}
.demo-note{text-align:center;font-size:.8rem;padding:.45rem 1rem}
.empty{text-align:center;padding:3rem 1rem;opacity:.75}
button{font:inherit}

:root{--board:#1b2130;--tile:#1f4d40;--tile2:#2a6552;--cream:#f2ede3;--gold:#c9a86a;--ink:#1b2130;--soft:#5d6477;--paper:#f6f3ec;--card:#ffffff;--line:#e2ddd2}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--paper:#11151f;--card:#1a2030;--ink:#f2ede3;--soft:#aab0c0;--line:#2c3446}}
:root[data-theme="dark"]{--paper:#11151f;--card:#1a2030;--ink:#f2ede3;--soft:#aab0c0;--line:#2c3446}
body{background:var(--paper);color:var(--ink);font-family:"IBM Plex Sans Arabic",system-ui,sans-serif}
.demo-note{background:var(--board);color:var(--cream)}

header{position:relative;text-align:center;padding:calc(env(safe-area-inset-top,0px) + 3rem) 1.2rem 1.8rem;
 background:repeating-linear-gradient(90deg,var(--tile) 0 26px,#173d33 26px 28px),var(--tile);
 background-image:repeating-linear-gradient(90deg,transparent 0 26px,rgba(0,0,0,.35) 26px 28px),repeating-linear-gradient(0deg,transparent 0 78px,rgba(0,0,0,.35) 78px 80px),linear-gradient(120deg,var(--tile2),var(--tile) 60%)}
.lang{position:absolute;top:calc(env(safe-area-inset-top,0px) + .8rem);inset-inline-end:1rem;background:var(--board);color:var(--cream);border:1px solid var(--gold);border-radius:2px;padding:.25rem .85rem;cursor:pointer;min-height:36px;font-size:.8rem}
.plate{display:inline-block;background:var(--board);color:var(--cream);padding:1.5rem 2.2rem 1.2rem;box-shadow:0 18px 30px -18px rgba(0,0,0,.7)}
#logo{display:inline-block;padding:.3rem .6rem;background:var(--board)}
.wm{font:500 2.6rem/1 "Cormorant Garamond",serif;letter-spacing:.3em;margin-inline-end:-.3em;direction:ltr}
.sig{font:400 1.6rem/1 "Italianno",cursive;color:var(--gold);margin-top:.2rem;direction:ltr}
.info{font-size:.8rem;color:#cfd8d2;margin:.9rem 0 0}
.bar{position:sticky;top:0;z-index:5;background:var(--paper);border-bottom:1px solid var(--line)}
.bar-in{max-width:560px;margin:0 auto;padding:.6rem 1.2rem .4rem}
.search input{width:100%;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:0;padding:.55rem 1rem;font:inherit}
.chips{display:flex;gap:.4rem;overflow-x:auto;padding:.5rem 0 .1rem;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:0;padding:.3rem .85rem;cursor:pointer;min-height:36px;font-size:.84rem}
.chip[aria-pressed="true"]{background:var(--board);border-color:var(--board);color:var(--cream)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .chip[aria-pressed="true"]{background:var(--gold);color:var(--board)}}
.chip:focus-visible,.lang:focus-visible,.search input:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
main{max-width:560px;margin:0 auto;padding:.5rem 1.2rem 1.5rem}
section{margin-top:1.6rem;scroll-margin-top:120px}
h2{margin:0 0 .5rem;font:600 1.2rem "IBM Plex Sans Arabic";padding-bottom:.35rem;border-bottom:1px solid var(--ink)}
html[lang=en] h2{font:600 1.45rem "Cormorant Garamond",serif}
.row{display:flex;justify-content:space-between;gap:.8rem;padding:.45rem 0;border-bottom:1px solid var(--line)}
.nm small{display:block;color:var(--soft);font-size:.76rem}
.pr{font-weight:600;white-space:nowrap;direction:ltr}.pr small{font-size:.68rem;font-weight:400;color:var(--soft);margin-inline-start:.2rem}

.build{margin-top:2rem;background:var(--board);color:var(--cream);padding:1.1rem 1rem 1rem;text-align:center}
.build h3{margin:0;font:400 2rem/1 "Italianno",cursive;color:var(--gold)}
html[lang=ar] .build h3{font:600 1.15rem "IBM Plex Sans Arabic"}
.build p{margin:.35rem 0 .7rem;font-size:.82rem;color:#c9ccd6}
.spiral{width:64px;height:92px;margin:0 auto .6rem;border-radius:30px 30px 8px 8px;background:repeating-linear-gradient(-28deg,#c98a3c 0 9px,#a8692a 9px 12px)}
.tops{display:flex;flex-wrap:wrap;justify-content:center;gap:.35rem}
.tops button{border:1px solid var(--gold);background:none;color:var(--cream);border-radius:999px;padding:.2rem .7rem;min-height:32px;cursor:pointer;font-size:.8rem}
.tops button[aria-pressed="true"]{background:var(--gold);color:var(--board)}
.total{margin-top:.7rem;font-weight:600;direction:ltr}
.foot{text-align:center;color:var(--soft);font-size:.8rem;padding:.5rem 1rem 2.2rem}.foot strong{color:var(--ink)}

</style>
</head>
<body>
<div class="demo-note" id="demoNote" hidden></div>

<header>
  <button class="lang" id="langBtn">English</button>
  <div class="plate"><div id="logo"><span class="concept-wm" style="display:block;font-family:'Cormorant Garamond',serif;font-weight:700;font-size:clamp(2.2rem,11vw,3.4rem);line-height:1.05;letter-spacing:-.01em;direction:ltr;white-space:nowrap">Concept 8</span></div></div>
  <p class="info" id="info"></p>
</header>

<div class="bar"><div class="bar-in">
  <div class="search"><input id="q" type="search" aria-label="Search"></div>
  <nav class="chips" id="chips" aria-label="Categories"></nav>
</div></div>
<main id="menu"></main>
<footer class="foot"><p id="note"></p><p id="credit"></p></footer>
<script>
const CONFIG = {"name":"Concept 8","nameAr":"Concept 8","tagline":{"ar":"قهوة مختصة","en":"Specialty Coffee"},"info":{"ar":"الرياض","en":"Riyadh"},"logo":"","colors":{"primary":"#1b2130","onPrimary":"#f2ede3","secondary":"#1f4d40","background":"#f6f3ec","accent":"#c9a86a"},"fonts":{"display":"Cormorant Garamond","body":"IBM Plex Sans Arabic"},"pattern":"green tiles","currency":{"ar":"ر.س","en":"SAR"},"demoBanner":false,"credit":"محمد","categories":[{"id":"chimney","ar":"كعكة تشمني","en":"Chimney Cake","items":[{"ar":"كعكة تشمني كلاسيك","en":"Classic Chimney Cake","p":19},{"ar":"كعكة تشمني بالقرفة","en":"Cinnamon Chimney Cake","p":19},{"ar":"إضافات الكعكة","en":"Chimney cake add-ons","dAr":"فستق، نوتيلا، رافاييلو، لوتس، شوكولاتة بيضاء، كيندر بوينو، أوريو","dEn":"Pistachio, Nutella, Raffaello, Lotus, White chocolate, Kinder Bueno, Oreo","p":5}]},{"id":"espresso","ar":"قهوة (محضّرة بالإسبريسو)","en":"Coffee · Espresso Based","items":[{"ar":"إسبريسو","en":"Espresso","p":11},{"ar":"دبل إسبريسو","en":"Double Espresso","p":13},{"ar":"أمريكانو (حار / بارد)","en":"Americano (hot / iced)","p":13},{"ar":"كابتشينو","en":"Cappuccino","p":15},{"ar":"لاتيه (حار / بارد)","en":"Latte (hot / iced)","p":15},{"ar":"فلات وايت","en":"Flat White","p":15},{"ar":"سبانش لاتيه (حار / بارد)","en":"Spanish Latte (hot / iced)","p":17}]},{"id":"brew","ar":"قهوة (طريقة التحضير)","en":"Coffee · Brew Methods","items":[{"ar":"V60","en":"V60","p":17},{"ar":"قهوة اليوم (حار / بارد)","en":"Coffee of the Day (hot / iced)","p":11},{"ar":"صندوق قهوة ١ لتر","en":"Coffee Box 1L","p":42}]},{"id":"matcha","ar":"الماتشا الباردة","en":"Iced Matcha","items":[{"ar":"لاتيه ماتشا بالفراولة","en":"Strawberry Matcha Latte","p":25},{"ar":"لاتيه ماتشا بالمانجو","en":"Mango Matcha Latte","p":25},{"ar":"لاتيه ماتشا التمر (توقيع الدرعية)","en":"Diriyah Signature Date Matcha Latte","p":25},{"ar":"لاتيه ماتشا باللافندر السعودي","en":"Saudi Lavender Matcha Latte","p":25}]},{"id":"drinks","ar":"المشروبات","en":"Drinks","items":[{"ar":"موهيتو","en":"Mojito","dAr":"كلاسيك، ورد، فراولة وباشن فروت، بطيخ","dEn":"Classic, rose, strawberry passion fruit, watermelon","p":17},{"ar":"مياه","en":"Water","p":2},{"ar":"مياه معدنية فوّارة","en":"Sparkling Water","p":5},{"ar":"كركديه بارد","en":"Iced Karkade","p":15},{"ar":"شاي","en":"Tea","p":5}]},{"id":"ice","ar":"آيس كريم","en":"Ice Cream","items":[{"ar":"كوب آيس كريم","en":"Ice Cream Cup","p":10},{"ar":"آيس كريم مع إضافات","en":"Ice Cream with Topping","dAr":"فراولة، مانجو، توت أزرق، باشن فروت","dEn":"Strawberry, mango, blueberry, passion fruit","p":15}]}]};
const C = CONFIG || {name:"Menu",categories:[]};
const T = {"ar": {"dir": "rtl", "lang": "English", "search": "دوّر على طلبك…", "empty": "ما لقينا شي بهالاسم.", "all": "الكل", "demo": "", "note": "", "b": "ركّب كعكة التشمني حقتك", "bp": "اختر الإضافات وشوف السعر", "base": "كعكة كلاسيك ١٩", "tot": "الإجمالي", "tops": ["فستق", "نوتيلا", "رافاييلو", "لوتس", "شوكولاتة بيضاء", "كيندر بوينو", "أوريو"]}, "en": {"dir": "ltr", "lang": "العربية", "search": "Find your order…", "empty": "Nothing matches that.", "all": "All", "demo": "", "note": "", "b": "Build your chimney cake", "bp": "Pick your toppings and see the price", "base": "Classic cake 19", "tot": "Total", "tops": ["Pistachio", "Nutella", "Raffaello", "Lotus", "White chocolate", "Kinder Bueno", "Oreo"]}};
let lang="ar", active="all", query="";
const KEY="Concept 8-lang";
try{const s=localStorage.getItem(KEY);if(s==="ar"||s==="en")lang=s;}catch(e){}
try{const u=new URLSearchParams(location.search).get("lang");if(u==="ar"||u==="en")lang=u;}catch(e){}
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmt=n=>lang==="ar"?Number(n).toLocaleString("ar-EG"):Number(n).toLocaleString("en-US");
const cur=()=> (C.currency||{ar:"",en:""})[lang];
const L=(o,ar,en)=> lang==="ar" ? (o[ar]||o[en]||"") : (o[en]||o[ar]||"");
const P=i=> i.p2!=null ? `${fmt(i.p)}<span class="sl">/</span>${fmt(i.p2)}` : fmt(i.p);

let picks=new Set();
function hero(){ $("info").textContent=L(C.info||{},"ar","en"); }
function section(c,ci,body){ return `<section id="cat-${esc(c.id)}"><h2>${esc(L(c,"ar","en"))}</h2>${body}</section>`; }
function item(i){ const d=L(i,"dAr","dEn"); return `<div class="row"><span class="nm">${esc(L(i,"ar","en"))}${d?`<small>${esc(d)}</small>`:""}</span><span class="pr">${P(i)}<small>${cur()}</small></span></div>`; }
function afterRender(){ if(query.trim()) return; const t=T[lang];
  const draw=()=>{ const tot=19+picks.size*5; $("tops").innerHTML=t.tops.map((x,k)=>`<button data-k="${k}" aria-pressed="${picks.has(k)}">${x} +${fmt(5)}</button>`).join(""); $("tot").textContent=`${t.tot}: ${fmt(tot)} ${cur()}`;
    $("tops").querySelectorAll("button").forEach(b=>b.onclick=()=>{const k=+b.dataset.k; picks.has(k)?picks.delete(k):picks.add(k); draw();}); };
  $("menu").insertAdjacentHTML("beforeend",`<div class="build"><div class="spiral" aria-hidden="true"></div><h3>${t.b}</h3><p>${t.bp} · ${t.base}</p><div class="tops" id="tops"></div><div class="total" id="tot"></div></div>`); draw(); }

function renderChips(){
  const cats=[{id:"all",ar:T.ar.all,en:T.en.all},...C.categories];
  $("chips").innerHTML=cats.map(c=>`<button class="chip" data-id="${esc(c.id)}" aria-pressed="${c.id===active}">${esc(L(c,"ar","en"))}</button>`).join("");
  $("chips").querySelectorAll(".chip").forEach(b=>b.onclick=()=>{
    active=b.dataset.id;renderChips();
    if(active==="all"){window.scrollTo({top:0});return;}
    const el=$("cat-"+active); if(el) el.scrollIntoView({behavior:matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth",block:"start"});
  });
}
function renderMenu(){
  const q=query.trim().toLowerCase(); let html="",n=0,k=0;
  C.categories.forEach((c,ci)=>{
    const items=c.items.filter(i=>!q||[i.ar,i.en,i.dAr,i.dEn].join(" ").toLowerCase().includes(q));
    if(!items.length) return; n+=items.length;
    html+=section(c,ci,items.map(i=>item(i,++k,c)).join(""));
  });
  $("menu").innerHTML=n?html:`<p class="empty">${T[lang].empty}</p>`;
  if(typeof afterRender==="function") afterRender();
}
function apply(){
  const t=T[lang]; document.documentElement.lang=lang; document.documentElement.dir=t.dir;
  $("langBtn").textContent=t.lang; $("q").placeholder=t.search;
  const note=$("demoNote"); note.hidden=!C.demoBanner; note.textContent=t.demo;
  $("note").textContent=t.note||"";
  $("credit").innerHTML=(lang==="ar"?"منيو ديجيتال من تصميم ":"Digital menu designed by ")+`<strong>${lang==="en"?"Mohamed":"محمد"}</strong>`;
  if(typeof hero==="function") hero();
  renderChips(); renderMenu();
}
$("langBtn").onclick=()=>{lang=lang==="ar"?"en":"ar";try{localStorage.setItem(KEY,lang)}catch(e){}apply();};
$("q").addEventListener("input",e=>{query=e.target.value;renderMenu();});
apply();
</script>
<script>(function(){if(window.parent===window)return;var s=0,t=0;function send(m){try{parent.postMessage(m,"*")}catch(e){}}
addEventListener("scroll",function(){if(!s){s=1;send("concept-scrolled")}},{passive:true});
addEventListener("pointerdown",function(){if(!t){t=1;send("concept-touched")}},{passive:true})})()</script>
</body>
</html>
