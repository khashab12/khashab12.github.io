<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Concept 32</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#56656a">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=IBM+Plex+Sans+Arabic:wght@300;400;500;600&family=Poppins:wght@300;400;500&display=swap" media="print" onload="this.media='all'"><noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=IBM+Plex+Sans+Arabic:wght@300;400;500;600&family=Poppins:wght@300;400;500&display=swap"></noscript>
<style>
*,*::before,*::after{box-sizing:border-box}
body{margin:0;overflow-x:hidden;-webkit-font-smoothing:antialiased;line-height:1.55;padding-bottom:env(safe-area-inset-bottom,0px)}
.demo-note{text-align:center;font-size:.8rem;padding:.45rem 1rem}
.empty{text-align:center;padding:3rem 1rem;opacity:.75}
button{font:inherit}

:root{--slate:#56656a;--slate2:#46545a;--cream:#ece3cf;--sky:#b9d4e6;--teal:#3f6f80;--paper:#eef0ee;--card:#fbfaf6;--ink:#2c3538;--soft:#6d7a7e;--line:#d9dedc}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--paper:#161c1e;--card:#20282b;--ink:#eef0ea;--soft:#a9b5b8;--line:#334044}}
:root[data-theme="dark"]{--paper:#161c1e;--card:#20282b;--ink:#eef0ea;--soft:#a9b5b8;--line:#334044}
body{background:var(--paper);color:var(--ink);font-family:"IBM Plex Sans Arabic","Poppins",system-ui,sans-serif}
html[lang=en] body{font-family:"Poppins","IBM Plex Sans Arabic",sans-serif}
.demo-note{background:var(--teal);color:#fff}
header{position:relative;background:var(--slate);color:var(--cream);text-align:center;padding:calc(env(safe-area-inset-top,0px) + 3.2rem) 1.2rem 2.2rem;overflow:hidden}

header::after{content:"";position:absolute;inset:auto -10% -30px -10%;height:90px;background:linear-gradient(-8deg,transparent 40%,rgba(185,212,230,.35) 40% 52%,transparent 52% 60%,rgba(185,212,230,.22) 60% 68%,transparent 68%);pointer-events:none}
.lang{position:absolute;top:calc(env(safe-area-inset-top,0px) + .8rem);inset-inline-end:1rem;background:transparent;color:var(--cream);border:1px solid rgba(236,227,207,.6);border-radius:999px;padding:.25rem .95rem;cursor:pointer;min-height:36px;font-size:.8rem;z-index:2}
#logo{display:inline-block;padding:.8rem 1.2rem;background:var(--slate)}
#logo svg{display:block;width:170px;height:auto;margin:0 auto}
.sk{font:500 .8rem "Poppins";letter-spacing:.55em;margin:.35rem -.55em 0 0;direction:ltr}
.tg{font:500 1.05rem "IBM Plex Sans Arabic";margin:.5rem 0 0}
.tg small{display:block;font:italic 600 1.1rem "Cormorant Garamond";letter-spacing:.04em;opacity:.85;direction:ltr}
.info{font-size:.78rem;opacity:.8;margin:.7rem 0 0}
.bar{position:sticky;top:0;z-index:5;background:var(--paper);border-bottom:1px solid var(--line)}
.bar-in{max-width:560px;margin:0 auto;padding:.6rem 1.2rem .4rem}
.search input{width:100%;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:.55rem 1rem;font:inherit}
.chips{display:flex;gap:.4rem;overflow-x:auto;padding:.5rem 0 .1rem;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:.3rem .9rem;cursor:pointer;min-height:36px;font-size:.84rem}
.chip[aria-pressed="true"]{background:var(--teal);border-color:var(--teal);color:#fff}
.chip:focus-visible,.lang:focus-visible,.search input:focus-visible{outline:2px solid var(--sky);outline-offset:2px}
main{max-width:560px;margin:0 auto;padding:.5rem 1.2rem 1.5rem}

section{position:relative;margin-top:1.4rem;background:var(--card);border-radius:18px;padding:1.1rem 1.1rem .6rem;box-shadow:0 14px 30px -22px rgba(44,53,56,.55);overflow:hidden;scroll-margin-top:120px}
section::before{content:"";position:absolute;top:0;inset-inline-end:0;width:140px;height:100%;background:linear-gradient(105deg,transparent 30%,rgba(185,212,230,.55) 30% 44%,transparent 44% 52%,rgba(185,212,230,.35) 52% 60%,transparent 60%);pointer-events:none;opacity:.6}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) section::before{opacity:.25}}
.kh{position:relative;display:flex;align-items:baseline;justify-content:space-between;border-bottom:1px solid var(--line);padding-bottom:.55rem;margin-bottom:.3rem}
h2{margin:0;font:600 1.15rem "IBM Plex Sans Arabic"}
html[lang=en] h2{font:600 1.35rem "Cormorant Garamond";letter-spacing:.03em}
.room{display:inline-flex;align-items:baseline;gap:.35rem;font:300 .7rem "Poppins";letter-spacing:.25em;color:var(--soft);direction:ltr}
.room b{font:500 1.1rem "Poppins";letter-spacing:.05em;color:var(--teal)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .room b{color:var(--sky)}}
.it{position:relative;display:flex;justify-content:space-between;gap:.8rem;padding:.55rem 0;border-bottom:1px dashed var(--line)}
.it:last-child{border-bottom:0}
.nm{font-weight:500}
.ds{display:block;font-size:.74rem;color:var(--soft);font-weight:300}
.pr{white-space:nowrap;font:500 1rem "Poppins";direction:ltr;color:var(--ink)}
.pr small{font-size:.66rem;color:var(--soft);margin-inline-start:.2rem}
.sl{margin:0 .15rem;color:var(--soft)}
.foot{text-align:center;color:var(--soft);font-size:.8rem;padding:.5rem 1rem 2.2rem}.foot strong{color:var(--ink)}

</style>
</head>
<body>
<div class="demo-note" id="demoNote" hidden></div>

<header>
  <button class="lang" id="langBtn">English</button>
  <div id="logo"><span class="concept-wm" style="display:block;font-family:'Cormorant Garamond',serif;font-weight:700;font-size:clamp(2.2rem,11vw,3.4rem);line-height:1.05;letter-spacing:-.01em;direction:ltr;white-space:nowrap">Concept 32</span></div>
  <p class="tg" id="tg"></p>
  <p class="info" id="info"></p>
</header>

<div class="bar"><div class="bar-in">
  <div class="search"><input id="q" type="search" aria-label="Search"></div>
  <nav class="chips" id="chips" aria-label="Categories"></nav>
</div></div>
<main id="menu"></main>
<footer class="foot"><p id="note"></p><p id="credit"></p></footer>
<script>
const CONFIG = {"name":"Concept 32","nameAr":"Concept 32","tagline":{"ar":"قهوة مختصة","en":"Specialty Coffee"},"info":{"ar":"الرياض","en":"Riyadh"},"logo":"","colors":{"primary":"#56656a","onPrimary":"#ece3cf","secondary":"#b9d4e6","background":"#eef0ee","accent":"#3f6f80"},"fonts":{"display":"Cormorant Garamond","body":"IBM Plex Sans Arabic"},"pattern":"key card bands","currency":{"ar":"ر.س","en":"SAR"},"demoBanner":true,"credit":"محمد","categories":[{"id":"hot","ar":"قهوة حارة","en":"Hot Coffee","items":[{"ar":"قهوة اليوم","en":"Coffee of the Day","p":12},{"ar":"V60","en":"V60","dAr":"محصول الأسبوع","dEn":"crop of the week","p":19},{"ar":"إسبريسو","en":"Espresso","p":11},{"ar":"كورتادو","en":"Cortado","p":14},{"ar":"فلات وايت","en":"Flat White","p":16},{"ar":"لاتيه","en":"Latte","p":17}]},{"id":"cold","ar":"قهوة باردة","en":"Iced Coffee","items":[{"ar":"قهوة اليوم باردة","en":"Iced Coffee of the Day","p":13},{"ar":"آيس دريب","en":"Iced Drip","p":20},{"ar":"آيس لاتيه","en":"Iced Latte","p":18},{"ar":"آيس سبانش لاتيه","en":"Iced Spanish Latte","p":19}]},{"id":"matcha","ar":"ماتشا","en":"Matcha","items":[{"ar":"ماتشا لاتيه","en":"Matcha Latte","p":21},{"ar":"آيس ماتشا لاتيه","en":"Iced Matcha Latte","p":22}]},{"id":"sweet","ar":"الحلى","en":"Sweets","items":[{"ar":"تيراميسو","en":"Tiramisu","p":26},{"ar":"كيكة شوكولاتة","en":"Chocolate Cake","p":25},{"ar":"شيفون كيك","en":"Chiffon Cake","p":24}]},{"id":"more","ar":"أخرى","en":"More","items":[{"ar":"ماء","en":"Water","p":2}]}]};
const C = CONFIG || {name:"Menu",categories:[]};
const T = {"ar": {"dir": "rtl", "lang": "English", "search": "وش تبي تطلب؟", "empty": "ما لقينا شي بهالاسم.", "all": "الكل", "demo": "تصور تجريبي — الأصناف والأسعار أمثلة وليست منيو المحل", "note": "", "tg": "قهوة مختصة", "room": "غرفة"}, "en": {"dir": "ltr", "lang": "العربية", "search": "What would you like?", "empty": "Nothing matches that.", "all": "All", "demo": "Demo — items and prices are examples, not the café's menu", "note": "", "tg": "Specialty Coffee", "room": "ROOM"}};
let lang="ar", active="all", query="";
const KEY="Concept 32-lang";
try{const s=localStorage.getItem(KEY);if(s==="ar"||s==="en")lang=s;}catch(e){}
try{const u=new URLSearchParams(location.search).get("lang");if(u==="ar"||u==="en")lang=u;}catch(e){}
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmt=n=>lang==="ar"?Number(n).toLocaleString("ar-EG"):Number(n).toLocaleString("en-US");
const cur=()=> (C.currency||{ar:"",en:""})[lang];
const L=(o,ar,en)=> lang==="ar" ? (o[ar]||o[en]||"") : (o[en]||o[ar]||"");
const P=i=> i.p2!=null ? `${fmt(i.p)}<span class="sl">/</span>${fmt(i.p2)}` : fmt(i.p);

function hero(){ $("info").textContent=L(C.info||{},"ar","en"); $("tg").innerHTML=`${esc(T[lang].tg)}<small></small>`; }
function section(c,ci,body){ const n=String(ci+1).padStart(2,"0"); return `<section id="cat-${esc(c.id)}"><div class="kh"><h2>${esc(L(c,"ar","en"))}</h2><span class="room">${T[lang].room}<b>${n}</b></span></div>${body}</section>`; }
function item(i){ const d=L(i,"dAr","dEn"); return `<div class="it"><span><span class="nm">${esc(L(i,"ar","en"))}</span>${d?`<span class="ds">${esc(d)}</span>`:""}</span><span class="pr">${P(i)}<small>${cur()}</small></span></div>`; }

function renderChips(){
  const cats=[{id:"all",ar:T.ar.all,en:T.en.all},...C.categories];
  $("chips").innerHTML=cats.map(c=>`<button class="chip" data-id="${esc(c.id)}" aria-pressed="${c.id===active}">${esc(L(c,"ar","en"))}</button>`).join("");
  $("chips").querySelectorAll(".chip").forEach(b=>b.onclick=()=>{
    active=b.dataset.id;renderChips();
    if(active==="all"){window.scrollTo({top:0});return;}
    const el=$("cat-"+active); if(el) el.scrollIntoView({behavior:matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth",block:"start"});
  });
}
function renderMenu(){
  const q=query.trim().toLowerCase(); let html="",n=0,k=0;
  C.categories.forEach((c,ci)=>{
    const items=c.items.filter(i=>!q||[i.ar,i.en,i.dAr,i.dEn].join(" ").toLowerCase().includes(q));
    if(!items.length) return; n+=items.length;
    html+=section(c,ci,items.map(i=>item(i,++k,c)).join(""));
  });
  $("menu").innerHTML=n?html:`<p class="empty">${T[lang].empty}</p>`;
  if(typeof afterRender==="function") afterRender();
}
function apply(){
  const t=T[lang]; document.documentElement.lang=lang; document.documentElement.dir=t.dir;
  $("langBtn").textContent=t.lang; $("q").placeholder=t.search;
  const note=$("demoNote"); note.hidden=!C.demoBanner; note.textContent=t.demo;
  $("note").textContent=t.note||"";
  $("credit").innerHTML=(lang==="ar"?"منيو ديجيتال من تصميم ":"Digital menu designed by ")+`<strong>${lang==="en"?"Mohamed":"محمد"}</strong>`;
  if(typeof hero==="function") hero();
  renderChips(); renderMenu();
}
$("langBtn").onclick=()=>{lang=lang==="ar"?"en":"ar";try{localStorage.setItem(KEY,lang)}catch(e){}apply();};
$("q").addEventListener("input",e=>{query=e.target.value;renderMenu();});
apply();
</script>
<script>(function(){if(window.parent===window)return;var s=0,t=0;function send(m){try{parent.postMessage(m,"*")}catch(e){}}
addEventListener("scroll",function(){if(!s){s=1;send("concept-scrolled")}},{passive:true});
addEventListener("pointerdown",function(){if(!t){t=1;send("concept-touched")}},{passive:true})})()</script>
</body>
</html>
