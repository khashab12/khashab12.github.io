<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Concept 23</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0d0d0d">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Cairo:wght@400;600;800&family=Permanent+Marker&display=swap" media="print" onload="this.media='all'"><noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Cairo:wght@400;600;800&family=Permanent+Marker&display=swap"></noscript>
<style>
*,*::before,*::after{box-sizing:border-box}
body{margin:0;overflow-x:hidden;-webkit-font-smoothing:antialiased;line-height:1.55;padding-bottom:env(safe-area-inset-bottom,0px)}
.demo-note{text-align:center;font-size:.8rem;padding:.45rem 1rem}
.empty{text-align:center;padding:3rem 1rem;opacity:.75}
button{font:inherit}

:root{--bg:#f2f2ee;--ink:#0d0d0d;--paper:#ffffff;--soft:#5a5a5a;--line:#0d0d0d}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d0d0d;--ink:#f2f2ee;--paper:#1a1a1a;--soft:#b5b5b5;--line:#f2f2ee}}
:root[data-theme="dark"]{--bg:#0d0d0d;--ink:#f2f2ee;--paper:#1a1a1a;--soft:#b5b5b5;--line:#f2f2ee}
body{background:var(--bg);color:var(--ink);font-family:"Cairo",system-ui,sans-serif}
.demo-note{background:var(--ink);color:var(--bg);font-weight:600}
header{position:relative;background:#0d0d0d;color:#f2f2ee;padding:calc(env(safe-area-inset-top,0px) + 3rem) 1.2rem 1.4rem;text-align:center;overflow:hidden}

header::after{content:"";position:absolute;left:0;right:0;bottom:0;height:10px;background:repeating-linear-gradient(90deg,#f2f2ee 0 28px,transparent 28px 48px)}
.lang{position:absolute;top:calc(env(safe-area-inset-top,0px) + .8rem);inset-inline-end:1rem;background:#f2f2ee;color:#0d0d0d;border:0;border-radius:0;padding:.3rem .9rem;cursor:pointer;min-height:36px;font:800 .8rem "Cairo"}
#logo{display:inline-block;padding:.6rem 1rem;background:#0d0d0d;direction:ltr}
.w1{font:400 3.6rem/.85 "Permanent Marker",cursive;letter-spacing:.02em;transform:rotate(-4deg)}
.w2{font:400 2.4rem/.9 "Bebas Neue";letter-spacing:.3em;margin-top:.3rem}
.drip{display:block;width:120px;height:18px;margin:.1rem auto 0}
.motto{font:400 1.2rem "Bebas Neue";letter-spacing:.12em;margin:.6rem 0 0;direction:ltr}
.modes{display:flex;justify-content:center;gap:.4rem;margin:.6rem 0 .6rem;flex-wrap:wrap}
.modes span{border:1.5px solid #f2f2ee;padding:0 .6rem;font:600 .75rem "Cairo"}
.info{font-size:.78rem;opacity:.75;margin:0 0 .6rem}
.bar{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:3px solid var(--line)}
.bar-in{max-width:560px;margin:0 auto;padding:.6rem 1.2rem .4rem}
.search input{width:100%;border:2px solid var(--line);background:var(--paper);color:var(--ink);border-radius:0;padding:.55rem 1rem;font:inherit}
.chips{display:flex;gap:.4rem;overflow-x:auto;padding:.5rem 0 .1rem;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;border:2px solid var(--line);background:none;color:var(--ink);font:400 1.15rem "Bebas Neue";letter-spacing:.08em;padding:.1rem .8rem;border-radius:0;cursor:pointer;min-height:36px}
html[lang=ar] .chip{font:800 .85rem "Cairo"}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.chip:focus-visible,.lang:focus-visible,.search input:focus-visible{outline:3px solid var(--soft);outline-offset:2px}
main{max-width:560px;margin:0 auto;padding:.5rem 1.2rem 1.5rem}

section{position:relative;margin-top:1.6rem;background:var(--paper);padding:1rem 1.1rem 1.4rem;scroll-margin-top:120px;border:2px solid var(--line);
 -webkit-mask:radial-gradient(circle 7px at 50% 100%,transparent 98%,#000) 0 0/18px 100% repeat-x;mask:radial-gradient(circle 7px at 50% 100%,transparent 98%,#000) 0 0/18px 100% repeat-x}
.tk{display:flex;justify-content:space-between;font:600 .7rem "Cairo";color:var(--soft);letter-spacing:.1em;direction:ltr}
h2{margin:.2rem 0 .5rem;font:400 2.2rem/1 "Bebas Neue";letter-spacing:.06em;border-bottom:2px dashed var(--line);padding-bottom:.4rem}
html[lang=ar] h2{font:800 1.5rem "Cairo"}
.row{display:flex;align-items:baseline;gap:.5rem;padding:.35rem 0}
.q{font:400 1.05rem "Bebas Neue";color:var(--soft);min-width:1.6rem}
.nm{flex:1;font-weight:600}
.pr{font:400 1.3rem "Bebas Neue";letter-spacing:.04em;direction:ltr}
.pr small{font:600 .6rem "Cairo";margin-inline-start:.2rem}
.foot{text-align:center;color:var(--soft);font-size:.8rem;padding:.5rem 1rem 2.2rem}.foot strong{color:var(--ink)}

</style>
</head>
<body>
<div class="demo-note" id="demoNote" hidden></div>

<header>
  <button class="lang" id="langBtn">English</button>
  <div id="logo"><span class="concept-wm" style="display:block;font-family:'Bebas Neue',serif;font-weight:700;font-size:clamp(2.2rem,11vw,3.4rem);line-height:1.05;letter-spacing:-.01em;direction:ltr;white-space:nowrap">Concept 23</span></div>
  <p class="motto"></p>
  <div class="modes" id="modes"></div>
  <p class="info" id="info"></p>
</header>

<div class="bar"><div class="bar-in">
  <div class="search"><input id="q" type="search" aria-label="Search"></div>
  <nav class="chips" id="chips" aria-label="Categories"></nav>
</div></div>
<main id="menu"></main>
<footer class="foot"><p id="note"></p><p id="credit"></p></footer>
<script>
const CONFIG = {"name":"Concept 23","nameAr":"Concept 23","tagline":{"ar":"Specialty Coffee","en":"Specialty Coffee"},"info":{"ar":"القاهرة","en":"Cairo"},"logo":"","colors":{"primary":"#0d0d0d","onPrimary":"#f2f2ee","secondary":"#f2f2ee","background":"#f2f2ee","accent":"#0d0d0d"},"fonts":{"display":"Bebas Neue","body":"Cairo"},"pattern":"lane stripes","currency":{"ar":"ج.م","en":"EGP"},"demoBanner":true,"credit":"محمد","categories":[{"id":"black","ar":"بلاك","en":"Black","items":[{"ar":"إسبريسو","en":"Espresso","p":70},{"ar":"أمريكانو","en":"Americano","p":80},{"ar":"V60","en":"V60","p":110}]},{"id":"milk","ar":"بلبن","en":"With Milk","items":[{"ar":"كورتادو","en":"Cortado","p":90},{"ar":"فلات وايت","en":"Flat White","p":100},{"ar":"لاتيه","en":"Latte","p":105},{"ar":"سبانش لاتيه","en":"Spanish Latte","p":125}]},{"id":"iced","ar":"ساقع","en":"Iced","items":[{"ar":"آيس لاتيه","en":"Iced Latte","p":115},{"ar":"آيس سبانش لاتيه","en":"Iced Spanish Latte","p":135},{"ar":"كولد برو","en":"Cold Brew","p":110},{"ar":"آيس ماتشا","en":"Iced Matcha","p":130}]},{"id":"grab","ar":"على السريع","en":"Grab & Go","items":[{"ar":"كرواسون","en":"Croissant","p":65},{"ar":"كوكيز","en":"Cookie","p":55}]}]};
const C = CONFIG || {name:"Menu",categories:[]};
const T = {"ar": {"dir": "rtl", "lang": "English", "search": "دوّر على طلبك…", "empty": "مفيش حاجة بالاسم ده.", "all": "الكل", "demo": "ديمو — الأصناف والأسعار هنا أمثلة، مش المنيو الحقيقي", "note": "", "modes": ["جوه", "برا", "درايف ثرو"], "order": "طلب"}, "en": {"dir": "ltr", "lang": "العربية", "search": "Find your order…", "empty": "Nothing matches that.", "all": "All", "demo": "Demo — items and prices here are examples, not the real menu", "note": "", "modes": ["Indoor", "Outdoor", "Drive-thru"], "order": "ORDER"}};
let lang="ar", active="all", query="";
const KEY="Concept 23-lang";
try{const s=localStorage.getItem(KEY);if(s==="ar"||s==="en")lang=s;}catch(e){}
try{const u=new URLSearchParams(location.search).get("lang");if(u==="ar"||u==="en")lang=u;}catch(e){}
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmt=n=>lang==="ar"?Number(n).toLocaleString("ar-EG"):Number(n).toLocaleString("en-US");
const cur=()=> (C.currency||{ar:"",en:""})[lang];
const L=(o,ar,en)=> lang==="ar" ? (o[ar]||o[en]||"") : (o[en]||o[ar]||"");
const P=i=> i.p2!=null ? `${fmt(i.p)}<span class="sl">/</span>${fmt(i.p2)}` : fmt(i.p);

function hero(){ $("info").textContent=L(C.info||{},"ar","en"); $("modes").innerHTML=T[lang].modes.map(m=>`<span>${m}</span>`).join(""); }
function section(c,ci,body){ return `<section id="cat-${esc(c.id)}"><div class="tk"><span>${T.en.order} #${String(ci+1).padStart(3,"0")}</span><span>Concept 23</span></div><h2>${esc(L(c,"ar","en"))}</h2>${body}</section>`; }
function item(i){ return `<div class="row"><span class="q">1×</span><span class="nm">${esc(L(i,"ar","en"))}</span><span class="pr">${fmt(i.p)}<small>${cur()}</small></span></div>`; }

function renderChips(){
  const cats=[{id:"all",ar:T.ar.all,en:T.en.all},...C.categories];
  $("chips").innerHTML=cats.map(c=>`<button class="chip" data-id="${esc(c.id)}" aria-pressed="${c.id===active}">${esc(L(c,"ar","en"))}</button>`).join("");
  $("chips").querySelectorAll(".chip").forEach(b=>b.onclick=()=>{
    active=b.dataset.id;renderChips();
    if(active==="all"){window.scrollTo({top:0});return;}
    const el=$("cat-"+active); if(el) el.scrollIntoView({behavior:matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth",block:"start"});
  });
}
function renderMenu(){
  const q=query.trim().toLowerCase(); let html="",n=0,k=0;
  C.categories.forEach((c,ci)=>{
    const items=c.items.filter(i=>!q||[i.ar,i.en,i.dAr,i.dEn].join(" ").toLowerCase().includes(q));
    if(!items.length) return; n+=items.length;
    html+=section(c,ci,items.map(i=>item(i,++k,c)).join(""));
  });
  $("menu").innerHTML=n?html:`<p class="empty">${T[lang].empty}</p>`;
  if(typeof afterRender==="function") afterRender();
}
function apply(){
  const t=T[lang]; document.documentElement.lang=lang; document.documentElement.dir=t.dir;
  $("langBtn").textContent=t.lang; $("q").placeholder=t.search;
  const note=$("demoNote"); note.hidden=!C.demoBanner; note.textContent=t.demo;
  $("note").textContent=t.note||"";
  $("credit").innerHTML=(lang==="ar"?"منيو ديجيتال من تصميم ":"Digital menu designed by ")+`<strong>${lang==="en"?"Mohamed":"محمد"}</strong>`;
  if(typeof hero==="function") hero();
  renderChips(); renderMenu();
}
$("langBtn").onclick=()=>{lang=lang==="ar"?"en":"ar";try{localStorage.setItem(KEY,lang)}catch(e){}apply();};
$("q").addEventListener("input",e=>{query=e.target.value;renderMenu();});
apply();
</script>
<script>(function(){if(window.parent===window)return;var s=0,t=0;function send(m){try{parent.postMessage(m,"*")}catch(e){}}
addEventListener("scroll",function(){if(!s){s=1;send("concept-scrolled")}},{passive:true});
addEventListener("pointerdown",function(){if(!t){t=1;send("concept-touched")}},{passive:true})})()</script>
</body>
</html>
