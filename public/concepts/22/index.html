<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Concept 22</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#15131c">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@500;700;800&family=Fredoka:wght@500;600;700&display=swap" media="print" onload="this.media='all'"><noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@500;700;800&family=Fredoka:wght@500;600;700&display=swap"></noscript>
<style>
*,*::before,*::after{box-sizing:border-box}
body{margin:0;overflow-x:hidden;-webkit-font-smoothing:antialiased;line-height:1.55;padding-bottom:env(safe-area-inset-bottom,0px)}
.demo-note{text-align:center;font-size:.8rem;padding:.45rem 1rem}
.empty{text-align:center;padding:3rem 1rem;opacity:.75}
button{font:inherit}

:root{--night:#15131c;--night2:#1f1b28;--neon:#f6e04b;--glow:#2d5bff;--terra:#b5432e;--gold:#c9a45c;--ink:#f5f1e6;--soft:#b9b3c6;--card:#221e2c;--line:#34304a}
body{background:var(--night);color:var(--ink);font-family:"Fredoka","Baloo Bhaijaan 2",system-ui,sans-serif}
html[lang=ar] body{font-family:"Baloo Bhaijaan 2","Fredoka",sans-serif}
.demo-note{background:var(--neon);color:var(--night);font-weight:700}

header{position:relative;text-align:center;padding:calc(env(safe-area-inset-top,0px) + 3rem) 1.2rem 2rem;background:linear-gradient(180deg,#eeeae3 0 58%,var(--terra) 58%)}
.lang{position:absolute;top:calc(env(safe-area-inset-top,0px) + .8rem);inset-inline-end:1rem;background:var(--night);color:var(--neon);border:0;border-radius:999px;padding:.3rem .95rem;cursor:pointer;min-height:36px;font-weight:700;font-size:.8rem}
#logo{display:inline-block;padding:1rem 1.4rem;background:#eeeae3;border-radius:14px}
.hand{width:120px;height:120px;filter:drop-shadow(0 0 6px rgba(246,224,75,.9)) drop-shadow(0 0 18px rgba(45,91,255,.75))}
.nm1{font:700 1.5rem "Fredoka";letter-spacing:.14em;color:#2a2438;margin-top:.2rem;direction:ltr}
.info{display:inline-block;margin:1rem 0 0;background:var(--night);color:var(--ink);border-radius:999px;padding:.25rem .9rem;font-size:.8rem}
.lane{display:inline-block;margin:.5rem .3rem 0;border:1.5px solid var(--neon);color:var(--neon);border-radius:999px;padding:.1rem .7rem;font-size:.75rem;font-weight:600;background:rgba(21,19,28,.6)}
.bar{position:sticky;top:0;z-index:5;background:var(--night);border-bottom:1px solid var(--line)}
.bar-in{max-width:560px;margin:0 auto;padding:.6rem 1.2rem .4rem}
.search input{width:100%;border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:14px;padding:.55rem 1rem;font:inherit}
.search input::placeholder{color:var(--soft)}
.chips{display:flex;gap:.45rem;overflow-x:auto;padding:.55rem 0 .2rem;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;border:1.5px solid var(--line);background:none;color:var(--ink);border-radius:999px;padding:.3rem .95rem;cursor:pointer;min-height:36px;font-weight:600;font-size:.85rem}
.chip[aria-pressed="true"]{border-color:var(--neon);color:var(--neon);box-shadow:0 0 12px rgba(246,224,75,.45),inset 0 0 8px rgba(246,224,75,.25)}
.chip:focus-visible,.lang:focus-visible,.search input:focus-visible{outline:2px solid var(--neon);outline-offset:2px}
main{max-width:560px;margin:0 auto;padding:.5rem 1.2rem 1.5rem}
section{margin-top:1.7rem;scroll-margin-top:120px}

h2{margin:0 0 .6rem;font:700 1.5rem "Fredoka";color:var(--neon);text-shadow:0 0 6px rgba(246,224,75,.8),0 0 18px rgba(45,91,255,.7)}
html[lang=ar] h2{font:800 1.45rem "Baloo Bhaijaan 2"}
.it{display:flex;justify-content:space-between;align-items:center;gap:.6rem;background:var(--card);border-radius:14px;padding:.65rem .9rem;margin:.45rem 0;border:1px solid var(--line)}
.nm{font-weight:600}
.pr{font-weight:700;white-space:nowrap;color:var(--night);background:var(--gold);border-radius:999px;padding:.05rem .6rem;direction:ltr}
.pr small{font-size:.65rem;margin-inline-start:.2rem}
.foot{text-align:center;color:var(--soft);font-size:.8rem;padding:.5rem 1rem 2.2rem}.foot strong{color:var(--ink)}

</style>
</head>
<body>
<div class="demo-note" id="demoNote" hidden></div>

<header>
  <button class="lang" id="langBtn">English</button>
  <div id="logo"><span class="concept-wm" style="display:block;font-family:'Fredoka',serif;font-weight:700;font-size:clamp(2.2rem,11vw,3.4rem);line-height:1.05;letter-spacing:-.01em;direction:ltr;white-space:nowrap">Concept 22</span></div>
  <div><span class="info" id="info"></span></div>
  <div id="lanes"></div>
</header>

<div class="bar"><div class="bar-in">
  <div class="search"><input id="q" type="search" aria-label="Search"></div>
  <nav class="chips" id="chips" aria-label="Categories"></nav>
</div></div>
<main id="menu"></main>
<footer class="foot"><p id="note"></p><p id="credit"></p></footer>
<script>
const CONFIG = {"name":"Concept 22","nameAr":"Concept 22","tagline":{"ar":"Specialty Coffee","en":"Specialty Coffee"},"info":{"ar":"الرياض","en":"Riyadh"},"logo":"","colors":{"primary":"#15131c","onPrimary":"#f6e04b","secondary":"#b5432e","background":"#15131c","accent":"#f6e04b"},"fonts":{"display":"Fredoka","body":"Baloo Bhaijaan 2"},"pattern":"neon","currency":{"ar":"ر.س","en":"SAR"},"demoBanner":true,"credit":"محمد","categories":[{"id":"hot","ar":"قهوة حارة","en":"Hot Coffee","items":[{"ar":"إسبريسو","en":"Espresso","p":12},{"ar":"أمريكانو","en":"Americano","p":14},{"ar":"كورتادو","en":"Cortado","p":16},{"ar":"فلات وايت","en":"Flat White","p":17},{"ar":"لاتيه","en":"Latte","p":17},{"ar":"سبانش لاتيه","en":"Spanish Latte","p":19}]},{"id":"cold","ar":"قهوة باردة","en":"Iced Coffee","items":[{"ar":"آيس لاتيه","en":"Iced Latte","p":18},{"ar":"آيس سبانش لاتيه","en":"Iced Spanish Latte","p":20},{"ar":"كولد برو","en":"Cold Brew","p":18}]},{"id":"refresh","ar":"منعشات","en":"Refreshers","items":[{"ar":"موهيتو","en":"Mojito","p":20},{"ar":"آيس ماتشا","en":"Iced Matcha","p":22},{"ar":"آيس تي","en":"Iced Tea","p":15}]},{"id":"sweet","ar":"حلى","en":"Sweets","items":[{"ar":"تشيز كيك","en":"Cheesecake","p":24},{"ar":"كوكيز","en":"Cookie","p":10},{"ar":"كرواسون","en":"Croissant","p":12}]}]};
const C = CONFIG || {name:"Menu",categories:[]};
const T = {"ar": {"dir": "rtl", "lang": "English", "search": "وش تبي تطلب؟", "empty": "ما لقينا شي بهالاسم.", "all": "الكل", "demo": "تصور تجريبي — الأصناف والأسعار أمثلة وليست منيو المحل", "note": "", "lanes": ["جلسات", "درايف ثرو", "مفتوح ٢٤ ساعة"]}, "en": {"dir": "ltr", "lang": "العربية", "search": "What would you like?", "empty": "Nothing matches that.", "all": "All", "demo": "Demo — items and prices are examples, not the café's menu", "note": "", "lanes": ["Dine-in", "Drive-thru", "Open 24 hours"]}};
let lang="ar", active="all", query="";
const KEY="Concept 22-lang";
try{const s=localStorage.getItem(KEY);if(s==="ar"||s==="en")lang=s;}catch(e){}
try{const u=new URLSearchParams(location.search).get("lang");if(u==="ar"||u==="en")lang=u;}catch(e){}
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmt=n=>lang==="ar"?Number(n).toLocaleString("ar-EG"):Number(n).toLocaleString("en-US");
const cur=()=> (C.currency||{ar:"",en:""})[lang];
const L=(o,ar,en)=> lang==="ar" ? (o[ar]||o[en]||"") : (o[en]||o[ar]||"");
const P=i=> i.p2!=null ? `${fmt(i.p)}<span class="sl">/</span>${fmt(i.p2)}` : fmt(i.p);

function hero(){ $("info").textContent=L(C.info||{},"ar","en"); $("lanes").innerHTML=T[lang].lanes.map(x=>`<span class="lane">${x}</span>`).join(""); }
function section(c,ci,body){ return `<section id="cat-${esc(c.id)}"><h2>${esc(L(c,"ar","en"))}</h2>${body}</section>`; }
function item(i){ return `<div class="it"><span class="nm">${esc(L(i,"ar","en"))}</span><span class="pr">${fmt(i.p)}<small>${cur()}</small></span></div>`; }

function renderChips(){
  const cats=[{id:"all",ar:T.ar.all,en:T.en.all},...C.categories];
  $("chips").innerHTML=cats.map(c=>`<button class="chip" data-id="${esc(c.id)}" aria-pressed="${c.id===active}">${esc(L(c,"ar","en"))}</button>`).join("");
  $("chips").querySelectorAll(".chip").forEach(b=>b.onclick=()=>{
    active=b.dataset.id;renderChips();
    if(active==="all"){window.scrollTo({top:0});return;}
    const el=$("cat-"+active); if(el) el.scrollIntoView({behavior:matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth",block:"start"});
  });
}
function renderMenu(){
  const q=query.trim().toLowerCase(); let html="",n=0,k=0;
  C.categories.forEach((c,ci)=>{
    const items=c.items.filter(i=>!q||[i.ar,i.en,i.dAr,i.dEn].join(" ").toLowerCase().includes(q));
    if(!items.length) return; n+=items.length;
    html+=section(c,ci,items.map(i=>item(i,++k,c)).join(""));
  });
  $("menu").innerHTML=n?html:`<p class="empty">${T[lang].empty}</p>`;
  if(typeof afterRender==="function") afterRender();
}
function apply(){
  const t=T[lang]; document.documentElement.lang=lang; document.documentElement.dir=t.dir;
  $("langBtn").textContent=t.lang; $("q").placeholder=t.search;
  const note=$("demoNote"); note.hidden=!C.demoBanner; note.textContent=t.demo;
  $("note").textContent=t.note||"";
  $("credit").innerHTML=(lang==="ar"?"منيو ديجيتال من تصميم ":"Digital menu designed by ")+`<strong>${lang==="en"?"Mohamed":"محمد"}</strong>`;
  if(typeof hero==="function") hero();
  renderChips(); renderMenu();
}
$("langBtn").onclick=()=>{lang=lang==="ar"?"en":"ar";try{localStorage.setItem(KEY,lang)}catch(e){}apply();};
$("q").addEventListener("input",e=>{query=e.target.value;renderMenu();});
apply();
</script>
<script>(function(){if(window.parent===window)return;var s=0,t=0;function send(m){try{parent.postMessage(m,"*")}catch(e){}}
addEventListener("scroll",function(){if(!s){s=1;send("concept-scrolled")}},{passive:true});
addEventListener("pointerdown",function(){if(!t){t=1;send("concept-touched")}},{passive:true})})()</script>
</body>
</html>
