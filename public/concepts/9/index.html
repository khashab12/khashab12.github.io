<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Concept 9</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#e0553a">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lemonada:wght@600;700&family=League+Spartan:wght@500;700;800&family=Readex+Pro:wght@400;500;700&display=swap">
<style>
*,*::before,*::after{box-sizing:border-box}
body{margin:0;overflow-x:hidden;-webkit-font-smoothing:antialiased;line-height:1.55;padding-bottom:env(safe-area-inset-bottom,0px)}
.demo-note{text-align:center;font-size:.8rem;padding:.45rem 1rem}
.empty{text-align:center;padding:3rem 1rem;opacity:.75}
button{font:inherit}

:root{--sage:#9fcfae;--sage2:#b7dcc2;--butter:#ffe08a;--coral:#e0553a;--ink:#2f3b30;--soft:#4f6152;--card:#f4faf2;--line:#86b995}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--sage:#17271c;--sage2:#1f3526;--card:#203127;--ink:#f1f7ef;--soft:#b9d2bf;--line:#35533e}}
:root[data-theme="dark"]{--sage:#17271c;--sage2:#1f3526;--card:#203127;--ink:#f1f7ef;--soft:#b9d2bf;--line:#35533e}
body{background:var(--sage);color:var(--ink);font-family:"League Spartan","Readex Pro",system-ui,sans-serif}
html[lang=ar] body{font-family:"Readex Pro","League Spartan",sans-serif}
.demo-note{background:var(--coral);color:#fff}
header{position:relative;max-width:560px;margin:0 auto;padding:calc(env(safe-area-inset-top,0px) + 3rem) 1.2rem 1rem;text-align:center;overflow:hidden}
.lang{position:absolute;top:calc(env(safe-area-inset-top,0px) + .8rem);inset-inline-end:1rem;background:var(--coral);color:#fff;border:0;border-radius:999px;padding:.3rem .95rem;cursor:pointer;min-height:36px;font-weight:700;font-size:.8rem;z-index:2}

.bigc{position:absolute;inset-inline-end:-40px;bottom:-60px;font:700 16rem/1 "Lemonada",serif;color:var(--butter);opacity:.55;pointer-events:none;direction:ltr}
#logo{position:relative;display:inline-block;padding:.6rem 1.4rem;background:#f4faf2;border-radius:999px;border:3px solid #2f3b30;box-shadow:5px 5px 0 #2f3b30}
.wm{font:700 2.4rem/1.1 "Lemonada",serif;color:#8fc49f;-webkit-text-stroke:1.5px #2f3b30;direction:ltr}
.sp{font:700 .62rem "League Spartan";letter-spacing:.3em;color:#2f3b30;direction:ltr}
.oval{display:inline-block;margin-top:1rem;border:2px solid var(--coral);color:var(--coral);border-radius:50%;padding:.25rem 1rem;font:800 .95rem "League Spartan";transform:rotate(-6deg);background:var(--card)}
.info{position:relative;font-size:.85rem;margin:.8rem 0 0;font-weight:500}
.bar{position:sticky;top:0;z-index:5;background:var(--sage)}
.bar-in{max-width:560px;margin:0 auto;padding:.6rem 1.2rem .4rem}
.search input{width:100%;border:2.5px solid #2f3b30;background:var(--card);color:var(--ink);border-radius:999px;padding:.55rem 1rem;font:inherit}
.chips{display:flex;gap:.45rem;overflow-x:auto;padding:.55rem 0 .3rem;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;border:2px solid #2f3b30;background:var(--card);color:var(--ink);border-radius:999px;padding:.25rem .95rem;cursor:pointer;min-height:36px;font-weight:700;font-size:.85rem}
.chip[aria-pressed="true"]{background:var(--butter);color:#2f3b30;box-shadow:3px 3px 0 #2f3b30}
.chip:focus-visible,.lang:focus-visible,.search input:focus-visible{outline:3px solid var(--coral);outline-offset:2px}
main{max-width:560px;margin:0 auto;padding:.5rem 1.2rem 1.5rem}

section{margin-top:1.6rem;background:var(--card);border:2.5px solid #2f3b30;border-radius:22px;padding:1rem 1.1rem .7rem;box-shadow:6px 6px 0 #2f3b30;scroll-margin-top:120px}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) section{border-color:#0c140f;box-shadow:6px 6px 0 #0c140f}}
h2{margin:0 0 .4rem;font:800 1.15rem "League Spartan";color:var(--coral);letter-spacing:.06em;text-transform:uppercase}
html[lang=ar] h2{font:700 1.15rem "Readex Pro";letter-spacing:0}
.row{display:flex;align-items:baseline;gap:.5rem;padding:.42rem 0}
.nm{font-weight:700;font-size:.95rem;text-transform:uppercase}
html[lang=ar] .nm{text-transform:none;font-weight:500}
.nm small{font-weight:500;font-size:.7rem;color:var(--soft);text-transform:none;margin-inline-start:.3rem}
.dots{flex:1;border-bottom:2px dotted var(--line);transform:translateY(-4px)}
.pr{font:800 1.05rem "League Spartan";white-space:nowrap;direction:ltr}
.pr small{font-size:.62rem;font-weight:700;margin-inline-start:.2rem;color:var(--soft)}
.sl{margin:0 .15rem;color:var(--soft)}
.foot{text-align:center;color:var(--soft);font-size:.8rem;padding:.5rem 1rem 2.2rem}.foot strong{color:var(--ink)}

</style>
</head>
<body>
<div class="demo-note" id="demoNote" hidden></div>

<header>
  <span class="bigc" aria-hidden="true">C</span>
  <button class="lang" id="langBtn">English</button>
  <div id="logo"><span class="concept-wm" style="display:block;font-family:'Lemonada',serif;font-weight:700;font-size:clamp(2.2rem,11vw,3.4rem);line-height:1.05;letter-spacing:-.01em;direction:ltr;white-space:nowrap">Concept 9</span></div>
  <div><span class="oval"></span></div>
  <p class="info" id="info"></p>
</header>

<div class="bar"><div class="bar-in">
  <div class="search"><input id="q" type="search" aria-label="Search"></div>
  <nav class="chips" id="chips" aria-label="Categories"></nav>
</div></div>
<main id="menu"></main>
<footer class="foot"><p id="note"></p><p id="credit"></p></footer>
<script>
const CONFIG = {"name":"Concept 9","nameAr":"Concept 9","tagline":{"ar":"Specialty Coffee","en":"Specialty Coffee"},"info":{"ar":"القاهرة","en":"Cairo"},"logo":"","colors":{"primary":"#e0553a","onPrimary":"#ffffff","secondary":"#ffe08a","background":"#9fcfae","accent":"#e0553a"},"fonts":{"display":"Lemonada","body":"League Spartan"},"pattern":"retro","currency":{"ar":"ج.م","en":"EGP"},"demoBanner":false,"credit":"محمد","categories":[{"id":"classic","ar":"قهوة كلاسيك","en":"Classic Coffee","items":[{"ar":"إسبريسو","en":"Espresso","p":90},{"ar":"أمريكانو","en":"Americano","p":100},{"ar":"ماكياتو","en":"Macchiato","p":100},{"ar":"لاتيه","en":"Latte","p":125},{"ar":"كورتادو","en":"Cortado","p":110},{"ar":"فلات وايت","en":"Flat White","p":110},{"ar":"كابتشينو","en":"Cappuccino","p":135},{"ar":"موكا","en":"Mocha","p":145},{"ar":"قهوة تركي","en":"Turkish Coffee","p":75,"p2":95}]},{"id":"special","ar":"قهوة مختصة","en":"Speciality Coffee","items":[{"ar":"V60","en":"V60","p":175},{"ar":"كيمكس","en":"Chemex","p":175},{"ar":"إيروبرس","en":"AeroPress","p":175},{"ar":"كولد برو","en":"Cold Brew","p":160}]},{"id":"sig","ar":"مشروبات مميزة","en":"Signature Drinks","items":[{"ar":"سبانش لاتيه","en":"Spanish Latte","p":150},{"ar":"كراميل ماكياتو","en":"Caramel Macchiato","p":155},{"ar":"لونج آيلاند","en":"Long Island","p":155},{"ar":"تيا Concept 9","en":"Tia Concept 9","p":170},{"ar":"فيزي مون","en":"Fizzy Moon","p":155},{"ar":"نكتار شوت","en":"Nectar Shot","p":160}]},{"id":"iced","ar":"قهوة ساقعة","en":"Iced Coffee","items":[{"ar":"آيس لاتيه","en":"Iced Latte","p":150},{"ar":"آيس ماتشا","en":"Iced Matcha","dAr":"وايت أو دارك","dEn":"white or dark","p":175},{"ar":"آيس كراميل ماكياتو","en":"Iced Caramel Macchiato","p":165},{"ar":"آيس أمريكانو","en":"Iced Americano","p":120},{"ar":"آيس سبانش لاتيه","en":"Iced Spanish Latte","p":165}]},{"id":"frappe","ar":"فرابيه","en":"Frappe","items":[{"ar":"فرابيه سادة","en":"Plain Frappe","p":160},{"ar":"موكا فرابيه","en":"Mocha Frappe","dAr":"وايت أو دارك","dEn":"white or dark","p":175},{"ar":"كراميل فرابيه","en":"Caramel Frappe","p":170}]},{"id":"non","ar":"من غير قهوة","en":"Non Coffee","items":[{"ar":"هوت شوكليت","en":"Hot Chocolate","p":150}]}]};
const C = CONFIG || {name:"Menu",categories:[]};
const T = {"ar": {"dir": "rtl", "lang": "English", "search": "دوّر على مشروبك…", "empty": "مفيش حاجة بالاسم ده.", "all": "الكل", "demo": "", "note": ""}, "en": {"dir": "ltr", "lang": "العربية", "search": "Find your drink…", "empty": "Nothing matches that.", "all": "All", "demo": "", "note": ""}};
let lang="ar", active="all", query="";
const KEY="Concept 9-lang";
try{const s=localStorage.getItem(KEY);if(s==="ar"||s==="en")lang=s;}catch(e){}
try{const u=new URLSearchParams(location.search).get("lang");if(u==="ar"||u==="en")lang=u;}catch(e){}
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmt=n=>lang==="ar"?Number(n).toLocaleString("ar-EG"):Number(n).toLocaleString("en-US");
const cur=()=> (C.currency||{ar:"",en:""})[lang];
const L=(o,ar,en)=> lang==="ar" ? (o[ar]||o[en]||"") : (o[en]||o[ar]||"");
const P=i=> i.p2!=null ? `${fmt(i.p)}<span class="sl">/</span>${fmt(i.p2)}` : fmt(i.p);

function hero(){ $("info").textContent=L(C.info||{},"ar","en"); }
function section(c,ci,body){ return `<section id="cat-${esc(c.id)}"><h2>${esc(L(c,"ar","en"))}</h2>${body}</section>`; }
function item(i){ const d=L(i,"dAr","dEn"); return `<div class="row"><span class="nm">${esc(L(i,"ar","en"))}${d?`<small>${esc(d)}</small>`:""}</span><span class="dots"></span><span class="pr">${P(i)}<small>${cur()}</small></span></div>`; }

function renderChips(){
  const cats=[{id:"all",ar:T.ar.all,en:T.en.all},...C.categories];
  $("chips").innerHTML=cats.map(c=>`<button class="chip" data-id="${esc(c.id)}" aria-pressed="${c.id===active}">${esc(L(c,"ar","en"))}</button>`).join("");
  $("chips").querySelectorAll(".chip").forEach(b=>b.onclick=()=>{
    active=b.dataset.id;renderChips();
    if(active==="all"){window.scrollTo({top:0});return;}
    const el=$("cat-"+active); if(el) el.scrollIntoView({behavior:matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth",block:"start"});
  });
}
function renderMenu(){
  const q=query.trim().toLowerCase(); let html="",n=0,k=0;
  C.categories.forEach((c,ci)=>{
    const items=c.items.filter(i=>!q||[i.ar,i.en,i.dAr,i.dEn].join(" ").toLowerCase().includes(q));
    if(!items.length) return; n+=items.length;
    html+=section(c,ci,items.map(i=>item(i,++k,c)).join(""));
  });
  $("menu").innerHTML=n?html:`<p class="empty">${T[lang].empty}</p>`;
  if(typeof afterRender==="function") afterRender();
}
function apply(){
  const t=T[lang]; document.documentElement.lang=lang; document.documentElement.dir=t.dir;
  $("langBtn").textContent=t.lang; $("q").placeholder=t.search;
  const note=$("demoNote"); note.hidden=!C.demoBanner; note.textContent=t.demo;
  $("note").textContent=t.note||"";
  $("credit").innerHTML=(lang==="ar"?"منيو ديجيتال من تصميم ":"Digital menu designed by ")+`<strong>${lang==="en"?"Mohamed":"محمد"}</strong>`;
  if(typeof hero==="function") hero();
  renderChips(); renderMenu();
}
$("langBtn").onclick=()=>{lang=lang==="ar"?"en":"ar";try{localStorage.setItem(KEY,lang)}catch(e){}apply();};
$("q").addEventListener("input",e=>{query=e.target.value;renderMenu();});
apply();
</script>
</body>
</html>
