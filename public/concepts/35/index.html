<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Concept 35</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#1f46d8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;700;800&family=Tajawal:wght@500;700;800&family=Pacifico&display=swap" media="print" onload="this.media='all'"><noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;700;800&family=Tajawal:wght@500;700;800&family=Pacifico&display=swap"></noscript>
<style>
*,*::before,*::after{box-sizing:border-box}
body{margin:0;overflow-x:hidden;-webkit-font-smoothing:antialiased;line-height:1.55;padding-bottom:env(safe-area-inset-bottom,0px)}
.demo-note{text-align:center;font-size:.8rem;padding:.45rem 1rem}
.empty{text-align:center;padding:3rem 1rem;opacity:.75}
button{font:inherit}

:root{--blue:#1f46d8;--blue2:#2f7cf2;--yellow:#f7d31a;--lime:#b8e04a;--paper:#fffbea;--ink:#12205e;--soft:#4b5a99;--card:#ffffff}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--paper:#0c1233;--card:#131c4a;--ink:#f3f5ff;--soft:#aab4e6}}
:root[data-theme="dark"]{--paper:#0c1233;--card:#131c4a;--ink:#f3f5ff;--soft:#aab4e6}
body{background:var(--paper);color:var(--ink);font-family:"Poppins","Tajawal",system-ui,sans-serif}
html[lang=ar] body{font-family:"Tajawal","Poppins",sans-serif;font-size:16px}
.demo-note{background:var(--yellow);color:var(--blue)}
header{position:relative;background:linear-gradient(160deg,var(--blue2),var(--blue));color:#fff;text-align:center;padding:calc(env(safe-area-inset-top,0px) + 3rem) 1.2rem 2.4rem;overflow:hidden}
header::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:28px;background:var(--paper);clip-path:polygon(0 60%,8% 20%,18% 70%,30% 25%,42% 75%,55% 20%,68% 70%,80% 25%,92% 65%,100% 30%,100% 100%,0 100%)}
.doodle{position:absolute;inset:0;opacity:.12;font-size:2rem;line-height:2.4;letter-spacing:1.4rem;word-break:break-all;pointer-events:none;direction:ltr}
.lang{position:absolute;top:calc(env(safe-area-inset-top,0px) + .8rem);inset-inline-end:1rem;background:var(--yellow);color:var(--blue);border:0;border-radius:999px;padding:.3rem .95rem;cursor:pointer;min-height:36px;font-weight:800;font-size:.8rem;z-index:2}
#logo{position:relative;display:inline-block;padding:.6rem 1.2rem;background:var(--blue);border-radius:10px;direction:ltr}

.w{font:800 3.6rem/1 "Poppins";color:var(--yellow);letter-spacing:.04em;display:flex;align-items:center;justify-content:center;gap:.08em}
.e3{display:inline-flex;flex-direction:column;justify-content:space-between;height:.72em;width:.5em}
.e3 i{display:block;height:.14em;background:var(--yellow);border-radius:1px}
.em{font:400 1.05rem "Pacifico",cursive;color:var(--lime);margin-top:.1rem}
.info{position:relative;font-size:.85rem;margin:.9rem 0 0;opacity:.92}
.bar{position:sticky;top:0;z-index:5;background:var(--paper)}
.bar-in{max-width:620px;margin:0 auto;padding:.6rem 1.2rem .4rem}
.search input{width:100%;border:2.5px solid var(--blue);background:var(--card);color:var(--ink);border-radius:12px;padding:.55rem 1rem;font:inherit}
.chips{display:flex;gap:.45rem;overflow-x:auto;padding:.55rem 0 .2rem;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;border:0;background:var(--blue);color:#fff;font-weight:700;font-size:.82rem;padding:.3rem .9rem;border-radius:999px;cursor:pointer;min-height:36px;text-transform:uppercase}
.chip[aria-pressed="true"]{background:var(--yellow);color:var(--blue)}
.chip:focus-visible,.lang:focus-visible,.search input:focus-visible{outline:3px solid var(--lime);outline-offset:2px}
main{max-width:620px;margin:0 auto;padding:.5rem 1.2rem 1.5rem}
section{margin-top:1.7rem;scroll-margin-top:120px}

h2{display:inline-block;margin:0 0 .6rem;padding:.2rem 1.2rem;background:var(--yellow);color:var(--blue);font:800 1rem "Poppins";letter-spacing:.12em;text-transform:uppercase;clip-path:polygon(2% 10%,98% 0,100% 55%,97% 100%,3% 92%,0 45%)}
html[lang=ar] h2{font:800 1.1rem "Tajawal";letter-spacing:0}
.tbl{background:var(--card);border-radius:14px;padding:.4rem .8rem;box-shadow:0 8px 20px -14px rgba(31,70,216,.6)}
.hd,.row{display:grid;grid-template-columns:1fr 4rem 3.2rem;align-items:center;gap:.4rem}
.hd{font:700 .62rem "Poppins";letter-spacing:.1em;color:var(--soft);padding:.3rem 0;text-align:center}
.hd span:first-child{text-align:start}
.row{padding:.42rem 0;border-top:1px dashed color-mix(in srgb,var(--blue) 25%,transparent)}
.nm{font-weight:700;font-size:.95rem}
.pr{text-align:center;font-weight:800;color:var(--blue);direction:ltr}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .pr{color:var(--yellow)}}
:root[data-theme="dark"] .pr{color:var(--yellow)}
.cal{justify-self:center;background:color-mix(in srgb,var(--blue2) 16%,transparent);color:var(--ink);border-radius:999px;font:600 .72rem "Poppins";padding:.05rem .45rem;min-width:2.6rem;text-align:center}
.foot{text-align:center;color:var(--soft);font-size:.8rem;padding:.5rem 1rem 2.2rem}.foot strong{color:var(--ink)}

</style>
</head>
<body>
<div class="demo-note" id="demoNote" hidden></div>

<header>
  <div class="doodle" aria-hidden="true">☕🥐🧋☕🍪🥤☕🥐🧋☕🍪🥤☕🥐🧋☕🍪🥤☕🥐🧋☕🍪🥤</div>
  <button class="lang" id="langBtn">English</button>
  <div id="logo"><span class="concept-wm" style="display:block;font-family:'Poppins',serif;font-weight:700;font-size:clamp(2.2rem,11vw,3.4rem);line-height:1.05;letter-spacing:-.01em;direction:ltr;white-space:nowrap">Concept 35</span></div>
  <p class="info" id="info"></p>
</header>

<div class="bar"><div class="bar-in">
  <div class="search"><input id="q" type="search" aria-label="Search"></div>
  <nav class="chips" id="chips" aria-label="Categories"></nav>
</div></div>
<main id="menu"></main>
<footer class="foot"><p id="note"></p><p id="credit"></p></footer>
<script>
const CONFIG = {"name":"Concept 35","nameAr":"Concept 35","tagline":{"ar":"Specialty Coffee","en":"Specialty Coffee"},"info":{"ar":"الرياض","en":"Riyadh"},"logo":"","colors":{"primary":"#1f46d8","onPrimary":"#ffffff","secondary":"#f7d31a","background":"#fffbea","accent":"#b8e04a"},"fonts":{"display":"Poppins","body":"Tajawal"},"pattern":"coffee doodles","currency":{"ar":"ر.س","en":"SAR"},"demoBanner":false,"credit":"محمد","categories":[{"id":"hot","ar":"قهوة ومشروبات حارة","en":"Coffee & Hot Drinks","items":[{"ar":"قهوة اليوم","en":"Coffee of the Day","p":9,"c":5},{"ar":"إسبريسو","en":"Espresso","p":10,"c":4},{"ar":"فلات وايت","en":"Flat White","p":14,"c":170},{"ar":"كورتادو","en":"Cortado","p":13,"c":60},{"ar":"أمريكانو","en":"Americano","p":11,"c":5},{"ar":"كابتشينو","en":"Cappuccino","p":15,"c":125},{"ar":"ماتشا لاتيه حار","en":"Hot Matcha Latte","p":22,"c":180},{"ar":"سبانش لاتيه","en":"Spanish Latte","p":16,"c":318},{"ar":"كراميل لاتيه حار","en":"Hot Caramel Latte","p":18,"c":186},{"ar":"هوت شوكليت","en":"Hot Chocolate","p":18,"c":180},{"ar":"لاتيه حار","en":"Hot Latte","p":16,"c":170},{"ar":"V60 حار","en":"Hot V60","p":16,"c":10}]},{"id":"cold","ar":"مشروبات باردة","en":"Cold Drinks","items":[{"ar":"قهوة اليوم باردة","en":"Coffee of the Day","p":10,"c":5},{"ar":"آيس لاتيه","en":"Iced Latte","p":16,"c":156},{"ar":"آيس ماتشا","en":"Iced Matcha","p":23,"c":188},{"ar":"آيس سبانش لاتيه","en":"Iced Spanish Latte","p":17,"c":316},{"ar":"آيس أمريكانو","en":"Iced Americano","p":12,"c":5},{"ar":"V60 بارد","en":"V60","p":17,"c":10},{"ar":"آيس كراميل ماكياتو","en":"Iced Caramel Macchiato","p":19,"c":186},{"ar":"ماء","en":"Water","p":2,"c":0}]},{"id":"sig","ar":"مشروبات ثري الخاصة","en":"Concept 35 Signature","items":[{"ar":"بلو سكاي","en":"Blue Sky","p":25,"c":150},{"ar":"تشيل ويف","en":"Chill Wave","p":25,"c":150},{"ar":"مورنينق ديو","en":"Morning Dew","p":25,"c":150}]},{"id":"mojito","ar":"موهيتو","en":"Mojito","items":[{"ar":"موهيتو فراولة","en":"Strawberry Mojito","p":23,"c":160},{"ar":"موهيتو توت","en":"Raspberry Mojito","p":23,"c":160},{"ar":"موهيتو لافندر","en":"Lavender Mojito","p":23,"c":160}]},{"id":"tea","ar":"آيس تي","en":"Ice Tea","items":[{"ar":"آيس تي خوخ","en":"Ice Tea Peach","p":19,"c":125},{"ar":"آيس تي باشن فروت","en":"Ice Tea Passion Fruit","p":19,"c":125},{"ar":"آيس كركديه","en":"Ice Karkadeh","p":19,"c":125}]},{"id":"bakery","ar":"مخبوزات","en":"Bakery","items":[{"ar":"كرواسون سادة","en":"Plain Croissant","p":12,"c":236},{"ar":"كرواسون زعتر","en":"Zaatar Croissant","p":14,"c":275},{"ar":"كرواسون جبن","en":"Cheese Croissant","p":14,"c":275},{"ar":"كرواسون شوكولاتة","en":"Chocolate Croissant","p":14,"c":276},{"ar":"شوكليت ويل","en":"Chocolate Wheel","p":16,"c":377},{"ar":"دانش بيكان كراميل","en":"Danish Pecan Caramel","p":18,"c":282}]},{"id":"sand","ar":"ساندويتشات","en":"Sandwiches","items":[{"ar":"ميكس جبن","en":"Mix Cheese","p":16,"c":293},{"ar":"دجاج بالكريمة","en":"Chicken Cream","p":16,"c":334},{"ar":"تونة حارة","en":"Hot Tuna","p":16,"c":220}]},{"id":"sweets","ar":"حلى","en":"Sweets","items":[{"ar":"كيكة ثري","en":"Concept 35 Cake","p":25,"c":420},{"ar":"كيكة التمر","en":"Dates Cake","p":16,"c":300},{"ar":"كيكة الموز","en":"Banana Cake","p":14,"c":225},{"ar":"تشيز كيك فراولة","en":"Cheesecake Strawberry","p":16,"c":223},{"ar":"كيكة الليمون","en":"Lemon Cake","p":14,"c":220},{"ar":"ماربل كيك","en":"Marble Cake","p":14,"c":255},{"ar":"براونيز كوكيز","en":"Brownie Cookies","p":14,"c":376},{"ar":"كوكيز شوكولاتة","en":"Chocolate Cookies","p":14,"c":303},{"ar":"ميني براونيز","en":"Mini Brownies","p":3,"c":100},{"ar":"جار كيك","en":"Jar Cake","p":15,"c":370},{"ar":"تيراميسو","en":"Tiramisu","p":22,"c":540},{"ar":"سان سباستيان","en":"San Sebastian Cake","p":22,"c":450},{"ar":"كيكة لوتس","en":"Lotus Cake","p":23,"c":420}]}]};
const C = CONFIG || {name:"Menu",categories:[]};
const T = {"ar": {"dir": "rtl", "lang": "English", "search": "وش تبي تطلب؟", "empty": "ما لقينا شي بهالاسم.", "all": "الكل", "demo": "", "note": "", "pr": "السعر", "cal": "سعرات"}, "en": {"dir": "ltr", "lang": "العربية", "search": "What are you craving?", "empty": "Nothing matches that.", "all": "All", "demo": "", "note": "", "pr": "PRICE", "cal": "CAL"}};
let lang="ar", active="all", query="";
const KEY="Concept 35-lang";
try{const s=localStorage.getItem(KEY);if(s==="ar"||s==="en")lang=s;}catch(e){}
try{const u=new URLSearchParams(location.search).get("lang");if(u==="ar"||u==="en")lang=u;}catch(e){}
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmt=n=>lang==="ar"?Number(n).toLocaleString("ar-EG"):Number(n).toLocaleString("en-US");
const cur=()=> (C.currency||{ar:"",en:""})[lang];
const L=(o,ar,en)=> lang==="ar" ? (o[ar]||o[en]||"") : (o[en]||o[ar]||"");
const P=i=> i.p2!=null ? `${fmt(i.p)}<span class="sl">/</span>${fmt(i.p2)}` : fmt(i.p);

function hero(){ $("info").textContent=L(C.info||{},"ar","en"); }
function section(c,ci,body){ const t=T[lang]; return `<section id="cat-${esc(c.id)}"><h2>${esc(L(c,"ar","en"))}</h2><div class="tbl"><div class="hd"><span></span><span>${t.pr} · ${cur()}</span><span>${t.cal}</span></div>${body}</div></section>`; }
function item(i){ return `<div class="row"><span class="nm">${esc(L(i,"ar","en"))}</span><span class="pr">${fmt(i.p)}</span><span class="cal">${fmt(i.c)}</span></div>`; }

function renderChips(){
  const cats=[{id:"all",ar:T.ar.all,en:T.en.all},...C.categories];
  $("chips").innerHTML=cats.map(c=>`<button class="chip" data-id="${esc(c.id)}" aria-pressed="${c.id===active}">${esc(L(c,"ar","en"))}</button>`).join("");
  $("chips").querySelectorAll(".chip").forEach(b=>b.onclick=()=>{
    active=b.dataset.id;renderChips();
    if(active==="all"){window.scrollTo({top:0});return;}
    const el=$("cat-"+active); if(el) el.scrollIntoView({behavior:matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth",block:"start"});
  });
}
function renderMenu(){
  const q=query.trim().toLowerCase(); let html="",n=0,k=0;
  C.categories.forEach((c,ci)=>{
    const items=c.items.filter(i=>!q||[i.ar,i.en,i.dAr,i.dEn].join(" ").toLowerCase().includes(q));
    if(!items.length) return; n+=items.length;
    html+=section(c,ci,items.map(i=>item(i,++k,c)).join(""));
  });
  $("menu").innerHTML=n?html:`<p class="empty">${T[lang].empty}</p>`;
  if(typeof afterRender==="function") afterRender();
}
function apply(){
  const t=T[lang]; document.documentElement.lang=lang; document.documentElement.dir=t.dir;
  $("langBtn").textContent=t.lang; $("q").placeholder=t.search;
  const note=$("demoNote"); note.hidden=!C.demoBanner; note.textContent=t.demo;
  $("note").textContent=t.note||"";
  $("credit").innerHTML=(lang==="ar"?"منيو ديجيتال من تصميم ":"Digital menu designed by ")+`<strong>${lang==="en"?"Mohamed":"محمد"}</strong>`;
  if(typeof hero==="function") hero();
  renderChips(); renderMenu();
}
$("langBtn").onclick=()=>{lang=lang==="ar"?"en":"ar";try{localStorage.setItem(KEY,lang)}catch(e){}apply();};
$("q").addEventListener("input",e=>{query=e.target.value;renderMenu();});
apply();
</script>
<script>(function(){if(window.parent===window)return;var s=0,t=0;function send(m){try{parent.postMessage(m,"*")}catch(e){}}
addEventListener("scroll",function(){if(!s){s=1;send("concept-scrolled")}},{passive:true});
addEventListener("pointerdown",function(){if(!t){t=1;send("concept-touched")}},{passive:true})})()</script>
</body>
</html>
